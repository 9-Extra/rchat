<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AIRP</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Microsoft YaHei", system-ui, sans-serif; background: #1a1b1e; color: #ddd; height: 100vh; display: flex; flex-direction: column; }
  button { cursor: pointer; background: #3a3d42; color: #ddd; border: 1px solid #555; border-radius: 4px; padding: 2px 10px; font-size: 13px; }
  button:hover { background: #4a4d52; }
  button:disabled { opacity: .4; cursor: default; }
  select, input[type=text] { background: #2a2c30; color: #ddd; border: 1px solid #555; border-radius: 4px; padding: 4px 8px; }
  #layout { flex: 1; display: flex; min-height: 0; }
  aside { width: 220px; border-right: 1px solid #333; padding: 10px; overflow-y: auto; flex-shrink: 0; }
  aside h3 { font-size: 14px; margin-bottom: 8px; }
  #sessionList { list-style: none; margin-top: 8px; }
  #sessionList li { padding: 6px 8px; border-radius: 4px; cursor: pointer; font-size: 13px; display: flex; align-items: center; gap: 6px; }
  #sessionList li .sname { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #sessionList li .del { display: none; padding: 0 6px; font-size: 13px; line-height: 1.4; }
  #sessionList li:hover .del { display: block; }
  #sessionList li:hover { background: #2a2c30; }
  #sessionList li.active { background: #3a4a6a; }
  main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #toolbar { display: flex; gap: 10px; align-items: center; padding: 8px 14px; border-bottom: 1px solid #333; flex-wrap: wrap; }
  #toolbar .sessname { font-weight: bold; }
  #chat { flex: 1; overflow-y: auto; padding: 16px 24px; }
  .block { max-width: 860px; margin: 0 auto 14px; background: #24262b; border: 1px solid #35383e; border-radius: 8px; padding: 12px 16px; position: relative; }
  .block.user { background: #26303c; }
  .block.beginning { border-color: #6a5a3a; }
  .block .tag { font-size: 12px; color: #888; margin-bottom: 6px; }
  .block .ops { position: absolute; top: 8px; right: 10px; display: flex; gap: 6px; }
  .block .content { white-space: pre-wrap; line-height: 1.7; word-break: break-word; }
  .options { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .options button { background: #2c3a4e; border-color: #456; font-size: 12px; max-width: 100%; white-space: normal; text-align: left; }
  details.thinking { margin-bottom: 8px; background: #1f2126; border-radius: 6px; padding: 6px 10px; }
  details.thinking summary { color: #8a8; font-size: 12px; cursor: pointer; }
  details.thinking div { white-space: pre-wrap; color: #999; font-size: 13px; margin-top: 6px; line-height: 1.6; }
  .edittext { width: 100%; min-height: 140px; background: #1f2126; color: #ddd; border: 1px solid #555; border-radius: 6px; padding: 8px; font-family: inherit; line-height: 1.6; }
  #composer { border-top: 1px solid #333; padding: 12px 24px; display: flex; gap: 10px; }
  #input { flex: 1; resize: none; height: 64px; background: #24262b; color: #ddd; border: 1px solid #444; border-radius: 8px; padding: 8px 10px; font-family: inherit; line-height: 1.5; }
  #send { height: 64px; padding: 0 22px; }
  #emptyHint { color: #666; text-align: center; margin-top: 40px; }
  #modalMask { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: none; align-items: center; justify-content: center; }
  #modal { background: #24262b; border: 1px solid #444; border-radius: 10px; padding: 20px; width: 420px; display: flex; flex-direction: column; gap: 12px; }
  #modal label { font-size: 13px; color: #aaa; display: block; margin-bottom: 4px; }
  #modal select, #modal input { width: 100%; }
  #modal .row { display: flex; gap: 10px; justify-content: flex-end; }
</style>
</head>
<body>
<div id="layout">
  <aside>
    <button id="newSessionBtn" style="width:100%">新建会话</button>
    <h3 style="margin-top:14px">会话</h3>
    <ul id="sessionList"></ul>
  </aside>
  <main>
    <div id="toolbar" style="display:none">
      <span class="sessname" id="sessName"></span>
      <label>预设 <select id="presetSelect"></select></label>
      <button id="previewBtn">预览上下文</button>
    </div>
    <div id="chat"><div id="emptyHint">请选择或新建一个会话</div></div>
    <div id="composer" style="display:none">
      <textarea id="input" placeholder="输入你的行动或对话…（Ctrl+Enter 发送）"></textarea>
      <button id="send">发送</button>
    </div>
  </main>
</div>

<div id="modalMask">
  <div id="modal">
    <h3>新建会话</h3>
    <div><label>名称（留空自动生成）</label><input type="text" id="mName"></div>
    <div><label>角色卡</label><select id="mCard"></select></div>
    <div><label>预设</label><select id="mPreset"></select></div>
    <div><label>开局</label><select id="mBeginning"></select></div>
    <div class="row"><button id="mCancel">取消</button><button id="mCreate">创建</button></div>
  </div>
</div>

<script>
let cur = null;          // 当前 session 完整数据
let streaming = false;
const $ = id => document.getElementById(id);

async function api(path, opts) {
  const r = await fetch(path, opts);
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || r.statusText);
  return r.json();
}

function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

// ---------- 会话列表 ----------
async function loadSessions() {
  const list = await api('/api/sessions');
  $('sessionList').innerHTML = list.map(s =>
    `<li data-n="${esc(s.name)}" class="${cur && cur.name === s.name ? 'active' : ''}">` +
    `<span class="sname">${esc(s.name)}</span><button class="del" title="删除会话">×</button></li>`).join('');
  document.querySelectorAll('#sessionList li').forEach(li => {
    li.onclick = () => selectSession(li.dataset.n);
    li.querySelector('.del').onclick = async e => {
      e.stopPropagation();
      if (!confirm(`删除会话「${li.dataset.n}」？此操作不可恢复。`)) return;
      await api('/api/sessions/' + encodeURIComponent(li.dataset.n), { method: 'DELETE' });
      if (cur && cur.name === li.dataset.n) {
        cur = null;
        $('toolbar').style.display = 'none';
        $('composer').style.display = 'none';
        $('chat').innerHTML = '<div id="emptyHint">请选择或新建一个会话</div>';
      }
      loadSessions();
    };
  });
}

async function selectSession(name) {
  cur = await api('/api/sessions/' + encodeURIComponent(name));
  render();
  loadSessions();
}

// ---------- 渲染 ----------
function render() {
  $('emptyHint')?.remove();
  $('toolbar').style.display = 'flex';
  $('composer').style.display = 'flex';
  $('sessName').textContent = cur.name + '（角色卡：' + cur.card + '）';
  renderPresetSelect();
  const chat = $('chat');
  chat.innerHTML = '';
  // 开局块：永远是对话界面第一个块
  chat.appendChild(makeBeginningBlock());
  cur.history.forEach((e, i) => {
    chat.appendChild(e.role === 'assistant' ? makeAIBlock(e, i) : makeUserBlock(e, i));
  });
  chat.scrollTop = chat.scrollHeight;
  updateComposer();
}

function renderPresetSelect() {
  api('/api/presets').then(list => {
    $('presetSelect').innerHTML = list.map(p =>
      `<option value="${esc(p.id)}" ${p.id === cur.preset ? 'selected' : ''}>${esc(p.name)}</option>`).join('');
  });
}

function updateComposer() {
  // 空历史 = 等待点击「开始」；最后一块是 AI = 等待用户输入
  const started = cur.history.length > 0;
  const waiting = !started || cur.history[cur.history.length - 1].role === 'assistant';
  $('send').disabled = streaming || !waiting;
  $('input').disabled = streaming || !started || !waiting;
  $('send').textContent = started ? '发送' : '开始';
}

function makeOpsBtn(text, fn) {
  const b = document.createElement('button');
  b.textContent = text; b.onclick = fn;
  return b;
}

function makeBeginningBlock() {
  const div = document.createElement('div');
  div.className = 'block beginning';
  div.innerHTML = `<div class="tag">开局</div><div class="content">${esc(cur.beginning_text || '（空开局）')}</div>`;
  const ops = document.createElement('div');
  ops.className = 'ops';
  ops.appendChild(makeOpsBtn('修改', () => editBlock(div, cur.beginning_text, async text => {
    await api(`/api/sessions/${enc()}/beginning`, post({ text }));
    cur.beginning_text = text; render();
  })));
  div.appendChild(ops);
  return div;
}

function makeAIBlock(e, i) {
  const div = document.createElement('div');
  div.className = 'block ai';
  div.innerHTML = `<div class="tag">AI</div>` +
    (e.reasoning ? `<details class="thinking"><summary>思考</summary><div>${esc(e.reasoning)}</div></details>` : '') +
    `<div class="content">${esc(e.content)}</div>`;
  if (e.options && e.options.length) {
    const opts = document.createElement('div');
    opts.className = 'options';
    e.options.forEach(o => {
      const b = document.createElement('button');
      b.textContent = o;
      b.onclick = () => { $('input').value = o; send(); };
      opts.appendChild(b);
    });
    div.appendChild(opts);
  }
  const ops = document.createElement('div');
  ops.className = 'ops';
  ops.appendChild(makeOpsBtn('修改', () => editBlock(div, e.content, async text => {
    await api(`/api/sessions/${enc()}/edit_ai`, post({ index: i, content: text, options: e.options || [] }));
    cur.history[i].content = text; render();
  })));
  // 只允许最后一个 AI 块重新输出
  if (i === cur.history.length - 1)
    ops.appendChild(makeOpsBtn('重新输出', regenerate));
  div.appendChild(ops);
  return div;
}

function makeUserBlock(e, i) {
  const div = document.createElement('div');
  div.className = 'block user';
  div.innerHTML = `<div class="tag">你</div><div class="content">${esc(e.content)}</div>`;
  const ops = document.createElement('div');
  ops.className = 'ops';
  ops.appendChild(makeOpsBtn('回滚', async () => {
    const r = await api(`/api/sessions/${enc()}/rollback`, post({ index: i }));
    $('input').value = r.input;
    cur = await api('/api/sessions/' + enc());
    render();
  }));
  div.appendChild(ops);
  return div;
}

// 把块内容切换为编辑态
function editBlock(div, text, onSave) {
  const c = div.querySelector('.content');
  const old = c.innerHTML;
  c.innerHTML = '';
  const ta = document.createElement('textarea');
  ta.className = 'edittext'; ta.value = text;
  const row = document.createElement('div');
  row.style.cssText = 'margin-top:8px;display:flex;gap:8px;justify-content:flex-end';
  const save = makeOpsBtn('保存', async () => { await onSave(ta.value); });
  const cancel = makeOpsBtn('取消', () => { c.innerHTML = old; });
  row.append(save, cancel);
  c.append(ta, row);
}

// ---------- 流式对话 ----------
const enc = () => encodeURIComponent(cur.name);
const post = obj => ({ method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(obj) });

async function streamInto(url, opts) {
  streaming = true; updateComposer();
  const chat = $('chat');
  const div = document.createElement('div');
  div.className = 'block ai';
  div.innerHTML = `<div class="tag">AI（生成中…）</div>
    <details class="thinking"><summary>思考</summary><div></div></details>
    <div class="content"></div>`;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  const thinkDiv = div.querySelector('.thinking div');
  const contentDiv = div.querySelector('.content');
  try {
    const resp = await fetch(url, opts);
    const reader = resp.body.getReader();
    const dec = new TextDecoder();
    let buf = '';
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let cut;
      while ((cut = buf.indexOf('\n\n')) !== -1) {
        const raw = buf.slice(0, cut); buf = buf.slice(cut + 2);
        const line = raw.split('\n').find(l => l.startsWith('data:'));
        if (!line) continue;
        const ev = JSON.parse(line.slice(5));
        if (ev.type === 'reasoning') { thinkDiv.textContent += ev.delta; }
        else if (ev.type === 'content') { contentDiv.textContent += ev.delta; chat.scrollTop = chat.scrollHeight; }
        else if (ev.type === 'error') { div.querySelector('.tag').textContent = '出错'; contentDiv.textContent = ev.message; }
      }
    }
  } catch (err) {
    div.querySelector('.tag').textContent = '出错';
    contentDiv.textContent = String(err);
  }
  streaming = false;
  cur = await api('/api/sessions/' + enc());
  render();
}

function send() {
  const text = $('input').value.trim();
  if (!text || streaming) return;
  $('input').value = '';
  if (!cur.history.length) return; // 首轮用「开始」
  streamInto(`/api/sessions/${enc()}/chat`, post({ input: text }));
}

function regenerate() {
  if (streaming) return;
  streamInto(`/api/sessions/${enc()}/regenerate`, { method: 'POST' });
}

$('send').onclick = () => {
  if (!cur.history.length && !streaming)
    streamInto(`/api/sessions/${enc()}/start`, { method: 'POST' });
  else send();
};
$('input').addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.ctrlKey) { e.preventDefault(); $('send').click(); }
});

$('previewBtn').onclick = () => {
  sessionStorage.setItem('preview_draft', $('input').value);
  window.open('/preview.html?session=' + enc(), '_blank');
};
$('presetSelect').onchange = async e => {
  await api(`/api/sessions/${enc()}/preset`, post({ preset: e.target.value }));
  cur.preset = e.target.value;
};

// ---------- 新建会话 ----------
$('newSessionBtn').onclick = async () => {
  const [presets, cards] = await Promise.all([api('/api/presets'), api('/api/cards')]);
  $('mPreset').innerHTML = presets.map(p => `<option value="${esc(p.id)}">${esc(p.name)}</option>`).join('');
  $('mCard').innerHTML = cards.map(c => `<option value="${esc(c.id)}">${esc(c.name)}</option>`).join('');
  const fillBeginnings = () => {
    const c = cards.find(x => x.id === $('mCard').value);
    $('mBeginning').innerHTML = `<option value="">（空开局）</option>` +
      c.beginnings.map((b, i) => `<option value="${i}">开局 ${i + 1}：${esc(b)}…</option>`).join('');
    // 默认选中第一个开局，没有开局才是空开局
    if (c.beginnings.length) $('mBeginning').selectedIndex = 1;
  };
  $('mCard').onchange = fillBeginnings;
  fillBeginnings();
  $('modalMask').style.display = 'flex';
};
$('mCancel').onclick = () => $('modalMask').style.display = 'none';
$('mCreate').onclick = async () => {
  const body = {
    name: $('mName').value.trim(),
    preset: $('mPreset').value,
    card: $('mCard').value,
    beginning_index: $('mBeginning').value === '' ? null : +$('mBeginning').value,
  };
  try {
    const s = await api('/api/sessions', post(body));
    $('modalMask').style.display = 'none';
    await selectSession(s.name);
  } catch (e) { alert(e.message); }
};

loadSessions();
</script>
</body>
</html>
