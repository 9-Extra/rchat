<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AIRP</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.6/dist/purify.min.js"></script>
<style>
  :root {
    --bg: #141519;
    --panel: #1d1f25;
    --panel2: #23262e;
    --border: #2e313a;
    --text: #d8dade;
    --dim: #8b8e98;
    --accent: #6c9bff;
    --ai: #58b788;
    --gold: #c9a25e;
    --danger: #d16060;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif; background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; }
  button { cursor: pointer; background: var(--panel2); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 3px 12px; font-size: 13px; transition: background .15s, border-color .15s; }
  button:hover { background: #2e323c; border-color: #3d414c; }
  button:disabled { opacity: .35; cursor: default; }
  select, input[type=text] { background: var(--panel2); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 4px 8px; }
  input[type=number] { background: var(--panel2); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 4px 4px; width: 72px; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: #33363f; border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: #444854; }
  ::-webkit-scrollbar-track { background: transparent; }

  #layout { flex: 1; display: flex; min-height: 0; }

  /* ---------- 侧栏 ---------- */
  aside { width: 230px; border-right: 1px solid var(--border); background: var(--panel); display: flex; flex-direction: column; flex-shrink: 0; transition: width .18s ease, transform .2s ease; overflow: hidden; }
  .aside-head { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; border-bottom: 1px solid var(--border); }
  .logo { font-weight: bold; letter-spacing: 1px; color: var(--accent); white-space: nowrap; }
  #toggleSide { padding: 1px 8px; color: var(--dim); }
  #sideBody { padding: 12px; overflow-y: auto; flex: 1; }
  aside.collapsed { width: 46px; }
  aside.collapsed #sideBody, aside.collapsed .logo { display: none; }
  aside.collapsed .aside-head { justify-content: center; padding: 10px 0; border-bottom: none; }
  #newSessionBtn { width: 100%; padding: 6px 0; color: var(--accent); }
  #sideBody h3 { font-size: 12px; color: var(--dim); margin: 14px 2px 6px; font-weight: normal; }
  #sessionList { list-style: none; }
  #sessionList li { padding: 7px 9px; border-radius: 6px; cursor: pointer; font-size: 13px; display: flex; align-items: center; gap: 6px; }
  #sessionList li:hover { background: var(--panel2); }
  #sessionList li.active { background: #2b3a55; color: #cfe0ff; }
  #sessionList li .sname { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #sessionList li .turns { flex: none; font-size: 11px; color: var(--dim); }
  #sessionList li .gen { flex: none; font-size: 11px; color: var(--ai); }
  #sessionList li .err { flex: none; font-size: 11px; color: var(--danger); }
  #sessionList li.active .turns { color: #9db6e4; }
  #sessionList li .del { display: none; padding: 0 6px; font-size: 13px; line-height: 1.4; color: var(--dim); }
  #sessionList li .del:hover { color: var(--danger); }
  #sessionList li:hover .del { display: block; }

  /* ---------- 主区 ---------- */
  main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #toolbar { display: flex; gap: 12px; align-items: center; padding: 9px 18px; border-bottom: 1px solid var(--border); background: var(--panel); flex-wrap: wrap; position: relative; }
  #toolbar .sessname { font-weight: bold; font-size: 14px; }
  #toolbar label { font-size: 13px; color: var(--dim); display: flex; gap: 6px; align-items: center; }
  #settings { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  #settingsBtn { display: none; }
  #topBar { display: none; }
  #chat { flex: 1; overflow-y: auto; padding: 22px 24px 30px; }
  #errorBar { display: none; align-items: center; gap: 10px; padding: 8px 18px; border-bottom: 1px solid #4a2b2b; background: #2a1c1c; color: #f0b0b0; font-size: 13px; }
  #errorBar .msg { flex: 1; min-width: 0; white-space: pre-wrap; word-break: break-word; }
  #errorBar button { flex: none; font-size: 12px; padding: 2px 10px; }

  .block { max-width: 840px; margin: 0 auto 16px; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 14px 18px; position: relative; box-shadow: 0 1px 3px rgba(0,0,0,.25); }
  .block.ai { border-left: 3px solid var(--ai); }
  .block.user { border-left: 3px solid var(--accent); background: #1c2230; }
  .block.beginning { border-left: 3px solid var(--gold); }
  .block .tag { font-size: 12px; color: var(--dim); margin-bottom: 8px; letter-spacing: .5px; }
  .block.ai .tag { color: var(--ai); }
  .block.user .tag { color: var(--accent); }
  .block.beginning .tag { color: var(--gold); }
  .block .ops { position: absolute; top: 10px; right: 12px; display: flex; gap: 6px; opacity: 0; transition: opacity .15s; }
  .block:hover .ops { opacity: 1; }
  .block .ops button { font-size: 12px; padding: 2px 9px; background: rgba(35,38,46,.9); }
  .block .content { white-space: pre-wrap; line-height: 1.85; word-break: break-word; font-size: 15px; }
  .block .content.markdown { white-space: normal; }
  .block .content.markdown p { margin-bottom: 0.75em; }
  .block .content.markdown p:last-child { margin-bottom: 0; }
  .block .content.markdown h1, .block .content.markdown h2, .block .content.markdown h3, .block .content.markdown h4, .block .content.markdown h5, .block .content.markdown h6 { margin: 0.8em 0 0.4em; font-weight: 600; line-height: 1.4; }
  .block .content.markdown h1 { font-size: 1.45em; }
  .block .content.markdown h2 { font-size: 1.3em; }
  .block .content.markdown h3 { font-size: 1.15em; }
  .block .content.markdown ul, .block .content.markdown ol { margin: 0.6em 0; padding-left: 1.5em; }
  .block .content.markdown li { margin: 0.25em 0; }
  .block .content.markdown blockquote { margin: 0.6em 0; padding: 0.4em 0.8em; border-left: 3px solid #4a5568; color: #a9adb8; background: rgba(255,255,255,.03); border-radius: 0 6px 6px 0; }
  .block .content.markdown code { background: rgba(255,255,255,.08); padding: 0.15em 0.35em; border-radius: 4px; font-family: "JetBrains Mono", "Fira Code", Consolas, monospace; font-size: 0.9em; }
  .block .content.markdown pre { background: #17191e; border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; margin: 0.6em 0; overflow-x: auto; }
  .block .content.markdown pre code { background: transparent; padding: 0; font-size: 0.85em; white-space: pre-wrap; word-break: break-word; }
  .block .content.markdown a { color: var(--accent); text-decoration: none; }
  .block .content.markdown a:hover { text-decoration: underline; }
  .block .content.markdown table { border-collapse: collapse; margin: 0.6em 0; width: 100%; }
  .block .content.markdown th, .block .content.markdown td { border: 1px solid var(--border); padding: 6px 10px; }
  .block .content.markdown th { background: rgba(255,255,255,.05); }
  .block .content.markdown hr { border: none; border-top: 1px solid var(--border); margin: 1em 0; }
  .errnote { color: #e07a5f; font-size: 13px; line-height: 1.6; margin-bottom: 8px; padding: 6px 10px; background: rgba(224,122,95,.08); border-left: 3px solid #e07a5f; border-radius: 0 6px 6px 0; }
  .options { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--border); }
  .options button { background: #253047; border-color: #35466b; color: #a9c4f5; font-size: 12px; border-radius: 20px; padding: 4px 14px; max-width: 100%; white-space: normal; text-align: left; }
  .options button:hover { background: #2c3a58; border-color: #4a5f8f; }
  .options-pending, .options-error { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--border); color: var(--dim); font-size: 12px; }
  .options-error button { font-size: 12px; padding: 2px 9px; background: rgba(35,38,46,.9); }
  .options-raw { flex-basis: 100%; background: #1a1c23; border: 1px solid #2a2d38; border-radius: 8px; padding: 7px 12px; }
  .options-raw summary { color: #8198bd; font-size: 12px; cursor: pointer; }
  .options-raw .raw { white-space: pre-wrap; word-break: break-word; color: #9095a0; font-size: 13px; margin-top: 8px; line-height: 1.7; max-height: 320px; overflow: auto; }
  details.thinking { margin-bottom: 10px; background: #191b20; border: 1px solid #26282f; border-radius: 8px; padding: 7px 12px; }
  details.thinking summary { color: #7a9b7a; font-size: 12px; cursor: pointer; }
  details.thinking div { white-space: pre-wrap; color: #9095a0; font-size: 13px; margin-top: 8px; line-height: 1.7; }
  details.toolcall { margin-bottom: 10px; background: #1a1c23; border: 1px solid #2a2d38; border-radius: 8px; padding: 7px 12px; }
  details.toolcall summary { color: #8198bd; font-size: 12px; cursor: pointer; }
  details.toolcall .tc-label { color: #5c6068; font-size: 11px; margin-top: 8px; }
  details.toolcall .tc { white-space: pre-wrap; color: #9095a0; font-size: 13px; margin-top: 3px; line-height: 1.7; word-break: break-word; }
  .edittext { width: 100%; min-height: 140px; background: #17191e; color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: 10px; font-family: inherit; line-height: 1.7; font-size: 14px; }

  #composer { border-top: 1px solid var(--border); padding: 14px 24px 16px; background: var(--panel); }
  #composerInner { margin: 0 auto; display: flex; gap: 10px; align-items: flex-end; }
  #input { flex: 1; resize: none; min-height: 68px; max-height: 320px; background: var(--panel2); color: var(--text); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; font-family: inherit; line-height: 1.6; font-size: 14px; overflow-y: auto; }
  #input:focus { outline: none; border-color: var(--accent); }
  #send { min-height: 68px; padding: 0 26px; font-size: 14px; background: #2b3a55; border-color: #3d5279; color: #cfe0ff; align-self: stretch; }
  #send:hover:not(:disabled) { background: #34496b; }
  #send.interrupting { background: #4a2b2b; border-color: #6b3a3a; color: #f0b0b0; }
  #send.interrupting:hover { background: #5a3535; }
  #emptyHint { color: #565a64; text-align: center; margin-top: 60px; font-size: 14px; }

  #modalMask { position: fixed; inset: 0; background: rgba(0,0,0,.65); display: none; align-items: center; justify-content: center; }
  #modal { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 22px; width: 440px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 8px 30px rgba(0,0,0,.5); }
  #modal h3 { font-size: 15px; }
  #modal label { font-size: 12px; color: var(--dim); display: block; margin-bottom: 5px; }
  #modal select, #modal input { width: 100%; }
  #modal .row { display: flex; gap: 10px; justify-content: flex-end; margin-top: 4px; }

  /* ---------- 登录页（只有服务端开了鉴权才出现） ---------- */
  #loginMask { position: fixed; inset: 0; background: var(--bg); display: none; align-items: center; justify-content: center; z-index: 100; }
  #loginBox { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 26px; width: 320px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 8px 30px rgba(0,0,0,.5); }
  #loginBox h3 { font-size: 15px; }
  #loginBox label { font-size: 12px; color: var(--dim); display: block; margin-bottom: 5px; }
  #loginBox input { width: 100%; }
  #loginBox button { width: 100%; padding: 9px; }
  #loginErr { color: #f0b0b0; font-size: 12px; min-height: 15px; white-space: pre-wrap; }
  #logoutBtn { display: none; }

  /* ---------- 移动端侧栏改为抽屉 ---------- */
  @media (max-width: 640px) {
    #topBar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 12px;
      border-bottom: 1px solid var(--border);
      background: var(--panel);
      flex-shrink: 0;
      position: relative;
      z-index: 10;
    }
    #menuBtn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 32px; height: 32px;
      padding: 0;
      background: var(--panel2);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: 16px;
    }
    aside {
      position: fixed;
      left: 0; top: 0; bottom: 0;
      width: 260px;
      z-index: 30;
      border-right: none;
      box-shadow: 2px 0 16px rgba(0,0,0,.5);
      transform: translateX(0);
      transition: transform .2s ease;
    }
    aside.collapsed {
      width: 260px;
      transform: translateX(-100%);
      pointer-events: none;
    }
    /* 手机上正文块顶满屏幕，不再保留左右边距 */
    #chat { padding: 0 0 12px; }
    .block {
      max-width: none;
      margin: 0 0 12px;
      padding: 12px 14px;
    }
    /* 工具栏收成「会话名 + ⚙」单行，设置项点开才是浮层 */
    #toolbar { flex-wrap: nowrap; gap: 8px; padding: 8px 12px; }
    #toolbar .sessname { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; font-weight: normal; }
    #toolbar .cardpart { display: none; }
    #settingsBtn { display: inline-flex; align-items: center; padding: 4px 10px; font-size: 15px; }
    #settings {
      display: none;
      position: absolute;
      top: calc(100% + 6px);
      left: 8px; right: 8px;
      z-index: 20;
      flex-direction: column;
      align-items: stretch;
      gap: 10px;
      padding: 12px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      box-shadow: 0 8px 24px rgba(0,0,0,.55);
    }
    #settings.open { display: flex; }
    #settings label { justify-content: space-between; }
    #settings select { flex: 0 1 auto; max-width: 62%; }
  }
</style>
</head>
<body>
<div id="layout">
  <aside id="sidebar">
    <div class="aside-head">
      <span class="logo">AIRP</span>
      <button id="logoutBtn" title="注销当前账号">退出</button>
      <button id="toggleSide" title="收起/展开侧栏">«</button>
    </div>
    <div id="sideBody">
      <button id="newSessionBtn">＋ 新建会话</button>
      <h3>会话</h3>
      <ul id="sessionList"></ul>
    </div>
  </aside>
  <main>
    <div id="topBar"><button id="menuBtn" title="侧栏">☰</button><span class="logo">AIRP</span></div>
    <div id="toolbar" style="display:none">
      <span class="sessname" id="sessName"></span>
      <button id="settingsBtn" title="会话设置">⚙</button>
      <div id="settings">
        <label>预设 <select id="presetSelect"></select></label>
        <label>模型 <select id="endpointSelect"></select></label>
        <label>思考 <select id="effortSelect">
          <option value="none">关闭</option>
          <option value="low">低</option>
          <option value="medium">中</option>
          <option value="high">高</option>
          <option value="max">最高</option>
        </select></label>
        <label>选项 <input type="checkbox" id="optionsToggle"></label>
        <label>温度 <input type="number" id="tempInput" min="0" max="2" step="0.1"></label>
        <label>上限 <input type="number" id="maxTokensInput" min="1" step="1000"></label>
        <button id="previewBtn">预览上下文</button>
      </div>
    </div>
    <div id="errorBar" style="display:none"></div>
    <div id="chat"><div id="emptyHint">请选择或新建一个会话</div></div>
    <div id="composer" style="display:none">
      <div id="composerInner">
        <textarea id="input" placeholder="输入你的行动或对话…（Ctrl+Enter 发送）"></textarea>
        <button id="send">发送</button>
      </div>
    </div>
  </main>
</div>

<div id="modalMask">
  <div id="modal">
    <h3>新建会话</h3>
    <div><label>名称（留空自动生成）</label><input type="text" id="mName"></div>
    <div><label>角色卡</label><select id="mCard"></select></div>
    <div><label>预设</label><select id="mPreset"></select></div>
    <div><label>开局</label><select id="mBeginning"></select></div>
    <div class="row"><button id="mCancel">取消</button><button id="mCreate">创建</button></div>
  </div>
</div>

<div id="loginMask">
  <div id="loginBox">
    <h3>AIRP 登录</h3>
    <div><label>用户名</label><input type="text" id="loginUser" autocomplete="username"></div>
    <div><label>密码</label><input type="password" id="loginPass" autocomplete="current-password"></div>
    <div id="loginErr"></div>
    <button id="loginBtn">登录</button>
  </div>
</div>

<script>
let cur = null;          // 当前 session 快照（服务端权威；前端只读，不要手改 history）
let streamSeq = 0;       // 每条流开一次 +1；切会话时 +1 让旧流的所有后续操作失效
let selectSeq = 0;       // 每次切会话 +1；旧会话的 GET 回来晚了不覆盖新选择
let selecting = false;   // 正在拉目标会话快照；期间禁用输入，避免往旧会话发下一轮
let streaming = false;
let finalizing = false;  // 流已结束、正在拉快照并就地定稿
let reconnecting = false; // 断线后正在退避重连（不能发新轮；切会话会 detach）
let activeReader = null; // 进行中的流读取器，用于打断
let stickBottom = true;  // 用户是否停留在聊天底部
let overlay = null;      // 生成中的临时覆盖层（live 用户/AI 块 + 本轮流状态），不是记录
const $ = id => document.getElementById(id);

// 贴底时自动下滚；用户上滚后不再打扰。只在流式跟随和主动进入会话时调用。
function scrollBottom(force) {
  const c = $('chat');
  if (force || stickBottom) c.scrollTop = c.scrollHeight;
}
function syncStick() {
  const c = $('chat');
  stickBottom = c.scrollHeight - c.scrollTop - c.clientHeight < 40;
}
$('chat').addEventListener('scroll', syncStick);

function syncToggle() {
  $('toggleSide').textContent = $('sidebar').classList.contains('collapsed') ? '»' : '«';
}
function toggleSidebar() {
  $('sidebar').classList.toggle('collapsed');
  syncToggle();
}
$('toggleSide').onclick = toggleSidebar;
$('menuBtn').onclick = toggleSidebar;

// 移动端设置浮层：⚙ 开关，点面板外收起
$('settingsBtn').onclick = e => {
  e.stopPropagation();
  $('settings').classList.toggle('open');
};
document.addEventListener('click', e => {
  const s = $('settings');
  if (s.classList.contains('open') && !s.contains(e.target) && e.target.id !== 'settingsBtn')
    s.classList.remove('open');
});

// 移动端默认收起侧栏，点击主区域外自动收起
if (window.innerWidth <= 640) {
  $('sidebar').classList.add('collapsed');
  syncToggle();
}
document.addEventListener('click', e => {
  if (window.innerWidth > 640) return;
  const sb = $('sidebar');
  if (!sb.classList.contains('collapsed') && !sb.contains(e.target) && e.target.id !== 'menuBtn') {
    sb.classList.add('collapsed');
    syncToggle();
  }
});

// 服务端是否开了鉴权、当前登录的是谁（启动时问 /api/me 得到）
let authEnabled = false;
let currentUser = null;

async function api(path, opts) {
  const r = await fetch(path, opts);
  // 会话过期/被踢/未登录：统一收口到登录页（/api/login 与 /api/me 之外不会有 401 的正常路径）
  if (r.status === 401) {
    showLogin('登录已过期，请重新登录');
    throw new Error('未登录');
  }
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || r.statusText);
  return r.json();
}

function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

function renderMarkdown(text) {
  if (!text) return '';
  if (typeof marked === 'undefined' || typeof DOMPurify === 'undefined') return esc(text);
  try {
    const html = marked.parse(text, { async: false });
    return DOMPurify.sanitize(html, { USE_PROFILES: { html: true } });
  } catch (e) {
    return esc(text);
  }
}

// ---------- 会话列表 ----------
// 记住当前会话，刷新/重开页面时自动回到它；同一个浏览器换账号登录时按用户分开记
const LAST_SESSION_KEY = 'last_session';
const lastSessionKey = () => LAST_SESSION_KEY + (currentUser ? ':' + currentUser : '');
function rememberSession(id) {
  if (id) localStorage.setItem(lastSessionKey(), id);
  else localStorage.removeItem(lastSessionKey());
}

async function loadSessions() {
  const list = await api('/api/sessions');
  // 列表项显示角色卡名（卡内定义的名字）+ 已运行轮数；会话名放 title 里备查。
  // 生成中/出错是服务端状态：切走的会话在后台跑，靠它让用户知道去哪看。
  $('sessionList').innerHTML = list.map(s => {
    const st = s.generating
      ? '<span class="gen">生成中</span>'
      : s.last_error ? '<span class="err" title="最近一次操作出错">出错</span>' : '';
    return `<li data-i="${esc(s.id)}" data-n="${esc(s.name)}" title="${esc(s.name)}" class="${cur && cur.id === s.id ? 'active' : ''}">` +
      `<span class="sname">${esc(s.card_name || s.name)}</span>` +
      `<span class="turns">${s.turns} 轮</span>${st}` +
      `<button class="del" title="删除会话">×</button></li>`;
  }).join('');
  const lis = document.querySelectorAll('#sessionList li');
  for (let k = 0; k < lis.length; k++) {
    const li = lis[k];
    li.onclick = () => selectSession(li.getAttribute('data-i'));
    li.querySelector('.del').onclick = async e => {
      e.stopPropagation();
      if (!confirm(`删除会话「${li.getAttribute('data-n')}」？此操作不可恢复。`)) return;
      await api('/api/sessions/' + encodeURIComponent(li.getAttribute('data-i')), { method: 'DELETE' });
      if (cur && cur.id === li.getAttribute('data-i')) {
        cur = null;
        rememberSession(null);
        $('toolbar').style.display = 'none';
        $('composer').style.display = 'none';
        $('chat').innerHTML = '<div id="emptyHint">请选择或新建一个会话</div>';
        syncErrorBar();
      }
      loadSessions();
    };
  }
  return list;
}

// 切走当前会话：只停本地转发，不碰服务端的生成 task。旧流的 seq 立即失效，
// 之后到达的事件/对账不会写进新会话的 DOM。还没收到任何事件的流先别急着 cancel：
// POST 响应头可能比服务端注册 _active 更早到，立刻取消有窗口会把整轮一起取消。
function detachStream() {
  if (!streaming && !finalizing && !reconnecting && !overlay) return;
  const ov = overlay;
  const reader = activeReader;
  streamSeq++;
  streaming = false;
  finalizing = false;
  reconnecting = false;
  reconnectTries = 0;
  overlay = null;
  activeReader = null;
  if (ov && ov.scheduled) {
    cancelAnimationFrame(ov.frame);
    ov.scheduled = false;
  }
  if (reader && (!ov || ov.heard)) {
    try { reader.cancel(); } catch (e) {}
  }
  updateComposer();
}

async function selectSession(id) {
  // 每次点击都算一次新的选择：先断旧流（服务端继续跑），再拉快照。
  // 重复点当前会话等于「刷新并重连接上」，不会漏掉后台那半轮。
  const seq = ++selectSeq;
  selecting = true;
  updateComposer();
  detachStream();
  let s;
  try {
    s = await api('/api/sessions/' + encodeURIComponent(id));
  } catch (e) {
    if (seq === selectSeq) {
      selecting = false;
      updateComposer();
      alert(e.message);
    }
    return;
  }
  if (seq !== selectSeq) return;  // 期间又点了别的会话，selecting 由后一次负责清
  cur = s;
  rememberSession(cur.id);
  stickBottom = true;
  reconnectTries = 0;
  renderAll(true);
  selecting = false;
  updateComposer();
  loadSessions();
  // 后端这一轮还在跑（刷新/换设备/刚从别的会话切回来）：接上它继续看
  if (cur.generating) attachTurn(cur);
  // 在手机上选好会话后自动收起抽屉
  if (window.innerWidth <= 640) {
    $('sidebar').classList.add('collapsed');
    syncToggle();
  }
}

// ---------- 渲染 ----------
// 每个块有稳定 key：beginning / user:<i> / assistant:<i>。同一会话内只用 reconcileSession
// 做增量 patch，不重建没变的节点——滚动位置、展开的 details、文本选区、编辑中的 textarea
// 才不会被数据刷新一起冲掉。

function blockKey(e, i) {
  return (e.role === 'assistant' ? 'assistant:' : 'user:') + i;
}

function syncErrorBar() {
  const bar = $('errorBar');
  if (!bar) return;
  if (!cur || !cur.last_error) {
    bar.style.display = 'none';
    bar.innerHTML = '';
    return;
  }
  bar.style.display = 'flex';
  bar.innerHTML = `<span class="msg">〔最近一次操作出错〕${esc(cur.last_error.message)}</span>`;
  const sid = cur.id;
  const btn = document.createElement('button');
  btn.textContent = '知道了';
  btn.onclick = async () => {
    try {
      await api(`/api/sessions/${encodeURIComponent(sid)}/dismiss_error`, { method: 'POST' });
    } catch (e) {}
    if (cur && cur.id === sid) {
      cur.last_error = null;
      syncErrorBar();
    }
    loadSessions().catch(() => {});
  };
  bar.appendChild(btn);
}

function syncChrome() {
  $('emptyHint')?.remove();
  $('toolbar').style.display = 'flex';
  $('composer').style.display = 'block';
  $('sessName').innerHTML = esc(cur.name) +
    `<span class="cardpart">（角色卡：${esc(cur.card_name || cur.card)}）</span>`;
  syncErrorBar();
}

// 整页重建：只用于「切换会话」这种显式跳转；toBottom 决定是否显示最新。
function renderAll(toBottom) {
  syncChrome();
  renderPresetSelect();
  renderEndpointSelect();
  // 后端在 GET 会话时已解析出实际生效值
  $('effortSelect').value = cur.reasoning_effort || 'low';
  $('optionsToggle').checked = !!cur.options_enabled;
  $('tempInput').value = cur.temperature ?? '';
  $('maxTokensInput').value = cur.max_tokens ?? '';
  const chat = $('chat');
  chat.innerHTML = '';
  // 开局块：永远是对话界面第一个块
  chat.appendChild(makeBeginningBlock());
  cur.history.forEach((e, i) => chat.appendChild(makeBlock(e, i)));
  if (toBottom) {
    stickBottom = true;
    scrollBottom(true);
  } else {
    syncStick();
  }
  updateComposer();
}

// 同会话数据刷新：按 key 增删/更新块，保持节点身份和滚动位置。
// 生成中的 .live 块不归这里管（由 finalizeTurn / attachTurn 单独接管）。
function reconcileSession() {
  if (!cur) return;
  syncChrome();
  const chat = $('chat');
  const desired = [{ key: 'beginning', make: makeBeginningBlock, update: updateBeginningBlock }];
  cur.history.forEach((e, i) => desired.push({
    key: blockKey(e, i),
    make: () => makeBlock(e, i),
    update: node => updateBlock(node, e, i),
  }));
  const existing = new Map();
  const keyed = chat.querySelectorAll('[data-key]');
  for (let k = 0; k < keyed.length; k++) {
    const key = keyed[k].getAttribute('data-key');
    if (key) existing.set(key, keyed[k]);
  }
  let prev = null;
  for (const item of desired) {
    let node = existing.get(item.key);
    if (node) {
      existing.delete(item.key);
      if (item.update) item.update(node);
    } else {
      node = item.make();
    }
    // 只有缺失/错位时才移动节点，避免无谓地打断选区或滚动锚定
    const ref = prev ? prev.nextSibling : chat.firstChild;
    if (node !== ref) chat.insertBefore(node, ref);
    prev = node;
  }
  // 历史被截断（回滚）后多出来的已提交块删掉；live 块留给生成流程
  for (const node of existing.values()) {
    if (!node.classList.contains('live')) node.remove();
  }
  syncStick();
  updateComposer();
}

// 数据变了之后重新拉一次权威快照，再增量 patch；绝不手改 cur.history
async function refreshSession() {
  const s = await api('/api/sessions/' + enc());
  cur = s;
  reconcileSession();
}

function renderPresetSelect() {
  api('/api/presets').then(list => {
    $('presetSelect').innerHTML = list.map(p =>
      `<option value="${esc(p.id)}" ${p.id === cur.preset ? 'selected' : ''}>${esc(p.name)}</option>`).join('');
  });
}

function renderEndpointSelect() {
  api('/api/endpoints').then(list => {
    $('endpointSelect').innerHTML = list.map(e =>
      `<option value="${e.index}" ${e.index === cur.endpoint ? 'selected' : ''}>${esc(e.display_name)}</option>`).join('');
  });
}

function updateComposer() {
  if (!cur) return;
  // 空历史 = 等待点击「开始」；最后一块是 AI = 等待用户输入；
  // 最后一块是用户块 = 这一轮还没写出来（生成被打断在落盘前、或进程重启过），点「继续」补回来
  const last = cur.history[cur.history.length - 1];
  const started = cur.history.length > 0;
  const waiting = !started || last.role === 'assistant';
  const resumable = started && last.role === 'user';
  const btn = $('send');
  if (selecting) {
    btn.textContent = '切换中…';
    btn.disabled = true;
    btn.classList.remove('interrupting');
    $('input').disabled = true;
    return;
  }
  // cur.generating：后端这一轮还在跑（本页刷新回来、或别的页面/设备发起的）
  const busy = streaming || finalizing || reconnecting || !!cur.generating;
  if (busy) {
    btn.textContent = '打断';
    btn.disabled = false;
    btn.classList.add('interrupting');
  } else {
    btn.classList.remove('interrupting');
    btn.textContent = !started ? '开始' : (resumable ? '继续' : '发送');
    btn.disabled = !(waiting || resumable);
  }
  $('input').disabled = busy || !started || !waiting;
}

function makeOpsBtn(text, fn) {
  const b = document.createElement('button');
  b.textContent = text; b.onclick = fn;
  return b;
}

// 剧情推进选项按钮：历史块与流式渲染共用
function optionsDiv(options) {
  const opts = document.createElement('div');
  opts.className = 'options';
  options.forEach(o => {
    const b = document.createElement('button');
    b.textContent = o;
    b.onclick = () => { $('input').value = o; send(); };
    opts.appendChild(b);
  });
  return opts;
}

// 选项生成失败：淡色一行说明 + 重试按钮（历史块与流式渲染共用）
function optionsErrorDiv(message, raw) {
  const d = document.createElement('div');
  d.className = 'options-error';
  const span = document.createElement('span');
  span.textContent = `〔选项生成失败〕${message}`;
  d.appendChild(span);
  d.appendChild(makeOpsBtn('重新生成选项', regenerateOptions));
  if (raw) d.appendChild(optionsRawDetails(raw));
  return d;
}

// 选项请求失败时模型实际产出的原文（含重试各次的输出）：排查解析问题就看这里
function optionsRawDetails(raw) {
  const det = document.createElement('details');
  det.className = 'options-raw';
  const sum = document.createElement('summary');
  sum.textContent = '模型原始输出';
  const body = document.createElement('div');
  body.className = 'raw';
  body.textContent = raw;
  det.appendChild(sum);
  det.appendChild(body);
  return det;
}

// AI 块的选项区只留一份（占位/按钮/错误提示互斥），换形态前清掉旧的
function setOptionsArea(div, node) {
  const old = div.querySelectorAll('.options, .options-pending, .options-error');
  for (let k = old.length - 1; k >= 0; k--) old[k].remove();
  if (node) div.appendChild(node);
}

// 块内唯一的 class（tag / content / errnote / options 都不会嵌套同名）
function directChild(div, cls) {
  return div.querySelector('.' + cls);
}

function findBlock(key) {
  const nodes = $('chat').querySelectorAll('[data-key]');
  for (let k = 0; k < nodes.length; k++) {
    if (nodes[k].getAttribute('data-key') === key) return nodes[k];
  }
  return null;
}

function liveAITag() {
  const nodes = $('chat').querySelectorAll('.live');
  for (let k = 0; k < nodes.length; k++) {
    if (nodes[k].classList.contains('ai')) return directChild(nodes[k], 'tag');
  }
  return null;
}

function makeBeginningBlock() {
  const div = document.createElement('div');
  div.className = 'block beginning';
  div.setAttribute('data-key', 'beginning');
  div._text = cur.beginning_text;
  div.innerHTML = `<div class="tag">开局</div><div class="content markdown">${renderMarkdown(cur.beginning_text || '（空开局）')}</div>`;
  const ops = document.createElement('div');
  ops.className = 'ops';
  ops.appendChild(makeOpsBtn('修改', () => editBlock(div, cur.beginning_text, async text => {
    await api(`/api/sessions/${enc()}/beginning`, post({ text }));
    await refreshSession();
  })));
  div.appendChild(ops);
  return div;
}

function updateBeginningBlock(div) {
  if (div._text === cur.beginning_text) return;
  div._text = cur.beginning_text;
  directChild(div, 'content').innerHTML =
    renderMarkdown(cur.beginning_text || '（空开局）');
}

// 工具调用块（与思考块一样默认折叠）：参数尽量按 JSON 美化，调用结果拼在同一块里
function toolDetailsHTML(tc) {
  let args = tc.arguments || '';
  try { args = JSON.stringify(JSON.parse(args), null, 2); } catch (e) {}
  return `<details class="toolcall"><summary>工具调用：${esc(tc.name)}</summary>` +
    `<div class="tc-label">参数</div><div class="tc">${esc(args)}</div>` +
    `<div class="tc-label">结果</div><div class="tc">${esc(tc.result || '')}</div></details>`;
}

// 历史 AI 块的思考/工具调用部分:按回合内真实顺序交替(思考→工具→思考→…);
// 同一轮多个调用共享一段思考,只显示一次;占位/空思考不显示
function aiMiddleHTML(e) {
  const thinking = r => `<details class="thinking"><summary>思考</summary><div>${esc(r)}</div></details>`;
  let html = '', lastReasoning = null;
  for (const tc of e.tool_calls || []) {
    const r = (tc.reasoning || '').trim();
    if (r && r !== lastReasoning) { html += thinking(tc.reasoning); lastReasoning = r; }
    html += toolDetailsHTML(tc);
  }
  const r = (e.reasoning || '').trim();
  if (r && r !== lastReasoning) html += thinking(e.reasoning);
  return html;
}

// 落盘内容的签名：变了才重建这个块，没变的块连碰都不碰
function entrySig(e) {
  return JSON.stringify(e);
}

function makeBlock(e, i) {
  return e.role === 'assistant' ? makeAIBlock(e, i) : makeUserBlock(e, i);
}

// AI 块的正文/思考/选项/错误条整体重填（只在该块数据真的变了时调用）
function fillAIBlock(div, e, i) {
  div.className = 'block ai';
  div.innerHTML = `<div class="tag">${e.error ? '出错' : 'AI'}</div>` +
    aiMiddleHTML(e) +
    (e.error ? `<div class="errnote">〔生成出错〕${esc(e.error)}</div>` : '') +
    `<div class="content markdown">${renderMarkdown(e.content)}</div>`;
  if (e.options && e.options.length) div.appendChild(optionsDiv(e.options));
  if (e.options_error) div.appendChild(optionsErrorDiv(e.options_error, e.options_raw));
  fillAIOps(div, e, i);
  div._sig = entrySig(e);
}

function makeAIBlock(e, i) {
  const div = document.createElement('div');
  div.setAttribute('data-key', 'assistant:' + i);
  fillAIBlock(div, e, i);
  return div;
}

function aiOpsSig(i) {
  return i + '|' + (i === cur.history.length - 1 ? 1 : 0) + '|' + (cur.options_enabled ? 1 : 0);
}

function fillAIOps(div, e, i) {
  const old = div.querySelectorAll('.ops');
  for (let k = old.length - 1; k >= 0; k--) old[k].remove();
  const ops = document.createElement('div');
  ops.className = 'ops';
  ops.appendChild(makeOpsBtn('修改', () => editBlock(div, e.content, async text => {
    await api(`/api/sessions/${enc()}/edit_ai`, post({ index: i, content: text, options: e.options || [] }));
    await refreshSession();
  })));
  // 只允许最后一个 AI 块重新输出
  if (i === cur.history.length - 1) {
    ops.appendChild(makeOpsBtn('重新输出', regenerate));
    // 开了选项开关时，最后一轮还能只重掷选项（正文不动）
    if (cur.options_enabled)
      ops.appendChild(makeOpsBtn('重新生成选项', regenerateOptions));
  }
  div.appendChild(ops);
  div._opsSig = aiOpsSig(i);
}

function makeUserBlock(e, i) {
  const div = document.createElement('div');
  div.className = 'block user';
  div.setAttribute('data-key', 'user:' + i);
  div._content = e.content;
  div.innerHTML = `<div class="tag">你</div><div class="content">${esc(e.content)}</div>`;
  fillUserOps(div, i);
  return div;
}

function fillUserOps(div, i) {
  const old = div.querySelectorAll('.ops');
  for (let k = old.length - 1; k >= 0; k--) old[k].remove();
  const ops = document.createElement('div');
  ops.className = 'ops';
  ops.appendChild(makeOpsBtn('回滚', async () => {
    const r = await api(`/api/sessions/${enc()}/rollback`, post({ index: i }));
    $('input').value = r.input;
    autoGrow();
    await refreshSession();
  }));
  // 分支：以该用户块为断点复制出一个新会话（原会话不动），并切换过去
  ops.appendChild(makeOpsBtn('分支', async () => {
    const s = await api(`/api/sessions/${enc()}/fork`, post({ index: i }));
    await selectSession(s.id);
  }));
  div.appendChild(ops);
  div._userOpsI = i;
}

// 数据刷新时增删/更新一个已有块；节点身份保持不变
function updateBlock(node, e, i) {
  if (e.role === 'assistant') {
    if (node._sig !== entrySig(e)) fillAIBlock(node, e, i);
    else if (node._opsSig !== aiOpsSig(i)) fillAIOps(node, e, i);
  } else {
    if (node._content !== e.content) {
      node._content = e.content;
      directChild(node, 'content').textContent = e.content;
    }
    if (node._userOpsI !== i) fillUserOps(node, i);
  }
}

// 把块内容切换为编辑态
function editBlock(div, text, onSave) {
  const c = div.querySelector('.content');
  const old = c.innerHTML;
  c.innerHTML = '';
  const ta = document.createElement('textarea');
  ta.className = 'edittext'; ta.value = text;
  const row = document.createElement('div');
  row.style.cssText = 'margin-top:8px;display:flex;gap:8px;justify-content:flex-end';
  const save = makeOpsBtn('保存', async () => { await onSave(ta.value); });
  const cancel = makeOpsBtn('取消', () => { c.innerHTML = old; });
  row.append(save, cancel);
  c.append(ta, row);
}

// ---------- 流式对话 ----------
const enc = () => encodeURIComponent(cur.id);
const post = obj => ({ method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(obj) });

// 连续重连次数：接上（或正常收尾）后归零，用来在长时间断网时放弃等待
let reconnectTries = 0;

function removeLiveNodes(except) {
  const live = $('chat').querySelectorAll('.live');
  for (let k = live.length - 1; k >= 0; k--) {
    if (live[k] !== except) live[k].remove();
  }
}

// 错误说明条：和 makeAIBlock 里的 .errnote 保持同一种形态
function syncErrorNote(div, message) {
  const content = directChild(div, 'content');
  let note = directChild(div, 'errnote');
  if (!message) {
    if (note) note.remove();
    return;
  }
  if (!note) {
    note = document.createElement('div');
    note.className = 'errnote';
    div.insertBefore(note, content);
  }
  note.textContent = `〔生成出错〕${message}`;
}

// 用落盘 entry 对账选项区；形态没变就保留原节点（options-raw 的展开状态不丢）
function restoreOptionsArea(div, e) {
  const node = directChild(div, 'options') ||
    directChild(div, 'options-error') ||
    directChild(div, 'options-pending');
  if (e && e.options && e.options.length) {
    if (node && node.classList.contains('options')) return;
    setOptionsArea(div, optionsDiv(e.options));
  } else if (e && e.options_error) {
    if (node && node.classList.contains('options-error')) return;
    setOptionsArea(div, optionsErrorDiv(e.options_error, e.options_raw));
  } else {
    setOptionsArea(div, null);
  }
}

function paintNow(ov) {
  if (!ov) return;
  const pending = ov.scheduled;
  if (pending) {
    cancelAnimationFrame(ov.frame);
    ov.scheduled = false;
  }
  if (!ov.contentDiv) return;
  if (!pending && ov.painted === ov.partial) return;  // 已经画完了，别再重刷
  ov.contentDiv.innerHTML = renderMarkdown(ov.partial);
  ov.painted = ov.partial;
}

async function streamInto(url, opts, userText, reuseAI) {
  const sid = cur.id;
  const seq = ++streamSeq;
  streaming = true; updateComposer();
  // 新一轮开始时服务端会清掉上一次失败；错误条先收起（若这一轮又失败，收尾会再显示）
  if (cur.last_error) { cur.last_error = null; syncErrorBar(); }
  // 上一次流若在放弃重连时留下了 live 块，开新流前先清掉，避免旧块永远挂在下面
  removeLiveNodes(reuseAI || undefined);
  const chat = $('chat');
  // 用户输入块立即显示；它只是临时 overlay，落盘后由 finalizeTurn 转正
  let userDiv = null;
  if (userText != null) {
    userDiv = document.createElement('div');
    userDiv.className = 'block user live';
    userDiv._content = userText;
    userDiv.innerHTML = `<div class="tag">你</div><div class="content">${esc(userText)}</div>`;
    chat.appendChild(userDiv);
  }
  let div;
  if (reuseAI) {
    // 只重生成选项：正文已落盘，复用最后一个 AI 块（流里只有选项事件，正文保持不动）
    div = reuseAI;
    div.classList.add('live');
    directChild(div, 'tag').textContent = 'AI（生成选项中…）';
    const btns = div.querySelectorAll('button');
    for (let k = 0; k < btns.length; k++) btns[k].disabled = true;
  } else {
    div = document.createElement('div');
    div.className = 'block ai live';
    div.innerHTML = `<div class="tag">AI（生成中…）</div>
      <div class="content"></div>`;
    chat.appendChild(div);
  }
  // 每条流一份 overlay；切走后旧流继续读到第一个事件就断开，不再碰全局 UI
  const ov = {
    sid, seq, userDiv, aiDiv: div, reuseAI: !!reuseAI,
    contentDiv: directChild(div, 'content'),
    partial: '', painted: '', scheduled: false, frame: 0, saved: false, heard: false,
  };
  overlay = ov;
  // 流内滚动绑在当前这条流上：切走以后旧流不能再滚新会话
  function scrollStream() {
    if (seq !== streamSeq) return;
    if (stickBottom) chat.scrollTop = chat.scrollHeight;
  }
  scrollStream();
  const contentDiv = ov.contentDiv;
  contentDiv.classList.add('markdown');
  // 当前思考块:工具调用会切分思考,下一段思考另起新块(思考→工具→思考→…→正文)
  let thinkDiv = null;

  function flushContent() {
    if (seq !== streamSeq) return;
    ov.contentDiv.innerHTML = renderMarkdown(ov.partial);
    ov.painted = ov.partial;
    ov.scheduled = false;
    scrollStream();
  }
  function appendContent(delta) {
    if (seq !== streamSeq) return;
    ov.partial += delta;
    if (!ov.scheduled) {
      ov.scheduled = true;
      ov.frame = requestAnimationFrame(flushContent);
    }
  }

  let reader = null;
  try {
    const resp = await fetch(url, opts);
    // 会话过期/被踢：不当作"断线重连"，直接回登录页
    if (resp.status === 401) { showLogin('登录已过期，请重新登录'); return; }
    reader = resp.body.getReader();
    // fetch 可能在切会话之后才返回：别把旧 reader 写成全局，否则会顶掉新流的打断
    if (seq === streamSeq) activeReader = reader;
    const dec = new TextDecoder();
    let buf = '';
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let cut;
      while ((cut = buf.indexOf('\n\n')) !== -1) {
        const raw = buf.slice(0, cut); buf = buf.slice(cut + 2);
        const line = raw.split('\n').find(l => l.startsWith('data:'));
        if (!line) continue;
        const ev = JSON.parse(line.slice(5));
        if (seq !== streamSeq) {
          // 已切走：这一轮不再进 UI。等第一个事件确认服务端已注册 _active 后再断开
          // 本地读——POST 响应头可能比注册更早到，立刻取消有窗口会把整轮一起取消。
          if (!ov.heard) {
            ov.heard = true;
            try { await reader.cancel(); } catch (e) {}
          }
          break;
        }
        ov.heard = true;
        // 这一轮开始后服务端会清掉旧错误；UI 同步把旧错误条收掉
        if (cur && cur.last_error) {
          cur.last_error = null;
          syncErrorBar();
        }
        if (ev.type === 'reasoning') {
          if (!thinkDiv) {
            contentDiv.insertAdjacentHTML('beforebegin',
              '<details class="thinking"><summary>思考</summary><div></div></details>');
            thinkDiv = contentDiv.previousElementSibling.querySelector('div');
          }
          thinkDiv.textContent += ev.delta; scrollStream();
        }
        else if (ev.type === 'content') { appendContent(ev.delta); }
        // 工具调用块随流逐个出现（事件在工具执行完后到达，参数与结果一起拼入）
        else if (ev.type === 'tool') {
          contentDiv.insertAdjacentHTML('beforebegin', toolDetailsHTML(ev));
          thinkDiv = null;
          scrollStream();
        }
        // 助手块已落盘：整轮结束时优先就地定稿，不再整页重建
        else if (ev.type === 'saved') { ov.saved = true; }
        // 正文之后的选项请求：先淡色占位，拿到后换成按钮；失败换成提示+重试
        else if (ev.type === 'options_start') {
          const p = document.createElement('div');
          p.className = 'options-pending';
          p.textContent = '生成选项中…';
          setOptionsArea(div, p);
          scrollStream();
        }
        else if (ev.type === 'options') {
          setOptionsArea(div, optionsDiv(ev.options));
          scrollStream();
        }
        else if (ev.type === 'options_error') {
          setOptionsArea(div, optionsErrorDiv(ev.message, ev.raw));
          scrollStream();
        }
        else if (ev.type === 'error') {
          // 用户侧错误（如预设宏执行失败）弹窗提示；其余错误内联显示在 AI 块。
          // 半截输出已落盘时保留已流出的正文，错误说明用 .errnote 另起一行。
          if (ev.popup) alert(ev.message);
          // 只重掷选项时正文不动，错误只弹窗提示
          if (!reuseAI) {
            directChild(div, 'tag').textContent = '出错';
            if (ev.persisted) syncErrorNote(div, ev.message);
            else contentDiv.textContent = ev.message;
          }
        }
      }
      if (seq !== streamSeq) break;
    }
  } catch (err) {
    if (seq !== streamSeq) return;  // 已切走：不重连，也不对账
    if (!streaming) { /* 用户打断，属于正常路径 */ }
    else {
      // 连接断了：生成是会话级后台任务，后端那一轮照跑，重连接上继续看。
      // reconnecting 期间保持 busy，别让用户在这个窗口里发下一轮。
      streaming = false;
      activeReader = null;
      overlay = null;
      reconnecting = true;
      try {
        await reconnectTurn(seq, sid);
      } finally {
        if (seq === streamSeq) {
          reconnecting = false;
          updateComposer();
        }
      }
      return;
    }
  }
  if (seq !== streamSeq) return;
  activeReader = null;
  reconnectTries = 0;
  // 拉快照 + 就地定稿期间继续保持 busy，避免用户抢在当前轮对账前发下一轮
  finalizing = true;
  try {
    await finalizeFromServer(seq, sid, ov);
  } finally {
    if (seq === streamSeq) {
      finalizing = false;
      streaming = false;
      updateComposer();
    }
  }
}

// 正常结束/打断后拉一次权威快照：saved 就地定稿，否则按快照重建缺的块
async function finalizeFromServer(seq, sid, ov) {
  if (seq !== streamSeq || !cur || cur.id !== sid) return;
  let s;
  try {
    s = await api('/api/sessions/' + encodeURIComponent(sid));
  } catch (e) {
    if (seq !== streamSeq) return;
    if (ov && ov.reuseAI) {
      // 正文本来就没动，别把「生成选项中…」和禁用按钮留在页面上
      ov.aiDiv.classList.remove('live');
      directChild(ov.aiDiv, 'tag').textContent = 'AI';
      const btns = ov.aiDiv.querySelectorAll('button');
      for (let k = 0; k < btns.length; k++) btns[k].disabled = false;
      if (overlay === ov) overlay = null;
    } else {
      const tag = liveAITag();
      if (tag) tag.textContent = '已结束（同步失败，刷新可恢复）';
    }
    updateComposer();
    return;
  }
  if (seq !== streamSeq || !cur || cur.id !== sid) return;
  finalizeTurn(s, ov, seq);
}

function finalizeTurn(s, ov, seq) {
  if (seq !== streamSeq || !cur || cur.id !== s.id) return;
  cur = s;
  const h = s.history;
  const last = h[h.length - 1];
  if (ov) {
    if (ov.reuseAI && last && last.role === 'assistant') {
      // 只重掷选项：正文/思考/工具都不动，只恢复标签、选项区和按钮
      const div = ov.aiDiv;
      div.classList.remove('live');
      directChild(div, 'tag').textContent = 'AI';
      restoreOptionsArea(div, last);
      fillAIOps(div, last, h.length - 1);
      const btns = div.querySelectorAll('button');
      for (let k = 0; k < btns.length; k++) btns[k].disabled = false;
      div._sig = entrySig(last);
    } else if (!ov.reuseAI && ov.saved && last && last.role === 'assistant') {
      const i = h.length - 1;
      const div = ov.aiDiv;
      paintNow(ov);
      div.classList.remove('live');
      div.setAttribute('data-key', 'assistant:' + i);
      directChild(div, 'tag').textContent = last.error ? '出错' : 'AI';
      if (last.content !== ov.painted) {
        ov.contentDiv.innerHTML = renderMarkdown(last.content);
        ov.painted = last.content;
      }
      syncErrorNote(div, last.error);
      restoreOptionsArea(div, last);
      fillAIOps(div, last, i);
      div._sig = entrySig(last);
      if (ov.userDiv) {
        ov.userDiv.classList.remove('live');
        ov.userDiv.setAttribute('data-key', 'user:' + (i - 1));
        fillUserOps(ov.userDiv, i - 1);
      }
    } else {
      // 没有落盘的助手块（弹窗错误/失败前就断了）：丢掉 overlay，按快照补齐
      removeLiveNodes();
    }
  }
  if (overlay === ov) overlay = null;
  reconcileSession();
  syncStick();
  loadSessions().catch(() => {});
}

// 这一轮已在服务端结束：丢掉 live 覆盖层，按快照对账（不重建没变的块）
function finishFromSnapshot(s) {
  if (!cur || cur.id !== s.id) return;
  cur = s;
  overlay = null;
  removeLiveNodes();
  reconcileSession();
  updateComposer();
  loadSessions().catch(() => {});
}

// 断线后重连续看：后端还在生成就重放整轮接上，这一轮已结束就按快照对账。
// seq/sid 保证切到别的会话后，旧流的重连不会把新会话顶掉。
async function reconnectTurn(seq, sid) {
  if (seq !== streamSeq || !cur || cur.id !== sid) return;
  let s = null;
  try { s = await api('/api/sessions/' + encodeURIComponent(sid)); } catch (e) {}
  if (seq !== streamSeq || !cur || cur.id !== sid) return;
  if (s && !s.generating) {
    reconnectTries = 0;
    finishFromSnapshot(s);
    return;
  }
  if (++reconnectTries > 12) {
    // 网络长时间不通：把半截内容留在屏幕上，刷新或切回前台会重新接上
    const tag = liveAITag();
    if (tag) tag.textContent = '连接中断（刷新页面可接上）';
    overlay = null;
    updateComposer();
    return;
  }
  await new Promise(r => setTimeout(r, Math.min(1000 * 2 ** reconnectTries, 5000)));
  if (seq !== streamSeq || !cur || cur.id !== sid) return;
  await attachTurn(s, seq);
}

// 接上后端正在进行的这一轮（页面加载、断线重连、切回前台共用）：
// 先按快照对账已提交历史，再挂上 overlay 重放本轮流。
async function attachTurn(fresh, seq) {
  if (seq != null && seq !== streamSeq) return;
  if (selecting || streaming || finalizing || !cur) return;
  const sid = cur.id;
  let s = fresh;
  if (!s) {
    try { s = await api('/api/sessions/' + encodeURIComponent(sid)); }
    catch (e) { await reconnectTurn(seq, sid); return; }
  }
  if (seq != null && seq !== streamSeq) return;
  if (!cur || cur.id !== sid || s.id !== sid || streaming || finalizing) return;
  cur = s;
  overlay = null;
  removeLiveNodes();
  reconcileSession();
  const g = s.generating;
  if (!g) { updateComposer(); return; }
  const last = s.history[s.history.length - 1];
  // options（只重掷选项）：正文已落盘，复用最后一个 AI 块接选项事件
  let reuseAI = null;
  if (g.mode === 'options') {
    reuseAI = cur.history.length
      ? findBlock('assistant:' + (cur.history.length - 1))
      : null;
    if (!reuseAI) { updateComposer(); return; }
  }
  // 这一轮的用户输入后端开局就已落盘（history 末尾就是它，界面已按 history 画好），
  // 只有末尾不是用户块时才需要现场补画一个
  const userText = g.mode === 'chat' && !(last && last.role === 'user') ? g.user_input : null;
  // 新流用 streaming 表示 busy；旧的 reconnect finally 因 seq 变化不会再清它
  reconnecting = false;
  await streamInto(`/api/sessions/${encodeURIComponent(sid)}/stream`, {}, userText, reuseAI);
}

async function interrupt() {
  if (finalizing) return;  // 已经结束、正在对账，没有可打断的流
  // 先通知后端取消生成并落盘半截输出，再断开本地流
  try { await api(`/api/sessions/${enc()}/interrupt`, { method: 'POST' }); } catch (e) {}
  streaming = false;
  if (activeReader) { try { await activeReader.cancel(); } catch (e) {} }
}

function send() {
  const text = $('input').value.trim();
  if (!text || selecting || streaming || finalizing || reconnecting || cur.generating) return;
  $('input').value = '';
  autoGrow();
  if (!cur.history.length) return; // 首轮用「开始」
  reconnectTries = 0;
  streamInto(`/api/sessions/${enc()}/chat`, post({ input: text }), text);
}

function regenerate() {
  if (selecting || streaming || finalizing || reconnecting || cur.generating) return;
  reconnectTries = 0;
  // 立即移除旧的最后一个 AI 块，避免新旧两块同时显示；末尾是用户块时（上一轮没写出来）
  // 没有要替换的 AI 块，别误删更早的那个
  const last = cur.history[cur.history.length - 1];
  if (last && last.role === 'assistant') {
    const node = findBlock('assistant:' + (cur.history.length - 1));
    if (node) node.remove();
  }
  streamInto(`/api/sessions/${enc()}/regenerate`, { method: 'POST' });
}

// 只重掷最后一轮的选项（正文不动，不新增块）：复用最后一个 AI 块接选项阶段的流
function regenerateOptions() {
  if (selecting || streaming || finalizing || reconnecting || cur.generating) return;
  reconnectTries = 0;
  const last = cur.history[cur.history.length - 1];
  if (!last || last.role !== 'assistant') return;
  const div = findBlock('assistant:' + (cur.history.length - 1));
  if (!div) return;
  streamInto(`/api/sessions/${enc()}/regenerate_options`, { method: 'POST' }, null, div);
}

$('send').onclick = () => {
  if (selecting || finalizing) return;
  if (streaming || reconnecting || cur.generating) { interrupt(); return; }
  const last = cur.history[cur.history.length - 1];
  reconnectTries = 0;
  if (!last) streamInto(`/api/sessions/${enc()}/start`, { method: 'POST' });
  else if (last.role === 'user') regenerate();  // 末尾是用户块：把这一轮补出来
  else send();
};
$('input').addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.ctrlKey) { e.preventDefault(); $('send').click(); }
});
// 输入框随内容自动增高（68px ~ 320px）
function autoGrow() {
  const ta = $('input');
  ta.style.height = 'auto';
  ta.style.height = Math.min(ta.scrollHeight, 320) + 'px';
}
$('input').addEventListener('input', autoGrow);

$('previewBtn').onclick = () => {
  sessionStorage.setItem('preview_draft', $('input').value);
  window.open('/preview.html?session=' + enc(), '_blank');
};
$('presetSelect').onchange = async e => {
  await api(`/api/sessions/${enc()}/preset`, post({ preset: e.target.value }));
  cur.preset = e.target.value;
};
$('effortSelect').onchange = async e => {
  await api(`/api/sessions/${enc()}/reasoning_effort`, post({ effort: e.target.value }));
  cur.reasoning_effort = e.target.value;
};
// 选项开关：关掉后正文照常生成、不再发选项请求；不影响进行中的流
$('optionsToggle').onchange = async e => {
  const s = await api(`/api/sessions/${enc()}/options`, post({ enabled: e.target.checked }));
  cur.options_enabled = s.options_enabled;
};
$('endpointSelect').onchange = async e => {
  await api(`/api/sessions/${enc()}/endpoint`, post({ index: +e.target.value }));
  cur.endpoint = +e.target.value;
};
// 温度/上限：失焦或回车提交；清空则回退全局默认
async function pushParams() {
  const body = {
    temperature: $('tempInput').value === '' ? null : +$('tempInput').value,
    max_tokens: $('maxTokensInput').value === '' ? null : Math.round(+$('maxTokensInput').value),
  };
  const s = await api(`/api/sessions/${enc()}/params`, post(body));
  cur.temperature = s.temperature;
  cur.max_tokens = s.max_tokens;
}
$('tempInput').onchange = pushParams;
$('maxTokensInput').onchange = pushParams;

// ---------- 新建会话 ----------
$('newSessionBtn').onclick = async () => {
  const [presets, cards] = await Promise.all([api('/api/presets'), api('/api/cards')]);
  $('mPreset').innerHTML = presets.map(p => `<option value="${esc(p.id)}">${esc(p.name)}</option>`).join('');
  $('mCard').innerHTML = cards.map(c => `<option value="${esc(c.id)}">${esc(c.name)}</option>`).join('');
  const fillBeginnings = () => {
    const c = cards.find(x => x.id === $('mCard').value);
    $('mBeginning').innerHTML = `<option value="">（空开局）</option>` +
      c.beginnings.map((b, i) => `<option value="${i}">开局 ${i + 1}：${esc(b)}…</option>`).join('');
    // 默认选中第一个开局，没有开局才是空开局
    if (c.beginnings.length) $('mBeginning').selectedIndex = 1;
  };
  $('mCard').onchange = fillBeginnings;
  fillBeginnings();
  $('modalMask').style.display = 'flex';
};
$('mCancel').onclick = () => $('modalMask').style.display = 'none';
$('mCreate').onclick = async () => {
  const body = {
    name: $('mName').value.trim(),
    preset: $('mPreset').value,
    card: $('mCard').value,
    beginning_index: $('mBeginning').value === '' ? null : +$('mBeginning').value,
  };
  try {
    const s = await api('/api/sessions', post(body));
    $('modalMask').style.display = 'none';
    await selectSession(s.id);
  } catch (e) { alert(e.message); }
};

// 手机上锁屏/切走再回来：这一轮可能还在跑，没接上就重新接（长断网放弃后也靠它恢复）。
// 顺便对账一次快照：别的标签页改了历史时，这里按 key 增量更新，不整页重建。
document.addEventListener('visibilitychange', async () => {
  if (document.visibilityState !== 'visible' || selecting || streaming || finalizing || reconnecting || !cur) return;
  const sid = cur.id;
  const sseq = selectSeq;
  try {
    const s = await api('/api/sessions/' + encodeURIComponent(sid));
    // 期间已经切到别的会话（包括正在等 GET 的新选择）：这次刷新不能接管
    if (sseq !== selectSeq || !cur || cur.id !== sid) return;
    if (s.generating) {
      reconnectTries = 0;
      await attachTurn(s);
    } else if (overlay || cur.generating) {
      finishFromSnapshot(s);
    } else {
      cur = s;
      reconcileSession();
    }
  } catch (e) {}
});

// ---------- 登录 / 注销 ----------

function showLogin(message) {
  // 掉线重连/流式读到一半被踢：先把本地流收掉，别让后台读继续跑
  streamSeq++;  // 让所有在途的流/重连/对账失效
  selectSeq++;
  selecting = false;
  streaming = false;
  finalizing = false;
  reconnecting = false;
  overlay = null;
  if (activeReader) { try { activeReader.cancel(); } catch (e) {} activeReader = null; }
  cur = null;
  syncErrorBar();
  $('sessionList').innerHTML = '';
  $('toolbar').style.display = 'none';
  $('composer').style.display = 'none';
  $('chat').innerHTML = '<div id="emptyHint">请先登录</div>';
  $('logoutBtn').style.display = 'none';
  $('loginErr').textContent = message || '';
  $('loginMask').style.display = 'flex';
  $('loginPass').value = '';
  $('loginUser').focus();
}

async function doLogin() {
  const username = $('loginUser').value.trim();
  const password = $('loginPass').value;
  if (!username || !password) { $('loginErr').textContent = '请填写用户名和密码'; return; }
  const btn = $('loginBtn');
  btn.disabled = true;
  $('loginErr').textContent = '';
  try {
    // 登录失败是 401，这里不能走 api()（那会把 401 当成"登录过期"再弹一次登录页）
    const r = await fetch('/api/login', post({ username, password }));
    const data = await r.json().catch(() => ({}));
    if (!r.ok) {
      $('loginErr').textContent = data.detail || '登录失败';
      btn.disabled = false;
      return;
    }
    currentUser = data.user || username;
    $('loginPass').value = '';
    $('loginMask').style.display = 'none';
    btn.disabled = false;
    await boot();
  } catch (e) {
    $('loginErr').textContent = '登录请求失败：' + e.message;
    btn.disabled = false;
  }
}

$('loginBtn').onclick = doLogin;
$('loginUser').addEventListener('keydown', e => { if (e.key === 'Enter') $('loginPass').focus(); });
$('loginPass').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
$('logoutBtn').onclick = async () => {
  if (!confirm('退出登录？')) return;
  try { await fetch('/api/logout', { method: 'POST' }); } catch (e) {}
  currentUser = null;
  rememberSession(null);
  showLogin('');
};

// ---------- 启动 ----------

// 先问服务端要不要登录（没开鉴权时 user 为 null、auth_enabled 为 false，直接进主界面），
// 再加载会话列表并把上次选中的会话恢复回来（已删除则清除记录，退回主界面）
async function boot() {
  const me = await api('/api/me');
  authEnabled = !!me.auth_enabled;
  if (me.user) currentUser = me.user;
  $('logoutBtn').style.display = authEnabled && currentUser ? 'inline-flex' : 'none';
  if (authEnabled && !currentUser) { showLogin(''); return; }
  const list = await loadSessions();
  const last = localStorage.getItem(lastSessionKey());
  if (!last) return;
  if (!list.some(s => s.id === last)) { rememberSession(null); return; }
  try {
    await selectSession(last);
  } catch (e) {
    rememberSession(null);
  }
}

// 侧栏状态轮询：切走的会话在后台生成，靠它更新「生成中」/「出错」/轮数。
// 只在可见且已选中会话时跑；列表接口本身很小。
let sessionsPolling = false;
setInterval(async () => {
  if (sessionsPolling || document.visibilityState !== 'visible' || !cur) return;
  sessionsPolling = true;
  try { await loadSessions(); } catch (e) {} finally { sessionsPolling = false; }
}, 5000);

boot();
</script>
