<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AIRP</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.6/dist/purify.min.js"></script>
<style>
  :root {
    --bg: #141519;
    --panel: #1d1f25;
    --panel2: #23262e;
    --border: #2e313a;
    --text: #d8dade;
    --dim: #8b8e98;
    --accent: #6c9bff;
    --ai: #58b788;
    --gold: #c9a25e;
    --danger: #d16060;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif; background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; }
  button { cursor: pointer; background: var(--panel2); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 3px 12px; font-size: 13px; transition: background .15s, border-color .15s; }
  button:hover { background: #2e323c; border-color: #3d414c; }
  button:disabled { opacity: .35; cursor: default; }
  select, input[type=text] { background: var(--panel2); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 4px 8px; }
  input[type=number] { background: var(--panel2); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 4px 4px; width: 72px; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: #33363f; border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: #444854; }
  ::-webkit-scrollbar-track { background: transparent; }

  #layout { flex: 1; display: flex; min-height: 0; }

  /* ---------- 侧栏 ---------- */
  aside { width: 230px; border-right: 1px solid var(--border); background: var(--panel); display: flex; flex-direction: column; flex-shrink: 0; transition: width .18s ease, transform .2s ease; overflow: hidden; }
  .aside-head { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; border-bottom: 1px solid var(--border); }
  .logo { font-weight: bold; letter-spacing: 1px; color: var(--accent); white-space: nowrap; }
  #toggleSide { padding: 1px 8px; color: var(--dim); }
  #sideBody { padding: 12px; overflow-y: auto; flex: 1; }
  aside.collapsed { width: 46px; }
  aside.collapsed #sideBody, aside.collapsed .logo { display: none; }
  aside.collapsed .aside-head { justify-content: center; padding: 10px 0; border-bottom: none; }
  #newSessionBtn { width: 100%; padding: 6px 0; color: var(--accent); }
  #sideBody h3 { font-size: 12px; color: var(--dim); margin: 14px 2px 6px; font-weight: normal; }
  #sessionList { list-style: none; }
  #sessionList li { padding: 7px 9px; border-radius: 6px; cursor: pointer; font-size: 13px; display: flex; align-items: center; gap: 6px; }
  #sessionList li:hover { background: var(--panel2); }
  #sessionList li.active { background: #2b3a55; color: #cfe0ff; }
  #sessionList li .sname { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #sessionList li .turns { flex: none; font-size: 11px; color: var(--dim); }
  #sessionList li.active .turns { color: #9db6e4; }
  #sessionList li .del { display: none; padding: 0 6px; font-size: 13px; line-height: 1.4; color: var(--dim); }
  #sessionList li .del:hover { color: var(--danger); }
  #sessionList li:hover .del { display: block; }

  /* ---------- 主区 ---------- */
  main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #toolbar { display: flex; gap: 12px; align-items: center; padding: 9px 18px; border-bottom: 1px solid var(--border); background: var(--panel); flex-wrap: wrap; position: relative; }
  #toolbar .sessname { font-weight: bold; font-size: 14px; }
  #toolbar label { font-size: 13px; color: var(--dim); display: flex; gap: 6px; align-items: center; }
  #settings { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  #settingsBtn { display: none; }
  #topBar { display: none; }
  #chat { flex: 1; overflow-y: auto; padding: 22px 24px 30px; }

  .block { max-width: 840px; margin: 0 auto 16px; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 14px 18px; position: relative; box-shadow: 0 1px 3px rgba(0,0,0,.25); }
  .block.ai { border-left: 3px solid var(--ai); }
  .block.user { border-left: 3px solid var(--accent); background: #1c2230; }
  .block.beginning { border-left: 3px solid var(--gold); }
  .block .tag { font-size: 12px; color: var(--dim); margin-bottom: 8px; letter-spacing: .5px; }
  .block.ai .tag { color: var(--ai); }
  .block.user .tag { color: var(--accent); }
  .block.beginning .tag { color: var(--gold); }
  .block .ops { position: absolute; top: 10px; right: 12px; display: flex; gap: 6px; opacity: 0; transition: opacity .15s; }
  .block:hover .ops { opacity: 1; }
  .block .ops button { font-size: 12px; padding: 2px 9px; background: rgba(35,38,46,.9); }
  .block .content { white-space: pre-wrap; line-height: 1.85; word-break: break-word; font-size: 15px; }
  .block .content.markdown { white-space: normal; }
  .block .content.markdown p { margin-bottom: 0.75em; }
  .block .content.markdown p:last-child { margin-bottom: 0; }
  .block .content.markdown h1, .block .content.markdown h2, .block .content.markdown h3, .block .content.markdown h4, .block .content.markdown h5, .block .content.markdown h6 { margin: 0.8em 0 0.4em; font-weight: 600; line-height: 1.4; }
  .block .content.markdown h1 { font-size: 1.45em; }
  .block .content.markdown h2 { font-size: 1.3em; }
  .block .content.markdown h3 { font-size: 1.15em; }
  .block .content.markdown ul, .block .content.markdown ol { margin: 0.6em 0; padding-left: 1.5em; }
  .block .content.markdown li { margin: 0.25em 0; }
  .block .content.markdown blockquote { margin: 0.6em 0; padding: 0.4em 0.8em; border-left: 3px solid #4a5568; color: #a9adb8; background: rgba(255,255,255,.03); border-radius: 0 6px 6px 0; }
  .block .content.markdown code { background: rgba(255,255,255,.08); padding: 0.15em 0.35em; border-radius: 4px; font-family: "JetBrains Mono", "Fira Code", Consolas, monospace; font-size: 0.9em; }
  .block .content.markdown pre { background: #17191e; border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; margin: 0.6em 0; overflow-x: auto; }
  .block .content.markdown pre code { background: transparent; padding: 0; font-size: 0.85em; white-space: pre-wrap; word-break: break-word; }
  .block .content.markdown a { color: var(--accent); text-decoration: none; }
  .block .content.markdown a:hover { text-decoration: underline; }
  .block .content.markdown table { border-collapse: collapse; margin: 0.6em 0; width: 100%; }
  .block .content.markdown th, .block .content.markdown td { border: 1px solid var(--border); padding: 6px 10px; }
  .block .content.markdown th { background: rgba(255,255,255,.05); }
  .block .content.markdown hr { border: none; border-top: 1px solid var(--border); margin: 1em 0; }
  .errnote { color: #e07a5f; font-size: 13px; line-height: 1.6; margin-bottom: 8px; padding: 6px 10px; background: rgba(224,122,95,.08); border-left: 3px solid #e07a5f; border-radius: 0 6px 6px 0; }
  .options { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--border); }
  .options button { background: #253047; border-color: #35466b; color: #a9c4f5; font-size: 12px; border-radius: 20px; padding: 4px 14px; max-width: 100%; white-space: normal; text-align: left; }
  .options button:hover { background: #2c3a58; border-color: #4a5f8f; }
  .options-pending, .options-error { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--border); color: var(--dim); font-size: 12px; }
  .options-error button { font-size: 12px; padding: 2px 9px; background: rgba(35,38,46,.9); }
  .options-raw { flex-basis: 100%; background: #1a1c23; border: 1px solid #2a2d38; border-radius: 8px; padding: 7px 12px; }
  .options-raw summary { color: #8198bd; font-size: 12px; cursor: pointer; }
  .options-raw .raw { white-space: pre-wrap; word-break: break-word; color: #9095a0; font-size: 13px; margin-top: 8px; line-height: 1.7; max-height: 320px; overflow: auto; }
  details.thinking { margin-bottom: 10px; background: #191b20; border: 1px solid #26282f; border-radius: 8px; padding: 7px 12px; }
  details.thinking summary { color: #7a9b7a; font-size: 12px; cursor: pointer; }
  details.thinking div { white-space: pre-wrap; color: #9095a0; font-size: 13px; margin-top: 8px; line-height: 1.7; }
  details.toolcall { margin-bottom: 10px; background: #1a1c23; border: 1px solid #2a2d38; border-radius: 8px; padding: 7px 12px; }
  details.toolcall summary { color: #8198bd; font-size: 12px; cursor: pointer; }
  details.toolcall .tc-label { color: #5c6068; font-size: 11px; margin-top: 8px; }
  details.toolcall .tc { white-space: pre-wrap; color: #9095a0; font-size: 13px; margin-top: 3px; line-height: 1.7; word-break: break-word; }
  .edittext { width: 100%; min-height: 140px; background: #17191e; color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: 10px; font-family: inherit; line-height: 1.7; font-size: 14px; }

  #composer { border-top: 1px solid var(--border); padding: 14px 24px 16px; background: var(--panel); }
  #composerInner { margin: 0 auto; display: flex; gap: 10px; align-items: flex-end; }
  #input { flex: 1; resize: none; min-height: 68px; max-height: 320px; background: var(--panel2); color: var(--text); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; font-family: inherit; line-height: 1.6; font-size: 14px; overflow-y: auto; }
  #input:focus { outline: none; border-color: var(--accent); }
  #send { min-height: 68px; padding: 0 26px; font-size: 14px; background: #2b3a55; border-color: #3d5279; color: #cfe0ff; align-self: stretch; }
  #send:hover:not(:disabled) { background: #34496b; }
  #send.interrupting { background: #4a2b2b; border-color: #6b3a3a; color: #f0b0b0; }
  #send.interrupting:hover { background: #5a3535; }
  #emptyHint { color: #565a64; text-align: center; margin-top: 60px; font-size: 14px; }

  #modalMask { position: fixed; inset: 0; background: rgba(0,0,0,.65); display: none; align-items: center; justify-content: center; }
  #modal { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 22px; width: 440px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 8px 30px rgba(0,0,0,.5); }
  #modal h3 { font-size: 15px; }
  #modal label { font-size: 12px; color: var(--dim); display: block; margin-bottom: 5px; }
  #modal select, #modal input { width: 100%; }
  #modal .row { display: flex; gap: 10px; justify-content: flex-end; margin-top: 4px; }

  /* ---------- 移动端侧栏改为抽屉 ---------- */
  @media (max-width: 640px) {
    #topBar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 12px;
      border-bottom: 1px solid var(--border);
      background: var(--panel);
      flex-shrink: 0;
      position: relative;
      z-index: 10;
    }
    #menuBtn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 32px; height: 32px;
      padding: 0;
      background: var(--panel2);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: 16px;
    }
    aside {
      position: fixed;
      left: 0; top: 0; bottom: 0;
      width: 260px;
      z-index: 30;
      border-right: none;
      box-shadow: 2px 0 16px rgba(0,0,0,.5);
      transform: translateX(0);
      transition: transform .2s ease;
    }
    aside.collapsed {
      width: 260px;
      transform: translateX(-100%);
      pointer-events: none;
    }
    /* 手机上正文块顶满屏幕，不再保留左右边距 */
    #chat { padding: 0 0 12px; }
    .block {
      max-width: none;
      margin: 0 0 12px;
      padding: 12px 14px;
    }
    /* 工具栏收成「会话名 + ⚙」单行，设置项点开才是浮层 */
    #toolbar { flex-wrap: nowrap; gap: 8px; padding: 8px 12px; }
    #toolbar .sessname { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; font-weight: normal; }
    #toolbar .cardpart { display: none; }
    #settingsBtn { display: inline-flex; align-items: center; padding: 4px 10px; font-size: 15px; }
    #settings {
      display: none;
      position: absolute;
      top: calc(100% + 6px);
      left: 8px; right: 8px;
      z-index: 20;
      flex-direction: column;
      align-items: stretch;
      gap: 10px;
      padding: 12px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      box-shadow: 0 8px 24px rgba(0,0,0,.55);
    }
    #settings.open { display: flex; }
    #settings label { justify-content: space-between; }
    #settings select { flex: 0 1 auto; max-width: 62%; }
  }
</style>
</head>
<body>
<div id="layout">
  <aside id="sidebar">
    <div class="aside-head">
      <span class="logo">AIRP</span>
      <button id="toggleSide" title="收起/展开侧栏">«</button>
    </div>
    <div id="sideBody">
      <button id="newSessionBtn">＋ 新建会话</button>
      <h3>会话</h3>
      <ul id="sessionList"></ul>
    </div>
  </aside>
  <main>
    <div id="topBar"><button id="menuBtn" title="侧栏">☰</button><span class="logo">AIRP</span></div>
    <div id="toolbar" style="display:none">
      <span class="sessname" id="sessName"></span>
      <button id="settingsBtn" title="会话设置">⚙</button>
      <div id="settings">
        <label>预设 <select id="presetSelect"></select></label>
        <label>模型 <select id="endpointSelect"></select></label>
        <label>思考 <select id="effortSelect">
          <option value="none">关闭</option>
          <option value="low">低</option>
          <option value="medium">中</option>
          <option value="high">高</option>
          <option value="max">最高</option>
        </select></label>
        <label>选项 <input type="checkbox" id="optionsToggle"></label>
        <label>温度 <input type="number" id="tempInput" min="0" max="2" step="0.1"></label>
        <label>上限 <input type="number" id="maxTokensInput" min="1" step="1000"></label>
        <button id="previewBtn">预览上下文</button>
      </div>
    </div>
    <div id="chat"><div id="emptyHint">请选择或新建一个会话</div></div>
    <div id="composer" style="display:none">
      <div id="composerInner">
        <textarea id="input" placeholder="输入你的行动或对话…（Ctrl+Enter 发送）"></textarea>
        <button id="send">发送</button>
      </div>
    </div>
  </main>
</div>

<div id="modalMask">
  <div id="modal">
    <h3>新建会话</h3>
    <div><label>名称（留空自动生成）</label><input type="text" id="mName"></div>
    <div><label>角色卡</label><select id="mCard"></select></div>
    <div><label>预设</label><select id="mPreset"></select></div>
    <div><label>开局</label><select id="mBeginning"></select></div>
    <div class="row"><button id="mCancel">取消</button><button id="mCreate">创建</button></div>
  </div>
</div>

<script>
let cur = null;          // 当前 session 完整数据
let streaming = false;
let activeReader = null; // 进行中的流读取器，用于打断
let stickBottom = true;  // 用户是否停留在聊天底部
const $ = id => document.getElementById(id);

// 贴底时自动下滚；用户上滚后不再打扰
function scrollBottom(force) {
  const c = $('chat');
  if (force || stickBottom) c.scrollTop = c.scrollHeight;
}
$('chat').addEventListener('scroll', () => {
  const c = $('chat');
  stickBottom = c.scrollHeight - c.scrollTop - c.clientHeight < 40;
});

function syncToggle() {
  $('toggleSide').textContent = $('sidebar').classList.contains('collapsed') ? '»' : '«';
}
function toggleSidebar() {
  $('sidebar').classList.toggle('collapsed');
  syncToggle();
}
$('toggleSide').onclick = toggleSidebar;
$('menuBtn').onclick = toggleSidebar;

// 移动端设置浮层：⚙ 开关，点面板外收起
$('settingsBtn').onclick = e => {
  e.stopPropagation();
  $('settings').classList.toggle('open');
};
document.addEventListener('click', e => {
  const s = $('settings');
  if (s.classList.contains('open') && !s.contains(e.target) && e.target.id !== 'settingsBtn')
    s.classList.remove('open');
});

// 移动端默认收起侧栏，点击主区域外自动收起
if (window.innerWidth <= 640) {
  $('sidebar').classList.add('collapsed');
  syncToggle();
}
document.addEventListener('click', e => {
  if (window.innerWidth > 640) return;
  const sb = $('sidebar');
  if (!sb.classList.contains('collapsed') && !sb.contains(e.target) && e.target.id !== 'menuBtn') {
    sb.classList.add('collapsed');
    syncToggle();
  }
});

async function api(path, opts) {
  const r = await fetch(path, opts);
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || r.statusText);
  return r.json();
}

function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

function renderMarkdown(text) {
  if (!text) return '';
  if (typeof marked === 'undefined' || typeof DOMPurify === 'undefined') return esc(text);
  try {
    const html = marked.parse(text, { async: false });
    return DOMPurify.sanitize(html, { USE_PROFILES: { html: true } });
  } catch (e) {
    return esc(text);
  }
}

// ---------- 会话列表 ----------
// 记住当前会话，刷新/重开页面时自动回到它
const LAST_SESSION_KEY = 'last_session';
function rememberSession(id) {
  if (id) localStorage.setItem(LAST_SESSION_KEY, id);
  else localStorage.removeItem(LAST_SESSION_KEY);
}

async function loadSessions() {
  const list = await api('/api/sessions');
  // 列表项显示角色卡名（卡内定义的名字）+ 已运行轮数；会话名放 title 里备查
  $('sessionList').innerHTML = list.map(s =>
    `<li data-i="${esc(s.id)}" data-n="${esc(s.name)}" title="${esc(s.name)}" class="${cur && cur.id === s.id ? 'active' : ''}">` +
    `<span class="sname">${esc(s.card_name || s.name)}</span>` +
    `<span class="turns">${s.turns} 轮</span>` +
    `<button class="del" title="删除会话">×</button></li>`).join('');
  document.querySelectorAll('#sessionList li').forEach(li => {
    li.onclick = () => selectSession(li.dataset.i);
    li.querySelector('.del').onclick = async e => {
      e.stopPropagation();
      if (!confirm(`删除会话「${li.dataset.n}」？此操作不可恢复。`)) return;
      await api('/api/sessions/' + encodeURIComponent(li.dataset.i), { method: 'DELETE' });
      if (cur && cur.id === li.dataset.i) {
        cur = null;
        rememberSession(null);
        $('toolbar').style.display = 'none';
        $('composer').style.display = 'none';
        $('chat').innerHTML = '<div id="emptyHint">请选择或新建一个会话</div>';
      }
      loadSessions();
    };
  });
  return list;
}

async function selectSession(id) {
  cur = await api('/api/sessions/' + encodeURIComponent(id));
  rememberSession(cur.id);
  stickBottom = true;
  render();
  loadSessions();
  // 后端这一轮还在跑（刷新/换设备后回到同一会话）：接上它继续看
  if (cur.generating) attachTurn();
  // 在手机上选好会话后自动收起抽屉
  if (window.innerWidth <= 640) {
    $('sidebar').classList.add('collapsed');
    syncToggle();
  }
}

// ---------- 渲染 ----------
function render() {
  $('emptyHint')?.remove();
  $('toolbar').style.display = 'flex';
  $('composer').style.display = 'block';
  $('sessName').innerHTML = esc(cur.name) +
    `<span class="cardpart">（角色卡：${esc(cur.card_name || cur.card)}）</span>`;
  renderPresetSelect();
  renderEndpointSelect();
  // 后端在 GET 会话时已解析出实际生效值
  $('effortSelect').value = cur.reasoning_effort || 'low';
  $('optionsToggle').checked = !!cur.options_enabled;
  $('tempInput').value = cur.temperature ?? '';
  $('maxTokensInput').value = cur.max_tokens ?? '';
  const chat = $('chat');
  chat.innerHTML = '';
  // 开局块：永远是对话界面第一个块
  chat.appendChild(makeBeginningBlock());
  cur.history.forEach((e, i) => {
    chat.appendChild(e.role === 'assistant' ? makeAIBlock(e, i) : makeUserBlock(e, i));
  });
  scrollBottom();
  updateComposer();
}

function renderPresetSelect() {
  api('/api/presets').then(list => {
    $('presetSelect').innerHTML = list.map(p =>
      `<option value="${esc(p.id)}" ${p.id === cur.preset ? 'selected' : ''}>${esc(p.name)}</option>`).join('');
  });
}

function renderEndpointSelect() {
  api('/api/endpoints').then(list => {
    $('endpointSelect').innerHTML = list.map(e =>
      `<option value="${e.index}" ${e.index === cur.endpoint ? 'selected' : ''}>${esc(e.display_name)}</option>`).join('');
  });
}

function updateComposer() {
  // 空历史 = 等待点击「开始」；最后一块是 AI = 等待用户输入
  const started = cur.history.length > 0;
  const waiting = !started || cur.history[cur.history.length - 1].role === 'assistant';
  const btn = $('send');
  // cur.generating：后端这一轮还在跑（本页刷新回来、或别的页面/设备发起的）
  const busy = streaming || !!cur.generating;
  if (busy) {
    btn.textContent = '打断';
    btn.disabled = false;
    btn.classList.add('interrupting');
  } else {
    btn.classList.remove('interrupting');
    btn.textContent = started ? '发送' : '开始';
    btn.disabled = !waiting;
  }
  $('input').disabled = busy || !started || !waiting;
}

function makeOpsBtn(text, fn) {
  const b = document.createElement('button');
  b.textContent = text; b.onclick = fn;
  return b;
}

// 剧情推进选项按钮：历史块与流式渲染共用
function optionsDiv(options) {
  const opts = document.createElement('div');
  opts.className = 'options';
  options.forEach(o => {
    const b = document.createElement('button');
    b.textContent = o;
    b.onclick = () => { $('input').value = o; send(); };
    opts.appendChild(b);
  });
  return opts;
}

// 选项生成失败：淡色一行说明 + 重试按钮（历史块与流式渲染共用）
function optionsErrorDiv(message, raw) {
  const d = document.createElement('div');
  d.className = 'options-error';
  const span = document.createElement('span');
  span.textContent = `〔选项生成失败〕${message}`;
  d.appendChild(span);
  d.appendChild(makeOpsBtn('重新生成选项', regenerateOptions));
  if (raw) d.appendChild(optionsRawDetails(raw));
  return d;
}

// 选项请求失败时模型实际产出的原文（含重试各次的输出）：排查解析问题就看这里
function optionsRawDetails(raw) {
  const det = document.createElement('details');
  det.className = 'options-raw';
  const sum = document.createElement('summary');
  sum.textContent = '模型原始输出';
  const body = document.createElement('div');
  body.className = 'raw';
  body.textContent = raw;
  det.appendChild(sum);
  det.appendChild(body);
  return det;
}

// AI 块的选项区只留一份（占位/按钮/错误提示互斥），换形态前清掉旧的
function setOptionsArea(div, node) {
  div.querySelectorAll('.options, .options-pending, .options-error').forEach(el => el.remove());
  if (node) div.appendChild(node);
}

function makeBeginningBlock() {
  const div = document.createElement('div');
  div.className = 'block beginning';
  div.innerHTML = `<div class="tag">开局</div><div class="content markdown">${renderMarkdown(cur.beginning_text || '（空开局）')}</div>`;
  const ops = document.createElement('div');
  ops.className = 'ops';
  ops.appendChild(makeOpsBtn('修改', () => editBlock(div, cur.beginning_text, async text => {
    await api(`/api/sessions/${enc()}/beginning`, post({ text }));
    cur.beginning_text = text; render();
  })));
  div.appendChild(ops);
  return div;
}

// 工具调用块（与思考块一样默认折叠）：参数尽量按 JSON 美化，调用结果拼在同一块里
function toolDetailsHTML(tc) {
  let args = tc.arguments || '';
  try { args = JSON.stringify(JSON.parse(args), null, 2); } catch (e) {}
  return `<details class="toolcall"><summary>工具调用：${esc(tc.name)}</summary>` +
    `<div class="tc-label">参数</div><div class="tc">${esc(args)}</div>` +
    `<div class="tc-label">结果</div><div class="tc">${esc(tc.result || '')}</div></details>`;
}

// 历史 AI 块的思考/工具调用部分:按回合内真实顺序交替(思考→工具→思考→…);
// 同一轮多个调用共享一段思考,只显示一次;占位/空思考不显示
function aiMiddleHTML(e) {
  const thinking = r => `<details class="thinking"><summary>思考</summary><div>${esc(r)}</div></details>`;
  let html = '', lastReasoning = null;
  for (const tc of e.tool_calls || []) {
    const r = (tc.reasoning || '').trim();
    if (r && r !== lastReasoning) { html += thinking(tc.reasoning); lastReasoning = r; }
    html += toolDetailsHTML(tc);
  }
  const r = (e.reasoning || '').trim();
  if (r && r !== lastReasoning) html += thinking(e.reasoning);
  return html;
}

function makeAIBlock(e, i) {
  const div = document.createElement('div');
  div.className = 'block ai';
  div.innerHTML = `<div class="tag">${e.error ? '出错' : 'AI'}</div>` +
    aiMiddleHTML(e) +
    (e.error ? `<div class="errnote">〔生成出错〕${esc(e.error)}</div>` : '') +
    `<div class="content markdown">${renderMarkdown(e.content)}</div>`;
  if (e.options && e.options.length) div.appendChild(optionsDiv(e.options));
  if (e.options_error) div.appendChild(optionsErrorDiv(e.options_error, e.options_raw));
  const ops = document.createElement('div');
  ops.className = 'ops';
  ops.appendChild(makeOpsBtn('修改', () => editBlock(div, e.content, async text => {
    await api(`/api/sessions/${enc()}/edit_ai`, post({ index: i, content: text, options: e.options || [] }));
    cur.history[i].content = text; render();
  })));
  // 只允许最后一个 AI 块重新输出
  if (i === cur.history.length - 1) {
    ops.appendChild(makeOpsBtn('重新输出', regenerate));
    // 开了选项开关时，最后一轮还能只重掷选项（正文不动）
    if (cur.options_enabled)
      ops.appendChild(makeOpsBtn('重新生成选项', regenerateOptions));
  }
  div.appendChild(ops);
  return div;
}

function makeUserBlock(e, i) {
  const div = document.createElement('div');
  div.className = 'block user';
  div.innerHTML = `<div class="tag">你</div><div class="content">${esc(e.content)}</div>`;
  const ops = document.createElement('div');
  ops.className = 'ops';
  ops.appendChild(makeOpsBtn('回滚', async () => {
    const r = await api(`/api/sessions/${enc()}/rollback`, post({ index: i }));
    $('input').value = r.input;
    autoGrow();
    cur = await api('/api/sessions/' + enc());
    render();
  }));
  // 分支：以该用户块为断点复制出一个新会话（原会话不动），并切换过去
  ops.appendChild(makeOpsBtn('分支', async () => {
    const s = await api(`/api/sessions/${enc()}/fork`, post({ index: i }));
    await selectSession(s.id);
  }));
  div.appendChild(ops);
  return div;
}

// 把块内容切换为编辑态
function editBlock(div, text, onSave) {
  const c = div.querySelector('.content');
  const old = c.innerHTML;
  c.innerHTML = '';
  const ta = document.createElement('textarea');
  ta.className = 'edittext'; ta.value = text;
  const row = document.createElement('div');
  row.style.cssText = 'margin-top:8px;display:flex;gap:8px;justify-content:flex-end';
  const save = makeOpsBtn('保存', async () => { await onSave(ta.value); });
  const cancel = makeOpsBtn('取消', () => { c.innerHTML = old; });
  row.append(save, cancel);
  c.append(ta, row);
}

// ---------- 流式对话 ----------
const enc = () => encodeURIComponent(cur.id);
const post = obj => ({ method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(obj) });

// 连续重连次数：接上（或正常收尾）后归零，用来在长时间断网时放弃等待
let reconnectTries = 0;

async function streamInto(url, opts, userText, reuseAI) {
  streaming = true; updateComposer();
  const chat = $('chat');
  // 用户输入块立即显示；断线重连会丢掉本次尝试画出的块重画，用户块由调用方每轮重新传入
  if (userText != null) {
    const u = document.createElement('div');
    u.className = 'block user live';
    u.innerHTML = `<div class="tag">你</div><div class="content">${esc(userText)}</div>`;
    chat.appendChild(u);
  }
  let div;
  if (reuseAI) {
    // 只重生成选项：正文已落盘，复用最后一个 AI 块（流里只有选项事件，正文保持不动）
    div = reuseAI;
    div.classList.add('live');
    div.querySelector('.tag').textContent = 'AI（生成选项中…）';
    div.querySelectorAll('button').forEach(b => { b.disabled = true; });
  } else {
    div = document.createElement('div');
    div.className = 'block ai live';
    div.innerHTML = `<div class="tag">AI（生成中…）</div>
      <div class="content"></div>`;
    chat.appendChild(div);
  }
  scrollBottom();
  const contentDiv = div.querySelector('.content');
  contentDiv.classList.add('markdown');
  // 当前思考块:工具调用会切分思考,下一段思考另起新块(思考→工具→思考→…→正文)
  let thinkDiv = null;
  let partialContent = '';
  let renderScheduled = false;
  function flushContent() {
    contentDiv.innerHTML = renderMarkdown(partialContent);
    renderScheduled = false;
    scrollBottom();
  }
  function appendContent(delta) {
    partialContent += delta;
    if (!renderScheduled) {
      renderScheduled = true;
      requestAnimationFrame(flushContent);
    }
  }
  try {
    const resp = await fetch(url, opts);
    activeReader = resp.body.getReader();
    const dec = new TextDecoder();
    let buf = '';
    for (;;) {
      const { done, value } = await activeReader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let cut;
      while ((cut = buf.indexOf('\n\n')) !== -1) {
        const raw = buf.slice(0, cut); buf = buf.slice(cut + 2);
        const line = raw.split('\n').find(l => l.startsWith('data:'));
        if (!line) continue;
        const ev = JSON.parse(line.slice(5));
        if (ev.type === 'reasoning') {
          if (!thinkDiv) {
            contentDiv.insertAdjacentHTML('beforebegin',
              '<details class="thinking"><summary>思考</summary><div></div></details>');
            thinkDiv = contentDiv.previousElementSibling.querySelector('div');
          }
          thinkDiv.textContent += ev.delta; scrollBottom();
        }
        else if (ev.type === 'content') { appendContent(ev.delta); }
        // 工具调用块随流逐个出现（事件在工具执行完后到达，参数与结果一起拼入）
        else if (ev.type === 'tool') {
          contentDiv.insertAdjacentHTML('beforebegin', toolDetailsHTML(ev));
          thinkDiv = null;
          scrollBottom();
        }
        // 正文之后的选项请求：先淡色占位，拿到后换成按钮；失败换成提示+重试
        else if (ev.type === 'options_start') {
          const p = document.createElement('div');
          p.className = 'options-pending';
          p.textContent = '生成选项中…';
          setOptionsArea(div, p);
          scrollBottom();
        }
        else if (ev.type === 'options') {
          setOptionsArea(div, optionsDiv(ev.options));
          scrollBottom();
        }
        else if (ev.type === 'options_error') {
          setOptionsArea(div, optionsErrorDiv(ev.message, ev.raw));
          scrollBottom();
        }
        else if (ev.type === 'error') {
          // 用户侧错误（如预设宏执行失败）弹窗提示；其余错误内联显示在 AI 块。
          // 半截输出已落盘时保留已流出的正文，错误说明另起一行（刷新后按 history 重渲染）
          if (ev.popup) alert(ev.message);
          // 只重掷选项时正文不动，错误只弹窗提示
          if (!reuseAI) {
            div.querySelector('.tag').textContent = '出错';
            if (ev.persisted && contentDiv.textContent)
              contentDiv.textContent += `\n\n〔生成出错〕${ev.message}`;
            else
              contentDiv.textContent = ev.message;
          }
        }
      }
    }
  } catch (err) {
    if (!streaming) { /* 用户打断，属于正常路径 */ }
    else {
      // 连接断了：生成是会话级后台任务，后端那一轮照跑，重连接上继续看
      streaming = false;
      await reconnectTurn(userText);
      return;
    }
  }
  activeReader = null;
  streaming = false;
  reconnectTries = 0;
  cur = await api('/api/sessions/' + enc());
  render();
}

// 断线后重连续看：后端还在生成就重放整轮接上，这一轮已结束就按 history 收尾
async function reconnectTurn(userText) {
  let s = null;
  try { s = await api('/api/sessions/' + enc()); } catch (e) {}
  if (s && !s.generating) { cur = s; reconnectTries = 0; render(); return; }
  if (++reconnectTries > 12) {
    // 网络长时间不通：把半截内容留在屏幕上，刷新或切回前台会重新接上
    const tag = $('chat').querySelector('.live.ai .tag');
    if (tag) tag.textContent = '连接中断（刷新页面可接上）';
    updateComposer();
    return;
  }
  await new Promise(r => setTimeout(r, Math.min(1000 * 2 ** reconnectTries, 5000)));
  // 只重掷选项的这一轮：正文已落盘，复用最后一个 AI 块（它带着 .live，先摘掉，
  // 免得被下面那句当成"这次尝试画出的块"删掉、让正文闪空一下）
  let reuseAI = null;
  if (s && s.generating && s.generating.mode === 'options') {
    const ai = $('chat').querySelectorAll('.block.ai');
    if (ai.length) { reuseAI = ai[ai.length - 1]; reuseAI.classList.remove('live'); }
  }
  // 丢掉这次尝试画出的块，从 /stream 重放整轮
  $('chat').querySelectorAll('.live').forEach(el => el.remove());
  await streamInto(`/api/sessions/${enc()}/stream`, {}, userText, reuseAI);
}

// 页面加载/回到前台时接上后端正在进行的这一轮（刷新、锁屏、掉线都能续看）
async function attachTurn() {
  const g = cur.generating;
  if (!g || streaming) return;
  // regenerate 期间磁盘上还是被替换掉的旧 AI 块，先按点「重新输出」时那样删掉它
  if (g.mode === 'regenerate') {
    const blocks = $('chat').querySelectorAll('.block.ai');
    if (blocks.length) blocks[blocks.length - 1].remove();
  }
  reconnectTries = 0;
  // options（只重掷选项）：正文已落盘、与输入无关，别删最后一个 AI 块，复用它接选项事件
  let reuseAI = null;
  if (g.mode === 'options') {
    const blocks = $('chat').querySelectorAll('.block.ai');
    if (blocks.length) reuseAI = blocks[blocks.length - 1];
  }
  await streamInto(`/api/sessions/${enc()}/stream`, {}, g.mode === 'chat' ? g.user_input : null, reuseAI);
}

async function interrupt() {
  // 先通知后端取消生成并落盘半截输出，再断开本地流
  try { await api(`/api/sessions/${enc()}/interrupt`, { method: 'POST' }); } catch (e) {}
  streaming = false;
  if (activeReader) { try { await activeReader.cancel(); } catch (e) {} }
}

function send() {
  const text = $('input').value.trim();
  if (!text || streaming || cur.generating) return;
  $('input').value = '';
  autoGrow();
  if (!cur.history.length) return; // 首轮用「开始」
  streamInto(`/api/sessions/${enc()}/chat`, post({ input: text }), text);
}

function regenerate() {
  if (streaming || cur.generating) return;
  // 立即移除旧的最后一个 AI 块，避免新旧两块同时显示
  const blocks = $('chat').querySelectorAll('.block.ai');
  if (blocks.length) blocks[blocks.length - 1].remove();
  streamInto(`/api/sessions/${enc()}/regenerate`, { method: 'POST' });
}

// 只重掷最后一轮的选项（正文不动，不新增块）：复用最后一个 AI 块接选项阶段的流
function regenerateOptions() {
  if (streaming || cur.generating) return;
  const blocks = $('chat').querySelectorAll('.block.ai');
  if (!blocks.length) return;
  streamInto(`/api/sessions/${enc()}/regenerate_options`, { method: 'POST' }, null, blocks[blocks.length - 1]);
}

$('send').onclick = () => {
  if (streaming || cur.generating) { interrupt(); return; }
  if (!cur.history.length)
    streamInto(`/api/sessions/${enc()}/start`, { method: 'POST' });
  else send();
};
$('input').addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.ctrlKey) { e.preventDefault(); $('send').click(); }
});
// 输入框随内容自动增高（68px ~ 320px）
function autoGrow() {
  const ta = $('input');
  ta.style.height = 'auto';
  ta.style.height = Math.min(ta.scrollHeight, 320) + 'px';
}
$('input').addEventListener('input', autoGrow);

$('previewBtn').onclick = () => {
  sessionStorage.setItem('preview_draft', $('input').value);
  window.open('/preview.html?session=' + enc(), '_blank');
};
$('presetSelect').onchange = async e => {
  await api(`/api/sessions/${enc()}/preset`, post({ preset: e.target.value }));
  cur.preset = e.target.value;
};
$('effortSelect').onchange = async e => {
  await api(`/api/sessions/${enc()}/reasoning_effort`, post({ effort: e.target.value }));
  cur.reasoning_effort = e.target.value;
};
// 选项开关：关掉后正文照常生成、不再发选项请求；不影响进行中的流
$('optionsToggle').onchange = async e => {
  const s = await api(`/api/sessions/${enc()}/options`, post({ enabled: e.target.checked }));
  cur.options_enabled = s.options_enabled;
};
$('endpointSelect').onchange = async e => {
  await api(`/api/sessions/${enc()}/endpoint`, post({ index: +e.target.value }));
  cur.endpoint = +e.target.value;
};
// 温度/上限：失焦或回车提交；清空则回退全局默认
async function pushParams() {
  const body = {
    temperature: $('tempInput').value === '' ? null : +$('tempInput').value,
    max_tokens: $('maxTokensInput').value === '' ? null : Math.round(+$('maxTokensInput').value),
  };
  const s = await api(`/api/sessions/${enc()}/params`, post(body));
  cur.temperature = s.temperature;
  cur.max_tokens = s.max_tokens;
}
$('tempInput').onchange = pushParams;
$('maxTokensInput').onchange = pushParams;

// ---------- 新建会话 ----------
$('newSessionBtn').onclick = async () => {
  const [presets, cards] = await Promise.all([api('/api/presets'), api('/api/cards')]);
  $('mPreset').innerHTML = presets.map(p => `<option value="${esc(p.id)}">${esc(p.name)}</option>`).join('');
  $('mCard').innerHTML = cards.map(c => `<option value="${esc(c.id)}">${esc(c.name)}</option>`).join('');
  const fillBeginnings = () => {
    const c = cards.find(x => x.id === $('mCard').value);
    $('mBeginning').innerHTML = `<option value="">（空开局）</option>` +
      c.beginnings.map((b, i) => `<option value="${i}">开局 ${i + 1}：${esc(b)}…</option>`).join('');
    // 默认选中第一个开局，没有开局才是空开局
    if (c.beginnings.length) $('mBeginning').selectedIndex = 1;
  };
  $('mCard').onchange = fillBeginnings;
  fillBeginnings();
  $('modalMask').style.display = 'flex';
};
$('mCancel').onclick = () => $('modalMask').style.display = 'none';
$('mCreate').onclick = async () => {
  const body = {
    name: $('mName').value.trim(),
    preset: $('mPreset').value,
    card: $('mCard').value,
    beginning_index: $('mBeginning').value === '' ? null : +$('mBeginning').value,
  };
  try {
    const s = await api('/api/sessions', post(body));
    $('modalMask').style.display = 'none';
    await selectSession(s.id);
  } catch (e) { alert(e.message); }
};

// 手机上锁屏/切走再回来：这一轮可能还在跑，没接上就重新接（长断网放弃后也靠它恢复）
document.addEventListener('visibilitychange', async () => {
  if (document.visibilityState !== 'visible' || streaming || !cur) return;
  try {
    const s = await api('/api/sessions/' + enc());
    if (s.generating) { cur = s; render(); attachTurn(); }
    else if (cur.generating) { cur = s; render(); }
  } catch (e) {}
});

// 启动：加载会话列表，并把上次选中的会话恢复回来（已删除则清除记录，退回主界面）
(async () => {
  const list = await loadSessions();
  const last = localStorage.getItem(LAST_SESSION_KEY);
  if (!last) return;
  if (!list.some(s => s.id === last)) { rememberSession(null); return; }
  try {
    await selectSession(last);
  } catch (e) {
    rememberSession(null);
  }
})();
</script>
</body>
