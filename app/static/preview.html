<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>上下文预览</title>
<style>
  body { font-family: "Microsoft YaHei", system-ui, sans-serif; background: #1a1b1e; color: #ddd; padding: 20px; }
  h1 { font-size: 18px; margin-bottom: 14px; }
  details.msg { max-width: 900px; margin: 0 auto 10px; background: #24262b; border: 1px solid #35383e; border-radius: 8px; padding: 8px 14px; }
  details.msg summary { cursor: pointer; font-size: 13px; color: #999; }
  details.msg summary .role { font-weight: bold; margin-right: 8px; }
  .role.system { color: #7ab; } .role.user { color: #ba7; } .role.assistant { color: #7ba; } .role.tool { color: #c8c; }
  .body { white-space: pre-wrap; line-height: 1.6; font-size: 13px; word-break: break-word; margin-top: 8px; }
  .toolcall { background: #1f2620; border-radius: 6px; padding: 6px 10px; margin-top: 6px; font-size: 13px; white-space: pre-wrap; }
  @media (max-width: 640px) {
    body { padding: 12px 0; }
    h1 { font-size: 20px; padding: 0 14px; }
    details.msg { max-width: none; margin: 0 0 10px; padding: 12px 14px; }
    details.msg summary, .body, .toolcall { font-size: 15px; }
  }
</style>
</head>
<body>
<h1>上下文预览 — 将发送给 AI 的完整提示词</h1>
<div id="list">加载中…</div>
<script>
function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
function fmtArgs(args) {
  try { return JSON.stringify(JSON.parse(args), null, 2); } catch (e) { return args; }
}
(async () => {
  const session = new URLSearchParams(location.search).get('session');
  const input = sessionStorage.getItem('preview_draft') || '';
  const r = await fetch('/api/preview', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ session, input }),
  });
  const data = await r.json();
  if (!r.ok) { document.getElementById('list').textContent = data.detail || '加载失败'; return; }
  let html = `<details class="msg"><summary><span class="role">tools</span>工具定义</summary><div class="body">${esc(JSON.stringify(data.tools, null, 2))}</div></details>`;
  const items = data.messages || data.input || [];
  for (const m of items) {
    let role = m.type || m.role, inner = '', head = '';
    if (m.type === 'message') {
      role = m.role;
      const text = (m.content || []).map(p => p.text || '').join('');
      inner = `<div class="body">${esc(text)}</div>`;
      head = text;
    } else if (m.type === 'function_call') {
      role = 'assistant';
      inner = `<div class="toolcall">工具调用 ${esc(m.name)}：\n${esc(fmtArgs(m.arguments))}</div>`;
      head = `[工具调用 ${m.name}]`;
    } else if (m.type === 'function_call_output') {
      role = 'tool';
      inner = `<div class="body">${esc(m.output || '')}</div>`;
      head = m.output || '';
    } else if (m.type === 'reasoning') {
      const text = (m.content || []).map(p => p.text || '').join('');
      inner = `<div class="body">${esc(text)}</div>`;
      head = '[思考] ' + text;
    } else if (data.messages) {
      // Chat Completions 标准 message 格式
      role = m.role;
      if (m.reasoning_content) {
        inner += `<div class="body" style="color:#aaa;">[思考]\n${esc(m.reasoning_content)}</div>`;
        head = '[思考] ' + m.reasoning_content;
      }
      if (m.content) {
        inner += `<div class="body">${esc(typeof m.content === 'string' ? m.content : JSON.stringify(m.content))}</div>`;
        head = (head || m.content);
      }
      if (m.tool_calls) {
        for (const tc of m.tool_calls) {
          const fn = tc.function || {};
          inner += `<div class="toolcall">工具调用 ${esc(fn.name || '')}（id=${esc(tc.id || '')}）：\n${esc(fmtArgs(fn.arguments || ''))}</div>`;
          head = head || `[工具调用 ${fn.name}]`;
        }
      }
      if (m.tool_call_id) {
        inner = `<div class="body">${esc(m.content || '')}</div>`;
        head = m.content || '';
      }
      if (!inner) {
        inner = `<div class="body">${esc(JSON.stringify(m, null, 2))}</div>`;
      }
    } else {
      inner = `<div class="body">${esc(JSON.stringify(m, null, 2))}</div>`;
    }
    head = (head || '').toString().replace(/\s+/g, ' ').slice(0, 60);
    html += `<details class="msg"><summary><span class="role ${role}">${role}</span>${esc(head)}…</summary>${inner}</details>`;
  }
  document.getElementById('list').innerHTML = html;
})();
</script>
</body>
</html>
