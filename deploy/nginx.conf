# nginx 片段：https://rchat.example.com -> 本机 25530
#
# 三个关键点，少一个正文就会"卡住不动"或断流：
#   1. proxy_buffering off     —— 否则 nginx 会把流攒进缓冲再一次性吐给浏览器
#   2. proxy_read_timeout 1h   —— 长思考/慢接口期间别掐连接（后端每 15s 发一次心跳）
#   3. proxy_http_version 1.1 + Connection "" —— 默认 1.0 不支持分块流式
#
# TLS 终止在这里，所以 config.yaml 里 auth.cookie_secure 要置 true。

server {
	listen 443 ssl;
	server_name rchat.example.com;

	# ssl_certificate     /etc/letsencrypt/live/rchat.example.com/fullchain.pem;
	# ssl_certificate_key /etc/letsencrypt/live/rchat.example.com/privkey.pem;

	location / {
		proxy_pass http://127.0.0.1:25530;
		proxy_http_version 1.1;
		proxy_set_header Connection "";
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;

		proxy_buffering off;
		proxy_cache off;
		proxy_read_timeout 1h;
		proxy_send_timeout 1h;
		chunked_transfer_encoding on;
	}
}
