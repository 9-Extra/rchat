# /etc/nginx/sites-available/rchat —— 反代到本机 25530（自签 TLS 版）
#
# 适用场景：服务器 80/443 被同一公网 IP 上的别的服务占着（NAT 机型常见），
# 或者域名不归你、申请不到 Let's Encrypt。这时把 TLS 挂在一个高位端口上，
# 用自签证书：浏览器会提示不受信任，接受之后流量是加密的。
#
# 用法：
#   sudo install -m 644 deploy/nginx-rchat-tls.conf /etc/nginx/sites-available/rchat
#   sudo ln -sf /etc/nginx/sites-available/rchat /etc/nginx/sites-enabled/rchat
#   sudo rm -f /etc/nginx/sites-enabled/default     # 避免默默占用 80
#   bash deploy/gen-selfsigned.sh ab.example.com    # 生成自签证书
#   sudo nginx -t && sudo systemctl reload nginx
#
# 然后在面板把「公网端口 -> 本机 8081」映射出去，用 https://<域名或IP>:<公网端口> 访问。
# 换成真证书（有自己的域名 + 能映射 80/443 或能做 DNS-01）时，把 ssl_certificate
# 两行换成真证书、listen 改回 443 即可，其余不用动。

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8081 ssl;
    server_name ab.rainplay.cn;      # 换成你的域名/IP

    ssl_certificate     /etc/ssl/certs/rchat.crt;
    ssl_certificate_key /etc/ssl/private/rchat.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:25530;
        proxy_http_version 1.1;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 流式对话必须：不缓冲、不缓存、读超时放宽（后端每 15s 一次心跳）。
        # 少任何一条，正文就会「卡住不动」或中途断流。
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        chunked_transfer_encoding on;
    }
}
