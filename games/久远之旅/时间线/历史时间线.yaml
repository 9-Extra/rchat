name: 历史时间线
type: 时间线

eras:
  - name: 超古代时代（Terran文明）
    time: 150万年前至数万年前
    description: Terran人建立的高度发达文明，创造了索拉利安世界和遍布各地的遗迹
    events:
      - time: 150万+年前
        event: Terran文明鼎盛时期
        detail: 消灭了犯罪、冲突和战争，社会高度发达，创造超级科技
      - time: 约100万年前
        event: Terran分为两派
        detail: |
          创世派（索拉利安）与家园派（T连续体）分裂。
          签署远古协约：互不干涉，允许互相观察计划进展。
          索拉利安利用星龙域作为深空监视阵列；T连续体向索拉利安派出观察小组。
      - time: 约100万年前
        event: 建造索拉利安（戴森球）
        detail: |
          超古代人建造星体世界索拉利安，表里双层结构。
          表世界太阳和月亮是从数十亿年前时间轴分离的"时空异位体"。
          里世界被作为"预留地"保留。
      - time: 超古代时期
        event: 建造泰拉普世城
        detail: 超古代终极城市，六大大层+上百小层，内部包含独立生态和战场遗迹
      - time: 超古代时期
        event: 建造尤克特拉希尔
        detail: 容纳人口上亿的超巨型都市，有庞大地下结构
      - time: 超古代时期
        event: 建造星龙域（Star-Base）
        detail: 作为深空监视阵列，天界六棱柱都市，地界为各族群共存社会
      - time: 超古代内战
        event: 制造者内战
        detail: |
          超古代人开发兵器（计算机生命体）用于战争。
          阿非利加和欧罗巴两层被刻意还原为战场纪念。
      - time: 超古代末期
        event: 文明衰退与遗弃
        detail: |
          Terran人口下降到极限，祖先沉溺于虚拟世界。
          实体人口不到一亿，尤克特拉希尔被遗弃。
          人口移居12座卫星城，最终仅剩阿塔米德有10名活人。

  - name: 上古时代
    time: 数万年前至数千年前
    description: 早期类人生命在各地定居，形成原始文明
    events:
      - time: 数万年前
        event: 牛种灭绝
        detail: 克洛诺斯人的祖先（牛种）灭绝于超级瘟疫，仅存在于考古资料中
      - time: 数万年前
        event: 伏尔坎人迁徙
        detail: 伏尔坎人是最早向大陆之外派出探索团队的文明，穿越传送门建立各地文明
      - time: 数千年前
        event: 罗慕伦和瑞曼祖先到来
        detail: 通过艾康尼亚传送站来到双子大陆，建立罗慕伦帝国和瑞曼联邦
      - time: 五千年前
        event: 海瓦萨王国建国
        detail: 契卡征服周边城邦，建立海瓦萨王国，围绕艾丽薇之塔建都
      - time: 数千年前
        event: 阿尔比恩统一战争
        detail: 阿尔比恩统一浮空群岛，建立"圆桌机关"，后演变为直属骑士团
      - time: 千年前
        event: 阿尔比恩建立殖民帝国
        detail: 阿尔比恩凭借浮空岛优势征服大陆半数以上区域，建立日不落帝国

  - name: 近世（冲突与衰落）
    time: 数百年前至十数年前
    description: |
      大陆格局形成，各国冲突不断，阿尔比恩衰落。
      阿尔比恩因内忧外患而衰弱，被罗慕伦和瑞曼联手击败，签订《契卡和约》。
      海瓦萨政变、王室覆灭、王城毁灭；艾丽薇之塔封锁；八年前白离开威吉鲁。
      详见关键历史事件条目。

  - name: 现代（伊迪亚的旅行时期）
    time: 现在（伊迪亚15岁）
    description: 故事主线展开，各地动荡加剧
    note: |
      如果玩家扮演伊迪亚，主线仅供参考，以玩家选择为准。

atmosphere: |
  从超古代Terran文明的辉煌到现代各国纷争，
  传送站连接着被时间割裂的各个纪元。
  百万年前的协约、千年前的帝国、八年前的政变、现在的旅行——历史在脚下层层展开。
