name: 未来剧情参考
type: 事件

warning: |
  【AI须知：以下事件是原作中发生在伊迪亚旅行期间的剧情，属于“未来”或“可能发生”的事件。
  AI不应主动推动这些剧情，仅以背景信息参考。
  玩家自由行动，根据玩家选择自然展开，无需遵循顺序。
  这些事件的发生条件和细节仅限在玩家到达相应地点、触发相应条件时，通过世界书条目逐步呈现。】

events:
  - name: 阿尔比恩政变（梅林事件）
    location: 阿尔比恩王国·伦底纽姆
    trigger: 玩家随剧情到达阿尔比恩，或卷入宫廷相关事件
    description: |
      前圆桌骑士团长老梅林策划一系列袭击：浓雾袭击王宫、天空要塞德文波特。
      利用克洛诺斯医疗术式+魔导蒸汽机冷却剂技术制造"浓雾"，使接触者患癌。
      目的是引发阿尔比恩与罗慕伦战争，破坏历史进程。
    result: |
      女王被卷入事件，一度被怀疑为幕后黑手。
      伊迪亚等人调查真相，在伦底纽姆要塞与梅林对峙。
      凯（直属骑士）拖住梅林，伊迪亚阻止了"断钢剑"发射。
      梅林利用高等空间魔法逃离，下落不明。
      最终签订新协约，战争终止，国际关系恢复。
      女王接受两个月治疗后根除毒瘾，恢复清醒。
    characters: [梅林, 女王, 查伯伦爵士, 凯, 娜可, 高文]

  - name: 伏尔坎联合占卜
    location: 伏尔坎大陆
    trigger: 玩家到达伏尔坎，或被罗慕伦/伏尔坎方面邀请
    description: |
      罗慕伦皇帝（无面之王）在伏尔坎发起"竞赛"：
      三支队伍从沙卡尔出发，穿越超级风暴区，登顶奥林匹斯山。
      实质是伏尔坎独有的暗魔法战略级占卜术式"惠更斯"，
      以参与者为媒介探知未来，预测双子大陆动荡。
    result: |
      伊迪亚、娜可、露娜等代表阿尔比恩/海瓦萨/艾康尼亚一方参赛。
      穿越风暴、登顶奥林匹斯山，罗慕伦皇帝揭示占卜结果。
    characters: [罗慕伦皇帝, 江风, 滩风]

  - name: 泰拉能源危机
    location: 泰拉大陆
    trigger: 玩家到达泰拉，或与米涅奥拉/席特拉斯相遇
    description: |
      泰拉大陆能源网络发生严重故障，复制机和超古代设施大规模停摆。
      米涅奥拉和席特拉斯（泰拉考古学家）寻求解决方案，请求伊迪亚等人协助。
      伊迪亚深入泰拉下层，发现月神（LUNA）真相和计算机生命体。
    result: |
      发现泰拉普世城"地基"是月神所在，超古代人的控制中枢。
      泰拉社会面临崩溃，伊迪亚卷入能源危机的核心。
    characters: [米涅奥拉, 席特拉斯, 月神, 计算机生命体]
