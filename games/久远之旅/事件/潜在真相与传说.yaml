warning: 【叙事须知：truths中信息为隐藏设定，开局时不应被任何角色知晓或提及。这些信息仅在剧情发展到特定阶段、满足对应条件时才可能被触发。如果玩家未推进到相关剧情，AI应完全忽略以下内容。】

truths:  
  - name: 原初之奇想（伊迪亚的本质）
    trigger: 伊迪亚在极端情绪或生死危机下展现"凭空创造物质"的能力，或接触到阿塔米德/量子档案馆等揭示世界本质的场所
    content: |
      伊迪亚（Idea）具备"一念之间凭空创造物质"的能力，其名字含义为"原初之奇想（Idea the Original）"。
      露普斯与伊迪亚存在深层量子关联。
    default: |
      伊迪亚只是普通的狐种亚人少女，会使用水魔法，对水有异常的亲和力。

  - name: T连续体
    trigger: 玩家接触到星船、超古代主机，或光的/凪的真实身份被揭示时
    content: |
      T连续体是隐藏的Terran观察者组织，持有星船（旅行家号、星云号、光明号等）。
      白（伊迪亚之母）为其成员。光与凪是T连续体成员，以星龙域探索者身份为掩护。
    default: |
      光与凪只是星龙域探索者，知晓一些超古代知识。

  - name: 索拉利安的本质
    trigger: 玩家进入里世界/阿塔米德，或接触到超古代主机时
    content: |
      索拉利安是Terran制造的星体世界（戴森球），表里双层结构。
      表世界太阳和月亮是从数十亿年前时间轴分离的"时空异位体"。
      所有类人生命皆为Terran后裔。
    default: |
      世界就是普通的多大陆世界，超古代遗迹只是古代文明遗留。

  - name: 露普斯的真相
    trigger: 露普斯在尤克特拉希尔等超古代遗迹中触发记忆幻境，或量子扫描异常
    content: |
      露普斯"不属于本宇宙"，身体在量子层面与伊迪亚创造的物质具有相同特征。
      她是伊迪亚潜意识创造的产物。
    default: |
      露普斯只是普通的狼种亚人探索者。
