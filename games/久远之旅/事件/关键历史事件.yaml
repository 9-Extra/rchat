name: 关键历史事件
type: 事件

warning: |
  【AI须知：以下事件均为现代世界中已经发生的过去事件，直接影响角色命运和当前政治格局。
  部分事件（如白离开）属于隐藏信息，开局时不应被普通角色知晓，
  仅在与相关角色深入交流时逐步揭示。】

events:
  - name: 阿尔比恩-双子大陆战争
    year: 数百年前
    location: 双子大陆
    description: |
      阿尔比恩因内忧外患（贵族与商业集团矛盾、殖民势力衰退）极度衰弱。
      罗慕伦和瑞曼联手发动战争，将阿尔比恩赶回本土。
    result: |
      关键战役：白崖空战，直属骑士用阿克夏之枪摧毁三分之一罗慕伦飞空艇舰队。
      最终签订《契卡和约》，维持和平至今。
      阿尔比恩王室与商业集团妥协，伦底纽姆要塞化，社会转型。
    characters: [阿尔比恩王室, 罗慕伦, 瑞曼]

  - name: 海瓦萨政变
    year: 八年前
    location: 海瓦萨王国首都契卡
    description: |
      前王室在周边国家冲突中暗中偏向一方，打破海瓦萨中立原则。
      事情败露后遭另一方围攻，本应出兵相助的一方也倒打一耙。
      愤怒的人民涌向王宫，王族在内忧外患下倒台。
      前陆军将领皮埃尔·贝当率部推翻王室，建立新政府。
    result: |
      新海瓦萨被夺去大半领土和武装力量，国土压缩为失去战略纵深的狭长带状国家。
      实际沦为洛泰尔共和国（瑞曼联邦傀儡）的附庸。
      前王族嫡系几乎全灭，仅露娜（前王女）幸存，被半软禁在契卡大宅。
      前王室直属商团重组，部分资料遗失或被销毁。
    characters: [贝当, 露娜, 莫里斯先王]
    note: 伊迪亚寻找母亲的线索与此事件有关，八年前承运威吉鲁航线的船队记录恰好在政变中遗失

  - name: 艾丽薇之塔封锁
    year: 五年前
    location: 契卡·艾丽薇之塔
    description: |
      先王莫里斯深知以当时的技术无法安全运用艾丽薇之塔的能量，
      决定将其彻底封锁，连带失落的知识一起封存。
      封锁决定由贝当（当时为陆军将领）向先王请示，但贝当自己偷偷违反禁令研究。
    result: |
      艾丽薇之塔禁止进入，探索危险频发。
      先王将守护者一族的识别资料封存，贝当暗中继续研究。
      五年后（现在）贝当试图启动塔，引发危机。
    characters: [莫里斯先王, 贝当]
    note: 露娜的守护者身份是开启塔的关键条件，伊迪亚在事件中阻止了贝当的计划

  - name: 海瓦萨王城毁灭
    year: 五年前（政变后不久）
    location: 契卡·前王城
    description: |
      先王莫里斯将王宫（数座高达数公里的白色石碑状垂直城市）炸毁，
      与绝大多数忠于王室但无路可退的大臣和贵族一同殒命。
    result: |
      王城化为焦黑废墟，仅剩残垣断壁。
      艾丽薇之塔第一主控室（位于塔身下方）在王宫自爆中被毁。
      第二主控室成为唯一可用的控制中枢。
    characters: [莫里斯先王]

  - name: 白离开威吉鲁
    year: 八年前
    location: 威吉鲁岛
    description: |
      T连续体第十代观察员白（伊迪亚的母亲）离开威吉鲁岛，开始旅行。
      将年仅7岁的伊迪亚托付给怀特霍斯家（当时年仅8岁的高文）。
      通过王室直属商团-威吉鲁岛航线船队离开，前往大陆。
    result: |
      伊迪亚在威吉鲁岛独居，由灵兽库洛伊和希米陪伴。
      八年后（现在）伊迪亚15岁生日，收到母亲寄来信件和路线图，踏上寻母之旅。
    characters: [白（伊迪亚母亲）, 高文]
    note: 属于隐藏信息，普通角色不知白的真实身份和去向
