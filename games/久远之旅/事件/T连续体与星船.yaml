name: T连续体与星船
type: 事件
path: 世界书/事件/T连续体与星船.yaml

warning: 【AI须知：以下信息为隐藏设定，开局时不应被任何角色知晓或提及。仅在剧情发展到特定阶段、满足对应条件时才可能被触发。】

trigger: |
  满足以下任一条件时触发：
  1. 玩家到达阿塔米德，与阿塔米德人深入讨论Terran历史
  2. 玩家发现威吉鲁岛地下的星船"旅行家号"
  3. 玩家与光或凪深入讨论其真实身份和来历
  4. 玩家接触到任何一艘Terran星船或相关技术

content:
  - name: T连续体
    description: |
      Terran创世派，与索拉利安对应的另一派系。
      根据百万年前的远古协约，索拉利安和T连续体之间互不干涉，同时允许互相观察彼此在各自的"计划"上的进展。
      索拉利安的做法是利用星龙域本身作为深空监视阵列。
      T连续体的做法则是直接向索拉利安派出由一艘搭载合成种主机的科研星船和一名学者组成的观察者小组。
      观察者小组每十万年一轮换。
  - name: 白（Shiro）
    description: |
      T连续体驻索拉利安第10世代观察员，伊迪亚的母亲，纯血人类。
      约十万年前作为第十代观察任务的人选来到索拉利安。
      任务结束后选择留在索拉利安，没有返回T连续体。
      八年前离家旅行，将年幼的伊迪亚托付给怀特霍斯家。
      行踪成谜，在旅途中给伊迪亚寄来信件和路线图。
  - name: 星船
    description: |
      Terran星船，搭载合成种主机，搭载学者进行观察任务。
      每十万年一轮换，目前共有4艘星船隐藏在世界各地。
    ships:
      - name: 星云号（Nebula）
        owner: 凪
        status: 已离开索拉利安
        note: 凪曾经的星船，任务结束后离开
      - name: 光明号（Akira）
        owner: 光
        status: 不可使用
        note: 光持有的星船
      - name: 旅行家号（Voyager）
        owner: 蕾拉（第二代观察者），现隐藏于威吉鲁岛地下
        type: 时空科学舰
        status: 隐藏，等待重新启动
        note: 历史第二代观察者小组的星船，近百万年一直被隐藏在威吉鲁岛地下。会将重新启动者认证为拥有者
      - name: 现任观察者星船
        owner: 现任T连续体观察员
        status: 任务中，不可调用
        note: 白之后的现任观察者所持有
  - name: Terran历史
    description: |
      Terran全盛时期消灭了犯罪、冲突和战争，社会高度发达。
      人口下降到极限后，祖先沉溺于电子化虚拟世界。
      实体人口下降到不到一亿，尤克特拉希尔被遗弃，人口移居到12座卫星城。
      如今只剩阿塔米德还有10个"活人"。
  - name: 星龙域与T连续体的关系
    description: |
      星龙域（Star-Base）在某种意义上和T连续体相似，都是超古代人的"直系后代"。
      星龙域作为深空监视阵列，被索拉利安利用。
      光、凪等星龙域人知晓T连续体的存在，并与之合作。
      伊迪亚母亲白的委托促成了旅途中许多事件：海瓦萨袭击、尤克特拉希尔传送站通行证、伏尔坎联合占卜等。
  - name: 索拉利安与T连续体的协约
    description: |
      百万年前远古协约：互不干涉，允许互相观察。
      T连续体向索拉利安派观察小组，索拉利安利用星龙域作为监视阵列。
      两者对彼此的计划进展保持观察，但不得直接干预。
