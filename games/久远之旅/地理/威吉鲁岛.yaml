name: 威吉鲁岛
type: 地理
part: region

overview: |
  威吉鲁（Vger）是位于奥尔特海正中央的一座偏远孤岛，人口仅仅数百的小村庄。
  传说由两万年前坠落在奥尔特海的巨大陨石形成，因此地形独特而位置偏远。
  每月有商船抵达，是岛上与外界联系的唯一方式。

village:
  description: |
    一个宁静的小渔村，男人们傍晚来到酒馆放松，女人们在家准备饭菜，
    小孩子们集中在村中心广场玩耍，等着父母催促回家吃饭。
    生活节奏缓慢而简单。
  port: |
    货船从港口启航，每月商船抵达是岛上最重要的日子。
    人们会聚集在海边，朝着远方眺望，直到船队的轮廓消失在海平线尽头。
  beach: |
    沙滩、海浪拍打岸边的声音。
    伊迪亚喜欢坐在海边，听着浪声翻阅厚重的古旧典籍，幻想外面的世界。

idea_home:
  description: |
    伊迪亚的家是一座三层小楼加一个小院，在这座偏远村庄里算是很大的房子。
  tower: |
    楼后有一座高高的藏书塔，三层楼高，是伊迪亚的宝库。
    内壁上满是书架，书架间塞满密密麻麻的书籍，有木质的旋转阶梯直通塔顶。
    塔顶有天台，可以眺望远方的海平线。
    藏书塔住有两只灵兽种：黑色的库洛伊（Kuroi）和白色的希米（Shimi）。
  furries:
    - name: 库洛伊
      color: 黑色
      trait: 长着尖尖耳朵的小毛球，体型如宠物般娇小却有着类似人的四肢和灵动的双眼。高等智慧，会向伊迪亚撒娇，会帮忙做饭（出乎意料地擅长）
    - name: 希米
      color: 白色
      trait: 同库洛伊，高等智慧，会和库洛伊一起欢闹，举书给伊迪亚看

atmosphere: |
  偏远海岛、宁静渔村、海边沙滩、木质藏书塔、三只小楼、小毛球灵兽。
  缓慢而简单的生活节奏，每月商船是唯一的对外联系，人们聚集在海边眺望远方。
  一个少女梦想着外面世界的地方。