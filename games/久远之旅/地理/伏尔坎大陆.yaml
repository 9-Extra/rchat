name: 伏尔坎大陆
type: 地理
part: region

overview: |
  伏尔坎（Vulcan）位于双子大陆南方远海的大洋正中，纬度临近赤道，总面积远比双子大陆小得多。
  地表土壤因含有大量铁氧化物而呈现出锈红色，本土植被和水资源稀缺，气候异常炎热干燥。
  地势东高西低：西部为相对平缓的红色大平原、沙漠和裂谷带；东岸则是突兀拔地而起的巨大山脉。
  每年数次超级风暴由东向西席卷全境，制造出大量的风蚀地貌和极端不宜居的环境。
  超古代遗迹在全境范围内均匀分布。
  伏尔坎人是已知世界最古老的文明之一，也是其他大陆许多现代族群的祖先。
  以爱好探索闻名，是除星龙域外已知最早向大陆之外派出探索团队的文明。

capital:
  name: 沙卡尔（ShiKahr）
  location: 大陆北岸沿海
  description: |
    伏尔坎大陆首府，与阿尔比恩近似的魔法与科学混合文明，但建筑看不出太多技术特点。
    没有艾康尼亚那样高楼大厦林立，也没有伦底纽姆那样庞然巨物般的多层复合体建筑。
  architecture:
    - 楼宇高低错落有致，低调内敛却也不乏气质
    - 风格杂糅，类似契卡，但说不出谁先谁后
    - 两大鲜明特色：遍布大街小巷的"樱"树、楼宇顶端衍架上的风车
  cherry_trees:
    description: 结满粉红色花朵的树木，伏尔坎人基因技术产物
    trait: 只靠少量水便能生存于铁氧化物含量极高的土壤，大量栽种可防治风沙和水土流失
    effect: 吸收铁氧化物后结出红色花朵，花瓣随风飘落
  windmills:
    description: 楼宇顶端衍架上的风车
    trait: 并非机械结构，风车叶完全靠魔法凝结，半透明的巨大雪花般奇特
    function: 风力资源开采，伏尔坎以此闻名
  atmosphere: |
    粉红色花瓣随风飘落、远处海岸边红色大地、半透明魔法风车、轻风拂面
    恬静、优美、奇异而安详的氛围
  society:
    - 治安良好，夜间外出无需担忧
    - 博物馆（可能因建筑老化紧急整修而关闭）
    - 有私人餐馆，可举办宴请

government:
  name: 伏尔坎最高指挥部（The Vulcan High Command）
  type: 集权军政府
  reason: 全年几乎每时每刻都有地区受极端天气袭扰，常规松散联盟或帝国体制无法有效统治
  atmosphere: 看似极权，整体气氛却十分开明
  policy: 不介入外界，从旁观察和记录；将外界国家视为"儿女"，乐于见其开花结果，从不干涉
  foreign_relations: 与绝大部分国家维持良好关系，能在冲突中出面调解
  technology: 魔法技术繁盛，自然科学也非常发达
  unique_tech: 暗魔法战略级占卜术式——融合星象、地脉和元素之灵的"未来探知"

geography:
  - name: 西部
    terrain: 相对平缓的红色大平原、沙漠和裂谷带
    features: 铁氧化物土壤、风蚀地貌、植被稀缺
  - name: 东部
    terrain: 巨大山脉突兀拔地而起
    peak: 奥林匹斯山（Olympus Mons）
    peak_height: 海拔21171米，已知世界范围内第一高峰
    peak_difficulty: 正常人无法攀登，必须使用特殊代步工具
  - name: 超级风暴
    description: 每年数次由东向西席卷全境，穿越风暴区是极大挑战
    restriction: 竞赛规则限制不能超过海拔一万米的风暴区最高高度
  - name: 风蚀地貌
    description: 超级风暴制造出大量风蚀地貌，极端不宜居
  - name: 超古代遗迹
    distribution: 全境范围内均匀分布
  - name: 天然火系星核
    description: 伏尔坎以盛产天然火系星核闻名于世，娜可的法杖即在此拜托著名匠人打造

resources:
  - 风力资源：开采产业兴盛，魔法风车遍布
  - 天然火系星核：盛产，闻名于世
  - 铁氧化物土壤：呈现锈红色，极适合"樱"树生长

culture:
  - 生存智慧：在极端环境中领悟到最适合自身的制度
  - 探索精神：已知最早派出远洋船队和穿越传送门的先驱者
  - 祖先意识：将外界国家视为"儿女"，不干涉但观察记录
  - 占卜传统：暗魔法战略级占卜术式，用于预测社会演化规律

atmosphere: |
  锈红色的广袤大地、铁氧化物土壤、粉红色樱树花瓣、半透明魔法雪花风车、
  超级风暴由东向西席卷、东岸奥林匹斯山巍峨耸立、风蚀地貌苍凉而壮美。
  一座在极端环境中绽放出古老文明光芒的国度。
