name: 泰拉普世城
type: 地理
part: region

overview: |
  泰拉（Terra）大陆并非自然形成，而是超古代文明留下的规模最为庞大的遗迹——一座普世城（Ecumenopolis）的遗骸。
  其总占地面积比双子大陆稍大，但超过70%沉在海底，露出海面的部分只是冰山一角。
  整个大陆即一座城市，不存在郊区、乡村或荒野缓冲带，所见之处全部是城市设施。
  牢不可破的超结构合金作为主体材料，使其百万年保持完整。
  目前被类人生命开发过的仅有表层和向下的三层，四层往下为探索中的未知区域。
  泰拉由无数层（Deck）组成，大层高度超过10km，总面积用无穷无尽形容，每一层都是一个独立的生态空间，有自己的大陆级地形和文明。

structure:
  description: |
    已知大层共六个，小层上百。大层是主要居住空间，层高超过10km；小层不超过1km，容纳辅助设施或军事设施。
    各层之间由涡轮电梯（Turbolift）贯穿——高速运输管道，运用未知反重力技术，运载平台可穿越无管道空间。
  layers:
    - name: 表层
      description: |
        露出海平面的部分，是泰拉人主要活动区域。
        从海上看，表面散发着异样的银黑光泽，接近完整的圆形。
        面积比双子大陆所有陆地加起来还大，是一片完整的大陆级城市空间。
        建筑是大陆级规模的城市设施，一栋复合建筑可容纳数十万人，而这样的建筑在大陆上成千上万。
      style:
        - 建筑：复合结构摩天楼，圆台体，底层直径数公里，通天塔高度
        - 外观：外墙布满不规则扩建、悬空危桥般的通道、散发着诡异绿光的粗大管线、巨大的排风扇、霓虹灯广告牌
        - 商业区：刻意保持在永夜模式的模拟天空，霓虹灯闪烁，人声鼎沸
        - 居住区：宛如开满窗户的火柴盒般巨大单调的大型楼房，连贯如城墙包围商业区。绿化改造彻底，但土壤和植物全部从外界（如伏尔坎）进口
        - 部分区域：军事化、要塞化，居民面对死寂金属大地，将高楼视为自然景观
      society:
        - 各族群依托超古代都市遗迹的高楼生存，一座摩天大楼或复合建筑即是一座城
        - 生存所需全部产出自超古代质-能转换器（复制机），能源来自遍布大陆的能量网络
        - 交易以物易物为主，货币不统一，仅财团信用币在特定区域通用
        - 十四五岁的女生拿武器学习战斗技术在泰拉是奇怪的事情
      atmosphere: 银黑金属、霓虹闪烁、永夜模拟、绿光管线、悬空通道、通天塔群

    - name: 阿基亚（ASIA）
      description: |
        第三大层，普世城最主要的科研和工业生产区。
        总面积用无穷无尽形容，层高超过10km，横向面积与表层同等级别，是一个大陆级的工业空间。
        地表被复合体超级工厂覆盖，但这些工厂的规模是城市级别的，一台工业级复制机的大小便堪比一座摩天大楼。
      style:
        - 地表：被复合体超级工厂覆盖，海量的工业遗迹和停止运转的巨型设备
        - 核心：工业级复制机，因复杂程度超过已知一切机械结构，无人能够使用
        - 环境：能源管线、维修通道、工业废墟
        - 居民：原生族群（如特里尔人）已建立殖民地，社会形态与表层差别不大
      atmosphere: 工业废墟、停止运转的超级工厂、复杂的管线迷宫

    - name: 阿斯特里亚（AUSTRALIA）
      description: |
        第四大层，原功能为生态园，动植物与人造都市并存。
        环境崩溃后，植物与动物展开了以万年计的进化战争，最终植物全面胜利。
        数百亿晶体植物个体遍布整整一层，覆盖整片大陆，形成仅靠自身便可完成生态循环的极端独特生物圈。
      style:
        - 动物：从大型猛兽到食草鱼虫，一个不剩地被消灭，尸骨被植物吸收
        - 植物：进化出晶体/矿物般的外观，矿物般光泽
        - 居民：数百亿晶体植物个体如同脑细胞般跨越距离统一起来，形成一个超级思维网络。整个物种即一个个体，或一个超级生命
        - 氛围：无动物的死寂植物世界，晶体植物遍布整层
      atmosphere: 晶体植物、进化战争的胜利者、无动物、超级思维网络、矿物光泽

    - name: 阿非利加（AFRICA）
      description: |
        第五大层，荒芜沙漠，完全不存在水源和植被。
        内战的战场遗迹，古代兵器的坟墓。
        方圆数百公里只是局部区域，整层是无边无际的沙漠，掩埋着无数战舰残骸的广袤荒原。
      style:
        - 地表：荒芜沙漠，一望无际的沙土
        - 沙漠下方：大量碟形、椭圆形或球形的人造结构，直径一百到数百米，广泛分布。有些完整，有些破碎损毁到仅能扫描到轮廓
        - 本质：这些结构是制造者曾经的战舰，古代兵器的残躯
        - 居民：计算机生命体（NX-01等），古代兵器的意识延续
      atmosphere: 荒芜沙漠、掩埋的碟形战舰残骸、战场遗迹、古代兵器长眠

    - name: 欧罗巴（EUROPA）
      description: |
        第六大层，与阿非利加相邻。
        同为内战的战场遗迹，古代兵器的坟墓。
        规模与阿非利加同等级别，大陆级的大层。
      style:
        - 与阿非利加类似：被还原的战场，古代兵器残躯
        - 居民：计算机生命体
      atmosphere: 同阿非利加：战场遗迹、古代兵器长眠

    - name: 地基（Foundation）
      description: |
        普世城的最深层，超古代人的地下室。
        位于所有大层之下，深埋地底，是整个结构的根基，超古代人的控制中枢。
      style:
        - 位置：比所有大层更深的地方
        - 核心：月神（LUNA）的所在，超古代人的控制中枢
        - 功能：整个泰拉普世城的主要能量来源，所有仍在运转的超古代设施的能量皆来自此
        - 外观：银灰色大陆，表面有撞击坑般的环形山体，坑坑洼洼如被轰炸过
      atmosphere: 超古代控制中枢、月神所在、银灰色撞击坑地表

core_visuals:
  - 建筑材质：银黑色超古代合金为主，典型的复合结构
  - 交通：涡轮电梯（Turbolift），贯穿各层的巨大通道，反重力运载平台
  - 能源：遍布大陆的能量网络，质-能转换器（复制机），取之不尽的超古代能源
  - 通用设施：悬空通道、粗大管线、排风扇、霓虹灯、模拟天幕

society:
  - 政治形态：无常规国家，各族群以城（单栋建筑）为单位，形成数千个大族群，近似都市帮派斗争
  - 经济：复制机提供一切必需品，人民以工作换取使用配额，日常交易以物易物
  - 信仰：月神信仰（认为月神是执掌万物的无上存在，撑起一半天空，传授历法。主张现在的月亮是月神的替身）
  - 特殊群体：博尔格人（Borg）——接受半义体化改造的泰拉人，因古代科技植入体对极端环境有极佳耐受力，多见于探索和武装冲突
  - 信息保存：无纸质书籍，所有历史、文化、知识保存在电子数据库，通过终端机查阅
  - 武器：以火药燃气化学能击发的枪为主，几乎没有使用门槛，可大规模量产

writing_system:
  - 泰拉使用象形文字（象形如尼文），不依赖魔法咏唱
  - 外界魔法文明使用字母型古如尼文（表音），象形文字已被淘汰

relations:
  - 表层由海瓦萨-查理曼合作社管理（外部势力）
  - 下层探索受到各大势力严格限制，尤其是小层中的军事设施
  - 原生族群与表层文明冲突与合作并存，总体保持相似社会形态
