name: 艾莉薇之塔
alias: Eleva Tower
type: 地理
part: scene

location: |
  契卡城（Chika）南侧海角，距离市区约一公里，被高大金属栅栏围绕。
  海瓦萨王城原本围绕高塔而建，最初的村落就在高塔脚下。

appearance: |
  直入云端的白色巨塔，高度直达云层之上，地面上看不到塔尖。
  塔身由某种未知的超古代合金构成，表面有无数凹陷的纹理和沟壑。
  整座塔散发着一种古老而威严的气息，与周围现代化城市形成鲜明对比。
  前王国时代，夜晚被星晶探照灯从四面八方照亮，是整座城市在夜晚最为明亮的区域。
  如今四周却是一片沉寂，只有海风从海角吹过。

public_knowledge: |
  海瓦萨人民深信艾莉薇之塔可以"通达天际"，但对这个"天际"的具体概念一无所知。
  大陆各处并不缺乏以现代技术建成的"通天塔"，前海瓦萨王宫 itself 就可算作其一，
  以至于绝大部分民众从未深究过这座历史早已随着时光消逝、只留传说流传坊间的高塔的本来面目。
  官方说法是：超古代遗迹，五年前因探索中经常发生危险而封闭。
  民间传说：最初的契卡人是艾莉薇之塔的守护者一族，自双子大陆有历史记载以来从未离开此地，
  长老间流传的古书中记载着有关高塔的古代知识。
  但随着海瓦萨王国建国五千年、城市快速发展，与传说有关的历史痕迹已经无所考证。
  五年前的王国崩溃更是彻底毁掉了王宫的一切。

symbolism: |
  海瓦萨的国家象征，王城围绕其而建。
  统治者们曾站在王城高大建筑的顶端，俯瞰脚下万民生活的城市。
  王城建筑群被星晶探照灯照亮时，与高塔一同构成大陆独一无二的奇迹。

hidden_truth:
  - condition: 玩家/角色深入调查艾莉薇之塔或接触到露娜的血脉相关剧情
    content: |
      真实名称：塔的真正古如尼文名字是"LUNA"（月神），
      记载在塔底层入口最显眼位置的石碑上，石碑使用"象形古如尼文"书写。
      海瓦萨人根据超古代文献将其粗略翻译为"艾莉薇"（Eleva），
      绝大多数海瓦萨人不知道"月神"这一别名。
      露娜·伊菲尔·海瓦萨（Luna Iffel Hiawatha）的名字即来源于此。

  - condition: 玩家/角色进入塔内部或接触超古代科技研究
    content: |
      真正功能：超古代宇宙开发设施，最初的设计目是"运输"
      ——如巨大电梯般将大型货物或大量人员从地表快捷运输到星球轨道。
      能源采集（太阳能）是出于最大程度利用资源而开发的"副业"。
      塔顶有冠状结构——如树冠般层层叠叠向外扩散的太阳能阵列，
      无数"叶片"状独立单元可活动对准太阳。
      能源输出系统与现代设备不兼容，但可以作为"指挥塔"对整个泰拉能量网络拥有访问和控制权。

  - condition: 玩家/角色与海瓦萨王族或露娜深入互动
    content: |
      守护者血脉：海瓦萨王族是传说中守护者一族的后裔，血脉中拥有控制塔的权限。
      五千年前契卡征服周边城邦建立海瓦萨王国之前，这一族世代居住在高塔脚下。
      露娜作为王族最后的继承者，她的血液可直接激活控制系统。
      当系统检测到露娜的血液时，会误判"主人"受伤并自动发出求救信号。

  - condition: 玩家/角色调查贝当或海瓦萨政变内幕
    content: |
      艾莉薇之塔事件：贝当（时任总统）私下研究艾莉薇之塔，试图利用露娜的血液直接激活控制系统，
      利用其能源潜力为瑞曼联邦牟利。他计划以塔复苏的光芒为信号，让瑞曼舰队开进契卡，
      将海瓦萨变为联邦成员国。但塔本身不具备大量储能能力，输电船爆炸导致能量无处释放。
      事件后系统发出求救信号，跨越大陆导致泰拉能源网络逻辑混乱，余波持续数月。
      贝当被查理曼商团成员控制，但海瓦萨局势仍未根本好转。

atmosphere: |
  直入云端的白色巨塔，沉寂而神秘。
  前王国时代的辉煌灯火已成往事，如今只有海风与海鸟的叫声相伴。
  一种古老而威严的超古代科技氛围，被周围现代化城市的喧嚣所包围，
  却仿佛永远停留在属于自己的时光之中。
