name: 双子大陆概览
type: 地理
part: region

overview: |
  双子大陆由一块形如月牙的狭长弧形大陆——瑞摩斯（Remus）环绕着另一块近圆形大陆——罗慕路斯（Romulus）组成。
  两片大陆上存在复数个大大小小的魔法和自然科学文明国度，诸国基本维持和睦，但亦时有战争，大小冲突不断，
  局势并不算稳定，可以说正值一个处在微妙平衡下的战国时代。
  造就这种平衡的是两个互为对手的最强国家：雄踞罗慕路斯核心的罗慕伦帝国，和控制瑞摩斯半壁的瑞曼联邦。

regions:
  - name: 阿尔比恩王国
    description: |
      存在于一片由四个主要岛屿和成百上千小岛屿构成的浮空岛群之上的国度。
      浮空岛表面存在大量超古代遗迹，岛屿内部均含有储量巨大的天然反重力矿石零重素。
      岛屿群以年为周期，如卫星般自主环绕整个双子大陆浮游运行，目前漂浮在大陆西北方近海。
    capital: 伦底纽姆（Londinium）
    capital_style: |
      典型的魔法科技都市：既有同心圆结构多层巨型复合体建筑（魔法科技产物），
      也有各色高楼大厦、排放蒸汽的烟囱群、连接人工运河的景观水渠与水车体系（自然科学结晶）。
      魔法与科学交织融合所造就的奇景。
    military: |
      飞空舰：外形和普通水面舰艇一般无二（倾斜船艏、宽大船舷、高耸舰桥），
      运用阿尔比恩独有的矿石反重力技术，以舰底为中心形成锥形独立重力场，能在天空平稳航行，也能在海面航行。
      天空要塞：依托小型浮空岛建设的移动要塞，靠巨型魔导蒸汽动力炉驱动，平时悬浮在伦底纽姆附近中低空。
    technology: 擅长将魔法和自然科学结合，拥有完全不弱于大陆两大强权的科技水平
    history: 曾建立广袤的日不落殖民帝国，后被罗慕伦和瑞曼联手赶回本土
    atmosphere: 浮空岛、神秘雾气、符文光辉、魔法科技交织、天空要塞、飞空舰队

  - name: 契卡城（Chika）
    description: |
      瑞摩斯西海岸最重要的交通枢纽之一，每年数万船次和难以计数的货物吞吐量。
      海瓦萨王国（现为新海瓦萨）的港口都市，是海瓦萨赖以生存的金融中心。
    city_style: |
      中型城市规模，但商业繁华。
      建筑风格：排列齐整却风格各异——阿尔比恩风格、罗慕伦风格、甚至东方式建筑，
      多种不同风格放在一起却不产生凌乱感。
      商业街：对伊迪亚而言比家乡集市繁华数百倍的大场面。
      富人区：商团区附近，前王室直属商团所在地。
    special_locations:
      - name: 艾莉薇之塔
        note: 详见独立条目"艾莉薇之塔"
        current_state: 五年前因探索危险频发而封锁，前王国时代夜晚被星晶探照灯从四面八方照亮
      - name: 前王城遗址
        description: |
          不同于一般从首都中央划分独立区域建设的王城，
          海瓦萨王城原本是数座高达数公里的白色石碑状建筑群，典型的超级垂直城市。
          建造使用了来自艾莉薇之塔的技术，鼎盛时期花费五百年建造。
          五年前一夜间随着王国倾覆，如今仅剩焦黑的残垣断壁，被高大金属栅栏围绕，禁止进入。
          统治者们曾站在这些高大建筑的顶端，俯瞰脚下万民生活的城市。
    atmosphere: 繁华港口、风格混杂的建筑、白色石碑状垂直城市废墟、直入云端的巨塔

  - name: 海瓦萨王国（新海瓦萨）
    description: |
      由数座海港都市和寥寥几个内陆城镇组成的小型联合王国。
      五年前前王室里通外国打破中立原则，在愤怒的人民和围攻下倒台。
      新海瓦萨被夺去大半领土和武装力量，成为国土被压缩在海岸线边缘、完全失去战略纵深的狭长带状国家。
      如今名义上的主权国家，背后是洛泰尔共和国，新政府是傀儡政权。
    current_state: |
      现任总统贝当，前王国陆军将领，以激进能源产业改革闻名，背后是瑞曼联邦。
      前王族嫡系几乎仅剩露娜一人，名义上有公民权，实际上处于半软禁状态。
    atmosphere: 政变后的压抑、前王室的阴影、狭窄的海岸领土、政治傀儡的无力感

  - name: 艾康尼亚（Eiconia）
    description: |
      城邦国度，首都艾康尼亚城即是全国唯一的城市和领土。
      受罗慕伦帝国和瑞曼联邦特殊条约保障而不得牵涉战事的绝对中立地区。
      最初围绕一座超古代遗迹建立，立国基础是从遗迹中逆向而来的自然科学技术。
      核心设施为超古代传送站群（详见传送站系统条目）。
    architecture: |
      城市中心：超古代传送站遗迹建筑，由碟形建筑和立柱支撑，
      下方是博物馆和传送站设施，使用电梯垂直上下。
      博物馆：建设在遗迹地下空洞结构中，对所有人免费开放，记述相对客观完整的双子大陆近代史。
      大图书库：收录世界各处的纸质书籍和电子数据，中央服务器与覆盖整个艾康尼亚的网络相连。
    technology: |
      从遗迹逆向出低端材料学和建筑学技术，但核心无法解析。
      特殊传送站通往极度危险区域，需探索者团队认证。
    atmosphere: 碟形遗迹、中立都市、博物馆、传送站、免费知识

  - name: 罗慕伦帝国
    description: |
      雄踞罗慕路斯核心地带的大陆强权，极为擅长运用诡计谋求利益最大化。
      现任皇帝神秘到像是故作神秘，继位时间不长，非常年轻，明君但从不公开露脸的无面之王。
      强大的暗魔法使用者，擅长预言类术式的先知，常做出常人无法理解的举动。
    magic: 擅长暗魔法和预言占卜，飞空艇技术
    military: 飞空艇舰队（与阿尔比恩的飞空舰不同，保留类气囊结构和流线型设计，外观近似老式飞艇）
    style: 神秘、诡计、战略算计、暗魔法氛围、无面之王
    atmosphere: 暗魔法氛围、神秘帝王、飞空艇舰队、战略博弈

  - name: 瑞曼联邦
    description: |
      控制瑞摩斯半壁江山的科技大国，拥有雄厚资本和庞大人口基础，战争潜力极高。
      与罗慕伦帝国是互为对手的关系。
    technology: 纯自然科学国度，最先进的舰船设计，科技立国
    military: 海军舰队、导弹/制导火箭技术
    political_action: 曾扶持海瓦萨贝当派发动政变，控制新海瓦萨
    style: 资本雄厚、科技先进、军事强大、务实
    atmosphere: 科技都市、工业化、军事力量、资本与政治的冷酷

  - name: 罗慕路斯大陆
    description: 近圆形大陆，罗慕伦帝国的核心领土

  - name: 瑞摩斯大陆
    description: 形如月牙的狭长弧形大陆，环绕罗慕路斯

geography_note: |
  罗慕路斯与瑞摩斯之间有一片内海，内海一带有真正的都市（与契卡这样的中型城市相比）。
  奥尔特海在双子大陆西侧，威吉鲁岛在奥尔特海中央。

atmosphere: |
  双子大陆是一个魔法与科技交织、多国博弈的战国时代。
  阿尔比恩的浮空岛与飞空舰、海瓦萨的白色垂直城市废墟、艾康尼亚的碟形传送站、
  罗慕伦的暗魔法与飞空艇、瑞曼的科技舰队，共同构成了这片大陆的多元而紧张的氛围。
