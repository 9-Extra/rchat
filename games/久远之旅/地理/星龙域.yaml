name: 星龙域
type: 地理
part: region

overview: |
  星龙域位于遥远东方的海域，是一个复杂的多族群混合社会。
  人类、亚人、灵兽与包括龙种在内的真龙共享同一片天地。
  与外界的单一族群国家不同，星龙域并非以某个族群为主体建立的国家，
  而是各族群共存的特殊文明形态。
  奉行不干涉外界的原则，真龙种通常极少与星龙域之外的世界接触，但探索者可以外出游历。

structure:
  - name: 天界
    description: |
      数十个悬浮在陆地群上方的巨大六棱柱体结构，长短不一，呈长短不一六棱柱体构造。
      表面遍布星星点点的灯光，顶部有着天空花园般的人造自然环境。
      绝大多数都市是空壳，平时由合成种进行管理。
      真龙种居民绝大多数集中在其中一座名为"北斗"的都市之上。
      外界几乎没有任何关于天界的情报，似乎连描述其外形都在某种程度上被星龙域禁止。
    central_city: 北斗城
    central_city_description: |
      天界中央都市，顶层建筑风格"庄重"而非"奢华"——富有雄浑气魄，却无铺张浪费。
      东方古典风格的梁栋、飞檐，在阳光下反射出辉光的金瓦。
      真龙绝大多数身着风格素雅的丝质衣装，少数穿西方魔法文明样式的服装。
      北斗城自身散发出力场，隔绝了一个与整个空中结构一般大小的巨型生命存在的信号。
      飞空舰可直接降落在顶层空港，如同从一座城市飞往另一座城市般平常。
  - name: 地界
    description: |
      人类、亚人、鬼种等普通族群居住的大陆。
      最大不过三四层高的和式建筑，建材常见普通石材和木材。
      几乎看不到多少高大的人造结构，超古代遗迹里常见的复合式建筑也不存在。
      城市规模和建筑风格像"普普通通的小镇"，但这里是地界主岛西海岸最大的城市。
      夜景在建筑密度、宏伟程度和夜间光照程度上远逊于外界大都市。
      有发达的城市交通和类似魔导车的悬浮代步工具。

society:
  - 多族群混合：人类、亚人、鬼种、灵兽、真龙种共存，不同于外界的单一族群国家
  - 生产制度：近似泰拉的社会形态，集体分配、工作为服务或保卫集体
  - 治安：樱田署维持地界治安，使用太刀（象征作用为主），鲜少遭遇真正犯罪
  - 外交：奉行不干涉原则，但个体探索者可以外出游历
  - 语言：使用象形文字（象形如尼文），不依赖守护灵咏唱即可施展魔法
  - 鬼种：地界人口最多的主要种族，不依赖守护灵咏唱即可施展法术，亚人种中最强身体素质
  - 真龙种：住在天界，基因记忆中先天保存着上古流传的知识，卵生繁殖，难以与其他种族通婚

magic:
  - 使用象形如尼文，无需咏唱守护灵之名
  - 心理诊疗术式："决定时刻"——映照出受术者人生最关键的转折点事件，并在感官中重现
  - 高等医疗术式：星龙域特秘而不宣的高等治疗术式
  - 催眠摇篮曲：星龙域流传的摇篮曲，具有催眠效果
  - 古如尼文：掌握古代符文和术式
  - 光传送技术：先进传送技术，可直接在目标有机会反制前将其传送

style:
  - 建筑：和式建筑风格（东方风格），最大三四层高，木制结构、瓦片屋顶、飞檐、推拉门，建材常见普通石材木材
  - 政府机关：石质外墙、方方正正，与四周木质和式建筑有明显区别（如樱田署总部）
  - 服饰：和式风格元素，轻便的探索者服饰，覆盖金属护甲的战靴；真龙种穿素雅丝质衣装
  - 武器：和制太刀（直刀/长刀）、双刃长枪等，表面带有大量红色魔导符文
  - 神职：巫女打扮的神职人员，有特定的仪式服装
  - 植物：原生"樱花"（与伏尔坎的基因改造樱有区别，是基因原体）
  - 文化：有"塞翁失马，焉知祸福"之类的古谚语

樱田署:
  description: 地界维持治安的武装警察机构，类似艾康尼亚都市机动安全小组
  headquarters: 石质外墙、方方正正，与四周木质和式建筑有明显区别，门口有腰挎长刀的卫兵站岗
  equipment: 太刀（象征作用为主，因治安极好极少真正使用）
  technology: 光传送技术、天界对地观测设备
  teams:
    - 水城队：四人义姐妹组成（莓/一号、仁子、美津、羽黑）
  atmosphere: 治安极好，极少真正犯罪，多数违法者是外来者

characters_origin:
  - 光：星龙域人，前樱田署风见队"主序"，雪白色长发，灰白机能风风衣，使用巨大铡刀形武器
  - 凪：星龙域人，前樱田署风见队"星云"，粉毛狐耳，白色长袖风衣，黑色狐狸面具，太刀，掌握古如尼文
  - 露普斯：来自比星龙域更遥远地区的探索者，但受星龙域人（光、凪）教导武技
  - 阿妮德：真龙种（双足飞龙），父母来自星龙域，被遗留在尤克特拉希尔，基因记忆中保存星龙域知识

atmosphere: |
  遥远东方的神秘海域，多族群共存的混合社会。
  地界是朴素的三四层和式小镇，天界是悬浮的六棱柱巨构与北斗城的庄重金瓦。
  和式建筑与巫女打扮、象形文字与无需咏唱的魔法、天界真龙与地界众生。
  不干涉外界却又有探索者游历世界，古老而神秘。
