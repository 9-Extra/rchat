name: 尤克特拉希尔
type: 地理
part: region

overview: |
  【注意：位于里世界，但被传送站连通，考察队可以抵达却无法定位其具体位置】
  尤克特拉希尔（Yggdrasill）是超古代时期容纳人口上亿的超巨型都市，位于里世界内壁大陆上。
  在泰拉普世城面前"形如蝼蚁"，但其规模依然庞大——地下部分与地表相当，
  是一座完整的双层都市结构。
  被遗弃无数万年后，如今已成为探索者偶尔涉足的遗迹，
  也是阿妮德（真龙种）被孵化并生活了近十年的"家"。

material:
  - name: 泰坦-杜拉超结构合金纤维
    description: |
      不会留下磨损痕迹，光洁如新，足以使建筑屹立无数年月而巍然不倒。
      道路也部分使用了这种材质，否则城市面貌早已被自然彻底抹去。

environment:
  - name: 被自然占领的都市
    description: |
      废弃无数万年的城市已与自然融为一体。
      绿色藤蔓植物爬满所有建筑外墙，草木在废弃街道间见缝插针地生长，
      地面被水潭、地衣和苔藓植物覆盖。
      建筑遗骸彻底变成了生物繁殖的温床。
  - name: 独立生态圈
    description: |
      相当大一部分动植物是外界所没有的，发展出一套独立的生态圈。
      偶然会发现巨型生物遗骸造成的建筑损坏。
      至今没有任何疑似类人生物的遗骸被寻获。
  - name: 地下结构
    description: |
      庞大地下部分已被地下水倒灌彻底淹没，积蓄着整个地区几乎全部的地下水，
      是一座取之不尽用之不竭的巨型水库。
      有四通八达的地下通道网、地下交通站、冷冻库等超古代设施。
      有传送站遗迹连接艾康尼亚（详见传送站系统条目）。
      阿妮德还是龙蛋时在城内一座还在运转的冷冻库中孵化。

atmosphere: |
  一座被自然重新占领、在永恒暗淡正午下静静腐朽的超古代都市遗迹。
  泰坦-杜拉合金建筑在藤蔓和苔藓中屹立，地下是被淹没的通道和水库，
  独立的生态系统在废墟中繁衍，寂静而神秘。
  没有昼夜之分，太阳永远高悬，光芒却暗淡如黄昏。
