name: 阿塔米德
type: 地理
part: region

overview: |
  【注意：位于里世界，几乎无人知晓阿塔米德存在】
  里世界中的一座卫星城，由Terran技术建造的浮岛城市。
  有扭曲场隐藏城市，让外界无法探测到其存在。
  仅存10名实体居民（Terran后裔），其他人都已沉溺于虚拟世界。
  城市内有空港、量子档案馆、研究设施、医疗设施等。

city:
  - name: 空港
    description: 可供飞空舰降落的停泊区域，碟型战舰护卫
  - name: 量子档案馆
    description: |
      量子技术保存物品的档案馆，能让存放其中的物品进入"静滞态"——
      虽然仍经历时间流逝，但不再发生物理层面的变化。
      被阿塔米德人用来保存选择性雪藏的超级科技造物。
      记载着相位技术及其产物的完整资料。
  - name: 多特征扫描仪
    description: 万能安检仪器，防止携带设备对敏感存储单元造成影响
  - name: 研究设施
    description: 用于分析数据、追踪时空相位、布置压制场和传送设备
  - name: 医疗设施
    description: 可进行详尽身体检查，治疗技术远超外界标准
  - name: 虚拟世界
    description: |
      阿塔米德人的祖先沉溺于电子化虚拟世界的纸醉金迷，抛弃了肉身进入虚拟空间。
      当实体人口下降到只剩不到一亿，尤克特拉希尔被遗弃，人口移居到12座卫星城。
      如今只剩阿塔米德还有10个"活人"。

technology:
  - 扭曲场：隐藏城市，可根据时间改变光学特性模拟昼夜
  - 力场：个人力场、隔离力场、压制场、屏蔽屏障
  - 碟型战舰：Terran技术建造的护卫战舰
  - 量子档案：静滞态保存技术
  - 时空相位技术：可将人送入异时空相位，追踪时空相位数据

society:
  - 仅存10名实体居民，其他都已进入虚拟世界
  - 总管艾迪森先生负责管理城市
  - 最后一名新生儿威斯利，渴望拥有现实中的家庭
  - 居民对历史档案中描述的"家庭"概念非常向往
  - 不希望干扰外界文明的发展，请求来访者对外保密

atmosphere: |
  Terran技术建造的浮岛城市，扭曲场隐藏于里世界之中。
  量子档案馆保存着超级科技，10名实体居民守护着濒临消亡的文明。
  虚拟世界与现实世界的交错，古老而哀伤。
