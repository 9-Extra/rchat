name: 里世界
type: 地理
part: region

overview: |
  索拉利安的内壁世界，一片广阔到需要近11个月才能横贯的大陆级空间。
  绝大多数居民对此一无所知，仅将其视为神话或伪科学。
  里世界并非单一地点，而是包含多个内部区域和遗迹的完整异世界——
  有独立生态、压缩太阳、超古代都市遗迹和Terran后裔的卫星城。

structure: |
  里世界是附着于索拉利安星体内壁的另一片天地，中心有一颗压缩的原始太阳，光芒被某种力量固定，从地表看去与外界太阳无异，为整个里世界提供光照和能量。
  里世界内壁上的陆地，其规模足以容纳完整的生态系统，有独立的生态系统和大量动植物、大陆级地形和无数超古代遗迹，暂未演化出智慧生命。
  里世界内的任何地方都没有昼夜循环，永恒正午，太阳永远高悬。
  存在表里世界出入口，金鹿号等舰船可沿内壁地表航行。
  阿塔米德总管曾提供路径：从阿塔米德前往最近的表里世界出入口，常规航线需近11个月。

internal_regions:
  - name: 阿塔米德（Altamid）
    type: Terran卫星城
    description: |
      里世界中的浮岛城市，由Terran技术建造，有扭曲场隐藏自身。
      仅存10名实体居民，其余均已进入虚拟世界。
      详见独立条目：阿塔米德
  - name: 尤克特拉希尔（Yggdrasill）
    type: 超古代都市遗迹
    description: |
      超古代时期容纳人口上亿的超巨型都市，位于里世界内壁大陆上。
      有庞大的地下部分，被遗弃后无数年月中已彻底淹没，积蓄着整个地区几乎全部的地下水。
      有地下通道网、冷冻库、传送站等超古代设施（详见传送站系统条目）。
      阿妮德的龙蛋在此冷冻库中孵化，她将此视为自己无限广阔的家。
  - name: 其他卫星城遗迹
    description: |
      Terran人口移居的12座卫星城中，如今仅阿塔米德还有活人。
      其余卫星城或已废弃，或仅剩自动设施运转，散落在里世界各处。

atmosphere: |
  内壁上的异世界，压缩太阳照耀大地，超古代遗迹遍布，
  独立的生态系统与大量动植物，散落着Terran后裔的卫星城。
  绝大多数人对此一无所知，仅存在于传说与神话之中。
  里世界不是一个"地点"，而是一个包含无数秘密的完整世界。
