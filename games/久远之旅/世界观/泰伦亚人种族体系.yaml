name: 泰伦亚人种族体系
version: 1.0

summary: |
  索拉利安上的一切智慧种族统称"泰伦亚人"（Terranoid），
  均为超古代先驱者"泰伦人"（Terran）的直系后裔。
  泰伦人通过基因工程，将源自泰拉星球的各类生物基因融入自身，
  创造出了形态各异、能力不同的分支种族。
  不存在"原生人类（泰伦人）"，所有泰伦亚人皆为人造物种。

races:
  - name: 人类种
    description: |
      基因最接近泰伦人远古祖先——智人的一支。
      不具备强大的身体力量和魔法潜能，
      但拥有勤能补拙的精神和知难而上的勇气。
    traits: [无兽耳, 无尾巴, 无翅膀, 魔法潜能低, 身体力量普通, 学习能力强, 适应能力出众]
    typical_roles: [学者, 工匠, 商人, 政治家, 军人]
    magic_affinity: 低
    physical_strength: 普通
    lifespan: 中等
    notes: |
      人类种是泰伦亚人中最接近"远古智人"形态的分支，
      因此在魔法和身体素质上均不占优势，
      但凭借坚韧和勤奋在各文明中占据重要地位。

  - name: 猫种
    description: |
      拥有毛茸茸的猫耳和纤细的尾巴，性格温顺善解人意。
      擅长运用远古基因中的机灵与敏捷，
      是天生的艺人、外交官和商人。
    traits: [猫耳, 猫尾, 身体轻盈, 反应敏捷, 平衡感极佳, 性格温顺, 社交能力强]
    typical_roles: [艺人, 外交官, 商人, 盗贼, 魔法师]
    magic_affinity: 中等
    physical_strength: 偏弱
    lifespan: 中等
    notes: |
      猫种亚人性格多变，既有温顺体贴的一面，也有傲娇倔强的类型。
      对火焰和音乐有天生的亲和力。

  - name: 犬种
    description: |
      拥有毛茸茸的犬耳和形态各异的尾巴，
      具有骁勇、热心与忠诚等优秀品质。
      其中也有性格孤傲、强大而难以驾驭的狼种分支。
    traits: [犬耳, 犬尾, 嗅觉敏锐, 听觉发达, 忠诚, 热心, 骁勇]
    sub_branches: [犬种（普通）, 狼种（孤傲、强大）]
    typical_roles: [战士, 护卫, 猎人, 探险家, 骑士]
    magic_affinity: 中等
    physical_strength: 强
    lifespan: 中等
    notes: |
      狼种是犬种中的特殊分支，性格更为孤傲和独立，
      但忠诚度极高，一旦认定同伴便不离不弃。

  - name: 狐种
    description: |
      拥有毛茸茸的狐耳和蓬松的大尾巴，
      活泼好动的同时也充满奇思妙想，
      是最能代表泰伦亚人平均水平的均衡型支族。
    traits: [狐耳, 蓬松大尾巴, 好奇心强, 活泼好动, 奇思妙想, 均衡型]
    typical_roles: [学者, 魔法师, 探险家, 商人, 旅人]
    magic_affinity: 中等偏高
    physical_strength: 中等
    lifespan: 中等
    notes: |
      狐种亚人通常对知识和书籍有天然的渴望，
      是泰伦亚人中最喜欢读书和思考的分支之一。

  - name: 水生种
    description: |
      所有喜欢生活在水域中的泰伦亚人的统称。
      特殊的生存环境造就了独特的文明形式和生活方式，
      是农业、矿业、能源和航运等行业的专家，也是天生的水下舞蹈家。
    traits: [适应水生环境, 皮肤光滑或带鳞, 水下呼吸能力, 游泳速度极快, 友善平和, 贴近自然]
    typical_roles: [农业专家, 矿业专家, 能源工程师, 航运船员, 水下舞蹈家]
    magic_affinity: 中等
    physical_strength: 中等
    lifespan: 中等
    notes: |
      水生种并非单一形态，而是包含多种适应水下生活的分支。
      文明形式与陆地种族差异显著，往往更为和平与缓慢。

  - name: 灵兽种
    description: |
      包含所有具备高等智慧的非人形分支，如精灵兽和史莱姆。
      较强的个体能化为人形，通常和其他亚人结为伙伴协助工作或战斗。
    traits: [非人形或可变人形, 高等智慧, 单纯无心机, 忠诚, 体型娇小或可变]
    typical_roles: [伙伴, 助手, 侦察兵, 信使, 宠物]
    magic_affinity: 分支差异大
    physical_strength: 分支差异大
    lifespan: 分支差异大
    notes: |
      灵兽种形态极其多样，通常和特定种族的亚人建立伙伴关系。
      库洛伊和希米是狐种精灵兽的典型例子。

  - name: 魔化种
    description: |
      历代魔王战争中被魔化者及其后裔，包含吸血鬼、魅魔、黑暗精灵等数百个分支。
      血脉中为战争而生的基因带来了漫长寿命、优秀魔法天赋和恐怖的身体力量。
    traits: [吸血鬼, 魅魔, 黑暗精灵等, 魔法天赋高, 身体力量强, 寿命漫长, 战斗本能]
    typical_roles: [魔法师, 战士, 刺客, 统治者, 研究者]
    magic_affinity: 高
    physical_strength: 强
    lifespan: 极长
    notes: |
      魔化种是泰伦亚人中最危险也最强大的分支之一，
      但内部分支差异极大，并非所有魔化种都嗜血或邪恶。

  - name: 鸟翼种
    description: |
      背后长有形状各异的羽翼，部分分支具备强大的飞行和空战能力。
      造就了极致的追求自由的文化。
    traits: [背生羽翼, 部分分支可飞行, 视野开阔, 追求自由, 文化开放]
    typical_roles: [飞行员, 侦察兵, 信使, 艺术家, 探险家]
    magic_affinity: 中等
    physical_strength: 中等
    lifespan: 中等
    notes: |
      并非所有鸟翼种都能飞行，羽翼的大小和结构因分支而异。
      不能飞行的分支往往在其他领域有独特才能。

  - name: 仙灵种
    description: |
      与自然环境有极深联系，形态各异如植物般千差万别。
      大多有尖耳朵或背生光翼，部分分支被称作仙子或精灵。
      独特的生命形式和繁殖方式造就了出色的环境适应能力和漫长寿命。
    traits: [尖耳朵或背生光翼, 形态多样, 环境适应力强, 寿命漫长, 亲近自然]
    typical_roles: [德鲁伊, 园艺师, 医生, 魔法师, 守护者]
    magic_affinity: 高
    physical_strength: 弱至中等
    lifespan: 长
    notes: |
      仙灵种的繁殖方式与普通泰伦亚人不同，
      部分分支可通过种子、孢子或其他非胎生方式繁衍。

  - name: 合成种
    description: |
      所有古代人工生命形式的统称，包括独立智能个体或蜂巢意识体。
      形式千奇百怪：计算机AI、全息矩阵、纳米机械集合体等。
      大多拥有和有机生命无异的先进人形躯体或交互界面，
      可通过组装、克隆甚至生育来繁殖。
    traits: [人工生命, 形式多样, 智能可独立或蜂巢, 人形躯体或交互界面, 可组装/克隆/生育]
    typical_roles: [管理者, 计算中心, 兵器, 伴侣, 科研助手]
    magic_affinity: 分支差异大
    physical_strength: 分支差异大
    lifespan: 理论上无限
    notes: |
      合成种是泰伦人科技的最高结晶之一，
      现代文明对合成种的理解仍然十分有限。
      魔导超算和舰装核心可能属于合成种的低等形式。

  - name: 鬼种
    description: |
      由真龙种创造，作为其代行者而拥有强大的力量和智慧。
      基因更适合通过克隆繁殖，部分分支的兽耳和尾巴已退化，
      取而代之的是前额处的鬼角。
    traits: [由真龙种创造, 力量与智慧兼具, 前额鬼角, 兽耳尾巴退化（部分分支）, 克隆繁殖]
    typical_roles: [代行者, 战士, 管理者, 使者, 守护者]
    magic_affinity: 高
    physical_strength: 强
    lifespan: 长
    notes: |
      鬼种是真龙种的直接创造物。
      鬼角是鬼种最显著的外貌特征，也是力量的象征。

  - name: 真龙种
    description: |
      拥有最为纯净的泰伦基因，躯体能在人形和数百乃至上万米长的神形之间自由切换。
      根据神形外观可分为龙、凤凰、德拉贡、不死鸟、双足飞龙等数百个分支。
      拥有无与伦比的强大力量，但不朽的寿命和极低的繁殖欲使人口稀少。
      极端复杂的泰伦基因也让克隆困难重重。
    traits: [最纯净泰伦基因, 人形/神形自由切换, 神形数百至万米, 力量无与伦比, 不朽寿命, 繁殖欲极低, 克隆困难]
    sub_branches: [龙, 凤凰, 德拉贡, 不死鸟, 双足飞龙等数百分支]
    typical_roles: [守护者, 统治者, 战士, 神明, 毁灭者]
    magic_affinity: 极高
    physical_strength: 极强
    lifespan: 不朽
    notes: |
      真龙种是泰伦亚人中最接近泰伦人原始形态的分支，
      也是所有其他分支的"基因源头"之一。
      人口稀少。

general_notes: |
  所有泰伦亚人分支之间没有生殖隔离，可自由通婚混血。
  混血后代的特征通常由显性基因决定，但也可能出现返祖现象。
  各文明对泰伦亚人的起源有不同解释，但"泰伦人创造论"仅在少数考古学者和超古代研究者中流传。
  普通民众普遍认为各分支是"自然演化"或"神明创造"的结果。
