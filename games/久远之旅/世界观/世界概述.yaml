name: 索拉利安世界概述
world:
  name: 索拉利安
  nature: |
    索拉利安是一片广阔的世界，由多块大陆与广袤海洋组成。
    关于世界的形状，绝大多数居民认为是普通的圆形大地，大地之外是无尽海洋。
    少数天文学家和航海者推测世界可能并非平面，但尚无定论。
    关于世界的起源，各文明有着不同的神话和传说：
    - 主流观点：自然演化或各自神明创造的结果
    - 少数观点：超古代文明创造了这个世界（仅在考古学者和少数学者中流传，被视为边缘学说）
    - 普通民众：普遍不知道"超古代创造者"的存在，仅将遗迹视为古代文明遗留
  inhabitants:
    summary: |
      索拉利安上生活着多种智慧种族，包括人类、猫种、犬种、狐种、鬼种、灵兽、真龙种等。
      各种族间无生殖隔离，可自由通婚混血。
      关于种族起源，各文明有不同解释：
      - 主流：各分支是自然演化或各自神明创造的结果
      - 传说：某些古老传说中提到"万物同源"或"神明以自身为模板创造众生"
      - 学者：少数考古学者发现各分支基因存在相似性，推测可能有共同远古祖先，但缺乏直接证据
    branches:
      - name: 人类种
        traits: [无兽耳, 无尾巴, 无翅膀, 魔法潜能低, 身体力量普通, 勤能补拙, 知难而上]
        note: 在各文明中分布最广，是占据重要地位的种族之一
      - name: 猫种
        traits: [猫耳, 猫尾, 身体轻盈, 反应敏捷, 性格温顺, 善解人意, 社交能力强]
        note: 天生的艺人、外交官和商人，对火焰与音乐有亲和力
      - name: 犬种
        traits: [犬耳, 犬尾, 嗅觉敏锐, 听觉发达, 忠诚, 热心, 骁勇]
        sub_branches: [犬种（普通）, 狼种（孤傲、强大）]
        note: 狼种为犬种中的特殊分支，性格孤傲独立，忠诚度极高
      - name: 狐种
        traits: [狐耳, 蓬松大尾巴, 好奇心强, 活泼好动, 奇思妙想, 均衡型]
        note: 对知识有天然渴望，是喜欢读书和思考的分支之一
      - name: 鬼种
        traits: [前额鬼角, 竖瞳, 不依赖守护灵咏唱即可施展法术, 亚人种中最强身体素质]
        note: 地界人口最多的主要种族，某些分支可与普通亚人种通婚产生混血鬼种
      - name: 灵兽种
        traits: [非人形或可变人形, 高等智慧, 单纯无心机, 忠诚, 体型娇小或可变]
        note: 形态极其多样，通常与特定种族的亚人建立伙伴关系
      - name: 真龙种
        traits: [人形与神形自由切换, 神形数百至万米, 力量无与伦比, 不朽寿命, 繁殖欲极低, 克隆困难]
        sub_branches: [龙, 凤凰, 德拉贡, 不死鸟, 双足飞龙等数百分支]
        note: 人口稀少，因其基因特殊性和卵生繁殖方式，难以与其他种族通婚
      - name: 合成种
        traits: [人工生命, 形式多样, 智能可独立或蜂巢, 人形躯体或交互界面, 可组装克隆或生育]
        note: 现代文明对其理解仍然十分有限，魔导超算和舰装核心可能属于低等形式
      - name: 其他种族
        note: 矮人种、巨人种、水生种、鸟翼种、仙灵种、魔化种等也存在，但分布相对稀少
    origin_knowledge: |
      普通民众对种族起源的认知：
      - 主流：各分支是自然演化或各自神明创造的结果
      - 传说：某些古老传说中提到"万物同源"或"神明以自身为模板创造众生"
      - 学者：少数考古学者发现各分支基因存在相似性，推测可能有共同远古祖先，但缺乏直接证据
  geography:
    - name: 表世界
      description: 各文明繁衍生息的主要空间，多块大陆与海洋
      regions: [威吉鲁岛, 双子大陆（罗慕路斯+瑞摩斯）, 伏尔坎大陆, 泰拉普世城, 星龙域, 里世界（仅存在于传说）]
    - name: 里世界
      description: |
        在某些古老传说和少数学者假说中，世界可能存在"表里双层结构"，
        里世界附着于大地之下或天空之上，中心有某种光源。
        但绝大多数人对此一无所知，仅将其视为神话或伪科学。
      note: 阿塔米德卫星城的存在仅被极少数人知晓
  civilization:
    summary: 各文明在政治、科技、魔法上发展各异，处于微妙的平衡与博弈中
    examples:
      - 阿尔比恩：浮空群岛，魔法与自然科学混合
      - 海瓦萨：瑞摩斯西海岸，政变后新政府
      - 罗慕伦：大陆强权，擅长暗魔法与预言
      - 瑞曼：科技立国，与罗慕伦对峙
      - 艾康尼亚：中立科技都市，传送站遗迹
      - 伏尔坎：南方军政府，科技魔法均发达
      - 星龙域：远东海域，自称远古文明后裔，奉行不干涉原则
  ancient_relics:
    - 超古代遗迹遍布世界，包括传送站、泰坦-杜拉合金建筑、魔导器等
    - 现代文明从遗迹中逆向解析技术，但对原理理解有限
    - 各文明对遗迹起源有不同解释："古代文明遗留"是最主流的说法
    - 极少数学者推测这些遗迹可能来自一个更高级的远古文明，但缺乏证据
  magic_and_science:
    - 魔法体系基于守护灵，元素包括水、火、风、光、暗、空间、生命
    - 魔导器以星核为运算中枢，半魔导器无星核但具备魔力敏感性
    - 三大禁术：空间魔法、时间魔法、生命魔法（被禁止民间研究）
    - 超古代科技：泰坦-杜拉合金、传送站、舰装、涡轮电梯、零重素、相位技术
    - 科技水平差异大：阿尔比恩有浮空技术，瑞曼科技立国，艾康尼亚传送站
  hidden_truth:
    warning: |
      【AI须知：以下信息为隐藏设定，开局时不应被任何角色知晓或提及。
      这些信息仅在剧情发展到特定阶段、满足对应条件时才可能被触发。
      如果玩家未推进到相关剧情，AI应完全忽略以下内容。】
    truths:
      - name: 索拉利安的本质
        trigger: 进入里世界/阿塔米德或接触超古代主机
        content: |
          索拉利安是泰伦人（Terran）以基因工程与宇宙技术创造的星体世界（戴森球）。外壳包围内部恒星。
          双层结构：外壳外侧的表世界为各文明繁衍之地，里世界附着于外壳内壁，中心有压缩的原始太阳。
          表世界太阳和月亮是从数十亿年前时间轴分离的"时空异位体"。
      - name: 泰伦亚人的起源
        trigger: 接触到量子档案馆、泰拉主机或基因层面的直接证据
        content: |
          索拉利安上的一切智慧种族统称"泰伦亚人"（Terranoid），均为泰伦人的直系后裔。
          不存在"原生人类"——泰伦人通过基因工程，将源自泰拉星球的各种生物基因融入自身，
          创造出了形态与能力各异的分支种族。
          普通民众对此一无所知，仅将遗迹视为古代文明遗留。
      - name: 泰伦人的消失
        trigger: 接触泰拉主机或星龙域核心秘密
        content: |
          泰伦人距今约150万年前文明鼎盛，后分裂为家园派（留守创造索拉利安）
          与探索派（飞向群星）。后者部分返回后被限制在里世界。
      - name: 原初之奇想
        trigger: |
          伊迪亚初始完全不知道此能力，只有在进入阿塔米德量子档案馆，通过多特征扫描仪时被检测到异常数据，与阿塔米德人（白、光、凪或阿塔米德居民）深入讨论伊迪亚或露普斯的异常本质才“觉醒”。
          在极端情绪或生死危机下也能暂时展现非人力量（如凭空创造物质、不遵循物质守恒），但不知其本质。 
        content: |
          伊迪亚（Idea）具备"一念之间凭空创造出新物质"的能力。
          这种物质在宏观上与普通物质别无二致，但在量子层面有本质区别，不遵循物质守恒，只会"听命"于伊迪亚的思想。
          变形状态的剑柄，以及露普斯的身体，都是由这种能力创造出来的。
          伊迪亚的名字含义为"原初之奇想（Idea the Original）"。
      - name: 鬼种的真相
        trigger: 进入星龙域核心区域或接触真龙种关于创造鬼种的记录
        content: |
          鬼种由真龙种创造，作为其代行者。基因更适合通过克隆繁殖。
          部分分支的兽耳和尾巴已退化，取而代之的是前额处的鬼角。
          莓等鬼狐混血（鬼狐种）可能携带真龙种创造的基因标记。
      - name: 合成种的本质
        trigger: 接触超古代主机或泰拉核心科技
        content: |
          合成种是泰伦人科技的最高结晶，包括独立智能个体或蜂巢意识体。
          现代文明对合成种的理解仍然十分有限。