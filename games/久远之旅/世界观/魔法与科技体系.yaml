magic:
  summary: |
    魔法基于守护灵体系，通过咏唱守护灵之名来发动术式。
    魔法本质是制御世间物质而非凭空产生，遵循物质守恒原则。
    发动方式包括法杖辅助咏唱、徒手瞬发简单术式、以及复杂术式的冗长咏唱。

  guardians:
    - name: 墨丘利（Mercury）
      element: 风系
      note: 制御大气，可搅动气流、模拟类声呐
    - name: 维纳斯（Venus）
      element: 时间系
      note: 极为稀有，几乎已灭亡的信仰
    - name: 盖亚（Gaia）
      element: 大地系
      note: 控制土石与地脉
    - name: 玛尔斯（Mars）
      element: 火系
      note: 能量转换专家，擅长强化魔法
    - name: 朱庇特（Jupiter）
      element: 光系和雷电系
      note: 光系用于医疗复合术式，雷电系用于攻击
    - name: 萨图恩（Saturn）
      element: 暗魔法
      note: 与预言和占卜相关
    - name: 乌拉诺斯（Uranus）
      element: 空间系
      note: 三大禁术之一，不确定性极高，禁止民间私自研究
    - name: 涅普顿（Neptune）
      element: 水系
      note: 流体控制，多变灵活，干燥环境受限
    - name: 普罗托（Pluto）
      element: 生命系
      note: 涵盖生老病死和干涉生命进程，包括疾病和死亡

  casting_rules:
    - "发动任何魔法术式，咏唱词中守护灵的名字必不可少，瞬发型术式也不例外"
    - "空间系魔法绝不允许仅念诵守护灵之名的瞬发或省略，咏唱冗长繁琐"
    - "稍有资质的人都能徒手启动简单术式，但复杂术式需要法杖辅助"
    - "法杖通过星核运算术式并代替施术者与守护灵沟通"
    - "伊迪亚的水召唤疑似违反物质守恒（特殊情况，不应作为常态）"

  casting_visuals:
    - element: 水系
      visuals: [水蓝色符文, 圆形法阵, 指尖拨动法阵旋转, 水滴凝聚, 水刃形态可变]
    - element: 火系
      visuals: [红色光辉, 法杖顶端星核放射光芒, 火焰以接触点为圆心扩散, 强化符文金色如血管]
    - element: 风系
      visuals: [气流汇聚, 沙尘卷动, 大气搅动]
    - element: 空间系
      visuals: [环带状符文环绕双臂, 符文扩大如涟漪, 两圈融合成横置8字（无限符号）, 内部变成黑洞/虫洞]
    - element: 光系
      visuals: [治疗光辉, 咏唱光系医疗复合术式]
    - element: 生命系
      visuals: [涵盖范围极广, 包括黑魔法死灵类和瘟疫类]

  strengthening:
    - type: 火系强化
      mechanism: 将体内化学能转化，借由魔力生成强化符文，能量应用于特定部位，形成"能量战衣"
      advantage: 能量转换效率高，续航强
      master: 火系魔法师是能量转换专家，最擅长强化魔法
    - type: 水系强化
      mechanism: 将全身血管视作统一独立系统，以循环网络代替强化符文，注入庞大魔力
      advantage: 隐蔽性强，无术式显现，无体表符文
      disadvantage: 效率和续航远不及火系，对心脏和血管负载极大，强行使用等同于自杀
      note: 伊迪亚以极高魔法资质和魔力储备驱动，爆发力强但风险高

  forbidden:
    - name: 空间魔法
      reason: 不确定性极高，禁止民间私自研究，魔法大国开发战略级术式的基础
    - name: 时间魔法
      reason: 同空间魔法并列
    - name: 生命魔法
      reason: 双刃剑——可治病救人也可杀人于无形，包括黑魔法死灵类和瘟疫类，曾带来灾祸

  special_cases:
    - name: 鬼种
      trait: 不依赖守护灵咏唱即可施展特殊法术天赋，亚人种中最强身体素质
      note: 鬼种法术基于魔法元素但不依赖守护灵咏唱
    - name: 泰拉/阿塔米德/纳比拉
      trait: 不信仰元素守护灵，使用其他方式施展基础魔法（如祈祷造物主）
      note: 各系别划分和能力表现与西方一般无二

magitech:
  summary: |
    魔导器以星核为核心，分为全魔导器（搭载星核）和半魔导器（具备魔力敏感性但无星核）。
    超古代科技与现代魔法国度技术并存，部分文明不信仰魔法体系而使用纯科技。

  star_core:
    - name: 星核
      function: 执行高复杂术式的运算中枢，代替施术者与元素守护灵建立沟通的控制核心
      requirement: 所有魔导器必须至少有一枚星核
    - name: 半魔导器
      trait: 具备魔力敏感性但没有搭载星核
      example: 露娜的弓——可变形复合弓，具备魔力敏感性但无星核
    - name: 人造星核
      description: 以仿生学模拟人脑设计，罗慕伦帝国技术，用于魔导超算

  devices:
    - name: 半魔导器示例
      example: 可变形复合弓，具备魔力敏感性但无星核
    - name: 魔导超算
      core: 人造星核
      note: 金鹿号核心主机，被阿尔比恩清除数据库后写入新程序
    - name: 魔导手环
      feature: 环状符文指示运行状态，可营造恒温有氧维生环境

ancient_tech:
  note: |
    超古代科技（Terran遗留）。现代文明均无法解析其原理，仅能逆向应用或仿制外壳。

  materials:
    - name: 泰坦-杜拉超结构合金
      alias: 超古代合金, 超结构合金
      description: 超古代遗迹主结构材料，银黑色，强度不可思议，几乎无法破坏，表面光滑，反射率极低的金属材质，150万年不会留下磨损痕迹

  weapons:
    - name: 相位技术
      description: |
        相位裂解术式、相位破阵炮，可解离物质。
        核心粒子为"娜蒂恩粒子(Nadion)"——可直接干涉时空连续体的人造粒子。
        全盛时期的Terran掌握将物体转相进入子时空泡并安全脱离的技术。
    - name: 断钢剑系统
      alias: 相位破城炮（Phase Destroyer）
      description: |
        阿尔比恩秘密超级武器，技术逆向自超古代相位技术（阿克夏之枪），非Terran原品。
        以巨大天空要塞地基内巨量零重素为动力源的核心炉驱动。
        最小出力可一击毁灭一座城市。
        战后王室严令禁止逆向研究，设计图被雪藏。
        伦底纽姆要塞事件中暴露，后被女王下令拆毁。

  transport:
    - name: 传送站
      description: 详见传送站系统条目

  defense:
    - name: 偏导护盾（Deflector Shield）
      description: 泰拉飞行舰防御系统
    - name: 结构完整性力场（Structural Integrity Field）
      description: 生成力场包裹结构，压缩分子间距

  intelligence:
    - name: 超古代主机/AI
      description: 泰拉总控中枢，被制造者以物理隔离方式封闭

modern_tech:
  note: |
    现代各文明独立发展的当代技术，不依赖超古代遗产或魔法体系。

  energy:
    - name: 魔导蒸汽机
      description: |
        以高浓度的零重素矿石为核心、通过对其自然反应进行人工制御来获取能量的发电系统。
        阿尔比恩舰船动力系统。本质是当代工业技术，非超古代遗留。

  daily_life:
    - name: 晶卡
      type: 货币
      description: 大陆通用货币卡片，标准化支付工具，各大陆通行。
      note: 现代金融体系产物，与魔法或超古代技术无关

civilization_tech:
  - name: 阿尔比恩
    tech: 魔导/蒸汽驱动舰船，浮空技术，火系防御魔法符文刻印在船体
    note: 魔法国度与自然科学混合
  - name: 瑞曼联邦
    tech: 完全自然科学国度，科技立国，最先进的舰船设计
    note: 与阿尔比恩的魔导/蒸汽驱动舰船完全不同
  - name: 艾康尼亚
    tech: 超古代遗迹（详见传送站系统条目），逆向解析材料学、建筑学等基础技术
    note: 对超古代核心解析至今无法完成，不允许大规模军事化
  - name: 伏尔坎
    tech: 盛产天然火系星核，魔导/蒸汽混合，风力资源开采产业兴盛
  - name: 泰拉
    tech: 不信仰魔法守护灵体系，使用科技武器
    note: 早期生活在科技遗骸上，关注有形之物，优先男性作为兵源
  - name: 星龙域
    tech: 使用象形文字（象形如尼文），不依赖守护灵咏唱
    note: 星龙域和泰拉已知族群仍使用象形文字，外界已淘汰

writing_system:
  - name: 字母型古如尼文
    type: 表音文字
    usage: 外界魔法文明普及，与魔法相性最好，外界语言多基于此变体
  - name: 象形如尼文
    type: 表意文字
    usage: 星龙域和泰拉已知族群使用，无需咏唱魔法
  - note: 外界早期将咏唱文刻写在沙土、木板、石头上，表音文字更易传授，象形文字被认为无用而被淘汰

space_magic_limitations:
  - "超视距传送需肉眼直视起始点和终点，否则极为危险"
  - "最稳定办法是在目标点位架设固定传送法阵，但消耗大，性价比不如超古代传送站"
  - "平时需借助实时观星，通过星相计算自身和传送目标的相对位置"
  - "极为复杂且需预先收集大量情报，人脑和星核计算力有限，误差随距离增大"
