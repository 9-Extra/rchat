name: 传送站系统
type: 世界观

overview: |
  超古代文明留下的永久交通网络，由遍布世界各地、至今仍在运转的传送站组成。
  传送站通过未知能源维持永久开放，连接世界各地的特定地点，传送过程只需一瞬间。
  世界各国对传送站没有任何实际操控权限，仅为使用者，无权解析或禁用。

appearance:
  - name: 艾康尼亚节点
    description: |
      直径一百多米的碟形建筑，由一根圆心的细细立柱支撑，全高五十余米。
      主要结构使用泰坦-杜拉超结构合金纤维，足以使遗迹屹立无数年月。
      内部是广阔圆形大厅，地面以电梯间为圆心呈台阶状逐级上升。
      分布着矩形的"门"，表面散发着空间涟漪，人或货物从门中出现或消失。
      下方是博物馆，配有电梯垂直上下。
  - name: 一般传送站
    description: |
      超古代遗迹建筑，使用泰坦-杜拉合金纤维，表面异常光滑、反射率极低的金属材质。

function:
  - name: 瞬间传送
    description: |
      穿过传送站只需一瞬间，从艾康尼亚到伏尔坎只需一瞬，否则需数月海运。
      能源来自未知来源，运转良好，取之不尽用之不竭。
  - name: 不受控制
    description: |
      艾康尼亚人没有实际操控权限，无法控制传送站。
      全世界传送站不受任何人控制，各国只是"借用"超古代遗产。
      通行证一旦发放，除非物理回收否则禁用不了。

distribution:
  - name: 艾康尼亚
    description: 双子大陆核心节点，数十台传送站，与世界各地特定地区相连。罗慕伦和瑞曼的祖先即通过此处传送站来到双子大陆。
  - name: 戈尔（伏尔坎）
    description: |
      伏尔坎通向外界的交通枢纽，有管控全世界所有传送站的枢纽主机和外部控制台。
      城市建立在一座小型超古代遗迹之上，传送站系统是伏尔坎社会体系的核心。
  - name: 泰拉
    description: 各处发现复数还在运转的传送站，一些独立的站点通向艾康尼亚之外的未知区域。但超古代普世城内似乎未建立传送交通网络，原因不明。
  - name: 尤克特拉希尔
    description: 穿过传送站后设备（指南针到高空同步定位装置）都会失去作用。
  - name: 星龙域
    description: 腹地有唯一被确认能安全通往泰拉下层的传送站，外界人极少了解。

classification:
  - name: 普通传送站
    description: 无限制开放，在柜台办理通行证即可随时使用。
  - name: 特殊传送站
    description: |
      通往极度危险区域（超古代军事设施、死亡地带、未知地带），必须持有对应的特殊通行证。
      通行证只发给受认证的探索团体，普通人无法使用。
      特殊传送站的对面包括里世界、超古代军事设施等极端区域。

historical_significance:
  - 罗慕伦和瑞曼的祖先通过传送站来到双子大陆
  - 伏尔坎人是最早穿越传送门的先驱者
  - 改变世界的重要设施，将原本距离遥远的数个大陆紧密联系起来
  - 使许多人很难想象没有传送站的生活会变成什么样

technology_influence:
  - name: 舰装技术
    description: 伏尔坎舰装内部没有储藏武器弹药的结构，正是靠从传送站中解析出来的技术达成。传送站技术被伏尔坎高度逆向解析，融入社会体系。
  - name: 真空管列车
    description: 泰拉内部的轨道交通系统，与艾康尼亚的真空管列车类似，是否源自传送站技术尚不明确。

special_phenomena:
  - name: 未知地带
    description: 某些特殊传送站通向未知区域，先驱者大多未能成功返航。
  - name: 里世界通道
    description: 某些传送站可以通往里世界，如尤克特拉希尔传送站连接里世界（星体世界内壁）。

atmosphere: |
  超古代文明留下的神秘交通网络，碟形建筑、空间涟漪、永恒运转。
  改变世界的基础设施，却不受任何人控制，能源来源不明。
  普通传送站便利日常，特殊传送站通向未知与危险。
