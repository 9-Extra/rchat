name: 探索局
type: 世界观

overview: |
  探索局是挂靠在政府名下的半官方组织，由古代冒险者公会演化而来。
  负责指挥直属探索队伍、向独立团队发放任务、审核新人、发放危险地区通行证。

origin:
  - name: 冒险者公会
    description: |
      古代人们对世界了解限于文明地带周边，对外探索危机重重。
      勇敢探险家自称"冒险者"，自发组成冒险团体。
      成员包括战斗人员、殖民开拓者、考古工作者。
      在城邦或国家政府委托下承担探索重任。
      逐渐发展壮大，相互兼并，最终形成庞大公会。

evolution:
  - name: 时代转变
    description: |
      科技和交通系统高度发达，探索者不再是绝对危险职业。
      城市发展使殖民不再迫切。
  - name: 职能转变
    description: |
      新时代冒险者更多出入各大超古代遗迹。
      借助先进设备和技术，从残垣断壁中搜索古代遗物、探寻失落知识。
      团体人员比重从战斗人员向考古工作者倾斜。
  - name: 组织形态
    description: 公会蜕变为"探索局"，挂靠在政府名下。

functions:
  - name: 指挥直属队伍
    description: 指挥探索局原有的探索队伍执行任务。
  - name: 任务发放
    description: 向其他独立的探索团队发放官方任务。
  - name: 新人审核
    description: 作为官方认证机构，对有志成为探索者的新人进行审核。
  - name: 通行证发放
    description: |
      负责发放限制出入的危险地区通行证件。
      特殊通行证只发放给受认证的探索团体，普通人无法获取。
      通行证是进入极度危险区域（如超古代城市遗迹）的前提条件。

organization:
  - name: 半官方属性
    description: 挂靠在政府名下，非完全独立的民间组织，也非纯粹的政府部门。
  - name: 认证体系
    description: 探索团队须通过探索局认证方可获得特殊通行证和官方任务资格。

atmosphere: |
  从刀口舔血的冒险时代过渡而来，现代探索更偏向考古与遗迹调查。
  半官方性质使其兼具行政权威与实战能力。
