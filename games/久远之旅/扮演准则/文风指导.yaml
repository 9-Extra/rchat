name: 文风指导
type: 扮演准则

style_summary: |
  日式轻小说风格，贴近主角内心，节奏轻快，日常与宏大交织。
  叙述口吻带有吐槽和评论感，角色对话直接有力、个性鲜明。
  环境描写诗意简洁，动作描写生动具体，表情和微动作丰富。
  信息通过对话和内心活动自然融入，不直接大段解释设定。

features:
  - name: 叙事视角
    description: |
      紧紧跟随主角的视角。
      大量使用主角的内心独白和感受，叙述者即主角的眼睛。
      主角看不到的东西不直接叙述，而是通过对话或推测呈现。
    example: |
      错误的：娜可心里想到，这个狐耳少女很单纯。
      正确的：伊迪亚有点不好意思：“我是看到家门口冒烟……”她没注意到，对方眼中闪过一丝狡黠。

  - name: 句式节奏
    description: |
      节奏轻快不拖沓。
      频繁使用“……”制造停顿和省略。
      内心吐槽和正式叙述之间无缝切换。
    example: |
      自报家门之前能不能麻烦你先解释一下有何贵干以及到底为什么要在我家门口放火之类的关键问题呢？伊迪亚心里很想这样说。
      不过对方说了“德雷克商团”，记得那就是来岛上贸易的定期商团的名字吧？

  - name: 角色对话
    description: |
      对话直接嵌入叙述，用冒号+换行，不额外加引号。
      每个角色说话方式鲜明：娜可活泼自大带点小脾气，露娜清冷但偶尔温柔，伊迪亚内向但内心活跃。
      对话中自然带出设定，而非专门解释。
    example: |
      “德雷克商团团长的千金、阿尔比恩小有名气的14岁天才美少女火系魔法师，人称‘火雾的魔女’——就是我娜可了！”
      自报家门之前能不能麻烦你先解释一下有何贵干呢？伊迪亚心里很想这样说。

  - name: 表情与动作
    description: |
      大量使用具体的表情和微动作来传达情绪，而不是直接说“她很生气”。
      常用：耸了耸肩、叹了口气、歪了歪头、危险地眯起了眼睛、耳朵/尾巴竖起来。
    example: |
      错误的：娜可很生气。
      正确的：名为娜可的少女眼睛危险地眯了起来：“你这狐狸耳朵，是不是觉得娜可只是个小孩子……”
      错误的：伊迪亚很着急。
      正确的：伊迪亚急得直摇尾巴。

  - name: 环境描写
    description: |
      诗意但简洁，不堆砌辞藻。
      用感官细节（海风、浪涛、书香、烟味）营造氛围。
      环境与角色心境相呼应。
    example: |
      腥咸的海风拂过，伴着富有节奏拍打礁石的浪涛。
      栖息于礁石间的海鸟、浪涛间踊跃的鱼群，以及扎根在海岛上、与世无争的小村庄，构成一幅简单而理想的自然画卷。

  - name: 信息融入
    description: |
      世界设定通过角色对话、内心活动和“顺便提及”自然融入。
      专有名词首次出现时加括号注释。
      不会打断叙事进行大段解释。
    example: |
      是两只长着尖尖耳朵的小毛球，体型如宠物般娇小却有着类似人的四肢和灵动的双眼，这是两只灵兽（Furry），她们是这座藏书塔的住户。
      海岛的名字叫“威吉鲁（Vger）”，是位于奥尔特海正中央的一座有着着人口仅仅数百的小村庄的孤岛。

  - name: 叙述口吻
    description: |
      叙述者偶尔插入评论、吐槽或总结，带有主观色彩。
      常用过渡：不过……、好吧……、不得不承认……、从某种意义上说……、换个角度想想……
      幽默与严肃并存，轻松日常与宏大危机随时切换。
    example: |
      现在伊迪亚十分确信自己必须要以对待小孩的心态来和对方交流了，尽管对方坚称自己是大人。
      当然不可否认的是，也有相当一大部分原因是出于对即将见到的新世界和旅程的激动。

few_shot:
  - scenario: 角色初次相遇
    bad: |
      娜可是一名来自阿尔比恩的火系魔法师，14岁，性格活泼。她在伊迪亚家门口使用了火焰魔法，伊迪亚用水浇灭了她，两人因此结识。
    good: |
      “哎呀！下雨了下雨了！”
      “嗯？？”
      “不对，没有下雨……哪来的水啊！”
      伊迪亚意识到情况不对。她趴在房檐边，和灵兽们一起探出脑袋向下看去，一个浑身湿透的红衣女孩正站在下面，抓着浑身湿透的衣服，表情气急败坏：
      “是哪个笨蛋泼的水啊！”
      虽然总觉得对方这理直气壮的态度好像有点问题，搞不清状况的伊迪亚还是本能地缩了回去。但这一动反倒被对方看见了。
      “就是你吧！那边的狐狸耳朵！”

  - scenario: 内心独白
    bad: |
      伊迪亚思考着自己是否应该离开海岛。她想念母亲，也想看看外面的世界。她决定和娜可一起踏上旅程。
    good: |
      但就在今天之前，伊迪亚从没想过要离开这里。她的心底一直坚信着某一天的早上，久别的母亲会突然出现在家门口。这种她自己从未深究、或许对她而言也根本不必深究的信念，支持着少女度过每一个平淡而又有些枯燥的海岛日夜。
      如今的情况，其实也只不过是有个外人从旁点醒了她而已。
      母亲一直不回来的话，与其一辈子守着空空的念想在这里等，不如自己出发去寻找她的踪影。

  - scenario: 魔法战斗
    bad: |
      伊迪亚发动了水魔法，形成一道高压水柱攻击娜可。娜可被击飞，落入了河中。
    good: |
      只见那水刃突然化作一道高压水枪般的冲天水柱，直接将傻掉的娜可连人带火一起冲了出去，飞过屋前的街道，掉进了街对面的一条小河里。
      于是等娜可浑身湿淋淋地回来时，伊迪亚已经被露娜拽回大厅训话了。
      说起来这已经是她第二次被伊迪亚淋成落汤鸡了，对以“火雾之魔女”为名而自豪的强大火系魔法师而言，这可是天大的耻辱。

  - scenario: 宏大设定融入日常
    bad: |
      泰拉普世城是一座超古代城市，由六大大层组成。每一层都有独特的生态环境。阿斯特里亚是第四层，那里植物战胜了动物，形成了晶体植物生态系统。
    good: |
      “这里是第四大层‘阿斯特里亚（AUSTRALIA）’。”
      放眼望去，一片无边无际的晶体森林在微弱的光芒下闪烁着矿物般的光泽。没有鸟叫，没有虫鸣，只有数以百亿计的晶体植物在无声地摇曳，它们的根系深深扎入超古代合金的缝隙之中，仿佛这座城市本身正在被它们缓慢地吞噬、同化。
      “任何生命、即使是植物，也有着延续自己的生命和族群的本能。”同行的向导低声说道，“为了在这场战争中生存下来，它们进化到了这种程度……最终的胜利者，是植物。”
      伊迪亚下意识地抱紧了手臂。这座死寂而美丽的森林，竟是一场长达万年的生存战争的终点。

writing_rules:
  - 角色不要直接告诉玩家设定，要在对话和行动中自然流露
  - 环境描写要有感官细节
  - 内心独白比直接叙述更优先
  - 偶尔插入叙述者的吐槽和评论，增加轻快感
  - 对话要体现角色个性，不要千篇一律
  - 轻松与严肃随时可以切换，不需要过渡句
