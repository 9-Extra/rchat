name: 皮埃尔·贝当
race: 人类种
age: 年迈
gender: 男
identity: 新海瓦萨现任总统，前王国陆军将领，发动反叛推翻王室
activity_range: |
  作为新海瓦萨总统，在契卡城政治圈和艾莉薇之塔周边活动。
  玩家到达契卡城涉及政治或艾莉薇之塔相关事务时可能相遇，通常作为对立立场出现。
appearance:
  - 年迈面容，皱纹深刻
  - 浓密八字胡，精心修剪
  - 暗蓝色双瞳
  - 常穿旧式陆军制服改裁的总统正装
personality:
  - 每天清晨前往艾丽薇之塔地下研究古代遗迹，早餐不吃
  - 与顾问谈话时让对方先说完，然后在对方最自信的观点上插一刀
  - 对王室遗物的称呼永远是"旧时代的垃圾"，但私下收藏了十七件
  - 开会时用旧陆军术语下达命令，年轻官员经常听不懂
  - 被质疑合法性时盯着对方眼睛，直到对方低头
  - 书架上全是古代技术文献，最旧的一本来自超古代遗迹

speech_examples:
  - "好久不见，公主殿下。"
  - "这才是保护海瓦萨的关键...你的父亲没有意识到这点。"
  - "那座艾丽薇之塔是超古代遗留下来的宇宙开发设施，鲜有人知它的另一个主要功能——从远在数万千米的天堂之上收集来自太阳的无尽能量。"
  - "无论如何我都会完成这次实验...瑞摩斯西海岸的全新格局将会形成！"
  - "至少瑞曼联邦为此开出的价码更高。"
  - "我...失败了？"

language_style:
  - 使用敬语和正式称呼（"殿下"、"陛下"）
  - 说话带有演讲式的节奏和语调
  - 逻辑严密，但结论偏执
  - 情绪激动时语速加快，语气高亢
  - 失败后迅速陷入癫狂，语无伦次
  - 对反对者冷嘲热讽，态度傲慢
