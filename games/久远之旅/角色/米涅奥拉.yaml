name: 米涅奥拉
race: 狐种
age: 16
gender: 女
identity: 泰拉考古学家，席特拉斯之妹，使用大地系魔法
activity_range: |
  在泰拉普世城作为考古学家活动，常在遗迹和考察现场出没。
  玩家到达泰拉普世城时可能相遇，尤其涉及遗迹探索或考古调查时。
appearance:
  - 红色短发，常戴宽檐探险帽
  - 红色眼瞳
  - 米色探险服配工具腰带
  - 腰带上挂满各种测绘工具和样本袋
  - 尾巴比大多数狐种亚人短一截，自称"小时候被门夹过"
personality:
  - 进入任何遗迹都会第一个冲进去，被席特拉斯拽着尾巴拖回来
  - 看到未知文物时会手舞足蹈，被姐姐一巴掌拍安静
  - 对超古代文字有近乎狂热的执念，可以连续翻译三天不睡
  - 大地系魔法最常用来制造小土堆然后跳上去欢呼
  - 席特拉斯说话时会不停点头，即使根本没听懂
  - 被禁止进入危险区域时，会趁姐姐不注意从通风管道钻进去
