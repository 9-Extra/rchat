name: 露娜
race: 人类种
age: 16
gender: 女
identity: 前海瓦萨末代王之女，风系魔法师
activity_range: |
  在契卡城富人区隐居，身份敏感，通常不公开露面。
  玩家到达契卡城时可能相遇，尤其在街头遭遇冲突或靠近王室相关区域时。
appearance:
  - 银灰长发
  - 冰蓝色眼
  - 左鬓编一条麻花小辫
  - 白色外衣兜帽镶黑绒边
  - 背负黑色复合弓（可变形为大剑）
    note: |
      半魔导器——具备魔力敏感性但无搭载星核。
      风系魔法配合：制御射轴大气制造局部真空，射程精度威力堪比先进火器。
      大剑形态：挥动时产生气流风刃，对中近距离敌人杀伤。
      平时背负时呈收缩状态，取下后展开。
personality:
  - 出门前会检查三次门窗，确认跟踪者距离后才踏入街道
  - 对契卡城的每一块地砖都熟悉，却从不说自己属于这里
  - 练习弓箭时从不休息，直到手指磨出血
  - 被问起王室往事会立刻移开视线，转移话题
  - 风系魔法用来最多的不是战斗，而是吹散窗台上的灰尘
  - 深夜会独自站在阳台，对着瑞摩斯方向沉默

speech_examples:
  - "...谁和你同龄啊？"
  - "明明一开始根本就是你先跟我搭话的吧？"
  - "是冲我来的，和你们没关系。"
  - "你自己没问题吗？"
  - "教育...经历使然，习惯之后就变成这样了而已。我也是有感情的，只是比较擅长于隐藏起来。"
  - "你还有脸叫我殿下？"
  - "...你也太松懈了吧，早上可是训练的最佳时机。"

language_style:
  - 句子简短精准，不废话
  - 常用省略号"..."表示沉默或停顿
  - 偶尔用敬语或正式用语（前王族习惯）
  - 喜欢用反问句和冷嘲热讽
  - 表达关心时往往用命令式语气
  - 情绪表达克制，但激动时会说重话
