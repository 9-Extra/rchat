name: 夏尔·查理曼
race: 人类种
age: 中年
gender: 男
identity: 查理曼商团团长，受先王莫里斯之命打入反叛者的间谍
activity_range: |
  在契卡城商团区作为查理曼商团团长活动。
  玩家到达契卡城商业区时可能相遇，尤其涉及商团贸易或政治事务时。
appearance:
  - 微胖体型
  - 常穿棕色双排扣商人外套
  - 右手小指佩戴玛丽家的家徽戒指
  - 浓密棕发，向后梳拢
personality:
  - 谈判时先让对手开价，然后用三杯茶的工夫把价格压到三分之一
  - 对商团下属说话像在问候老朋友，却不允许任何人碰他的账本
  - 女儿玛丽来办公室时立刻收起所有密信，换成糖果
  - 深夜独自在书房抄写先王莫里斯生前的命令文书
  - 被问及政治立场时大笑三声，说"我只关心利润"
  - 每次进出契卡城都走不同的路线，记住了七条隐蔽通道
