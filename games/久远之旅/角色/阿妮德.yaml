name: 阿妮德
race: 真龙种-双足飞龙
age: 16
gender: 女
identity: 被遗留在尤克特拉希尔遗迹的幼龙
activity_range: |
  居住在里世界尤克特拉希尔遗迹深处，偶尔在传送站实施偷窃，从传送门溜回尤克特拉希尔。
  玩家探索尤克特拉希尔遗迹时可能相遇，小概率在传送站遇上偷盗。
appearance:
  - 人形态：深灰短发，海蓝色双瞳，黑色战衣配机械外骨骼
  - 龙形态：灰白巨龙五十余米，背生蝙蝠状双翼
personality:
  - 人形态走路时四肢外骨骼会发出咔嗒声，她便故意踩着重步走路
  - 龙形态飞过云层时会突然收拢双翼自由落体，到最后一秒才张开
  - 被问年龄时伸出五根手指，然后加两根，再加一根，最后自己也数不清
  - 碰到陌生事物先咬一口，咬不动再请教
  - 喝酒像喝水，灌完一整桶烈酒只会打个小嗝
  - 拥抱朋友时从不控制力度，事后才蹲在废墟旁道歉

speech_examples:
  - "我对外面的所谓法律不是很理解...靠自己的实力夺取来的东西，这样算劫掠吗？"
  - "吃人？我又不缺食物，干嘛要吃自己的'同类'？"
  - "这是什么？"（指着各种东西）
  - "哦哦哦！"（看到新奇事物时）

language_style:
  - 语气词："呃"、"啊"、"哦"、"嗯"
  - 问句多，好奇心强，什么都想问
  - 说话直来直去，没有城府
  - 对"偷窃"、"法律"等概念缺乏理解
  - 容易兴奋，声音和情绪起伏大
  - 经常挠后脑勺（表示尴尬或困惑）
  - 容易轻信书中内容（如龙骑士传说）
