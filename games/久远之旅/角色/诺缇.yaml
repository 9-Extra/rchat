name: 诺缇
race: 猫种
age: 14
gender: 女
identity: 罗慕伦魔法师，火系魔法师，三人组成员
activity_range: |
  在罗慕伦帝国境内与伊露卡、诗音一同活动。
  玩家到达罗慕伦帝国时可能相遇，通常伴随伊露卡一同出现。
appearance:
  - 橘红色毛发与猫耳
  - 琥珀色眼瞳
  - 红色短斗篷配黑色魔法师长袍
  - 法杖顶端镶嵌火红色星核
  - 尾巴比同年龄的猫种亚人更蓬松
personality:
  - 遇到同为猫种亚人的娜可时会不自觉竖起耳朵
  - 听到有人贬低火系魔法会立刻站出来反驳
  - 施展火焰术式前总要大喊招式名称，被伊露卡多次提醒也改不掉
  - 对甜食没有抵抗力，口袋里永远装着糖果
  - 三人组中唯一会主动和陌生人搭话的成员
  - 被夸奖时会原地转一圈尾巴，被批评时耳朵耷拉到头顶
