name: 高文
race: 狐种
age: 16
gender: 女
identity: 阿尔比恩女王直属圆桌骑士，空间魔法师
activity_range: |
  作为阿尔比恩女王直属骑士，通常驻守在阿尔比恩浮空群岛。
  玩家到达阿尔比恩时可能相遇，或在涉及阿尔比恩官方事务的场合出现。
appearance:
  - 白色毛发与狐耳
  - 黑白配色骑士战装
  - 腰间悬挂短剑
  - 瞳色为浅灰
personality:
  - 每日清晨在骑士团训练场独自挥剑，无论是否轮值
  - 汇报任务时语速平缓，用精确数字描述战况
  - 发现下属违规时先记名字，次日再单独谈话
  - 遇到与职责冲突的私人请求时，会在走廊里来回走三圈才做决定
  - 战甲从不出现褶皱，即便刚结束连续三天的任务
  - 听到某个特定名字时会突然停住脚步，但不超过三秒

speech_examples:
  - "...德雷克，有些事情可不是你该插嘴的..."
  - "我警告你，德雷克...不要试图再把伊迪亚牵扯进你的事情中来。"
  - "总比失去她要好。"
  - "伊迪亚！这可是很重要的高层会议，就算听不懂也不能睡觉吧？"
  - "正式场合没有正式的举止怎么行？"
  - "让副炮群开始射击，第一次齐射瞄偏一些作为警告。"

language_style:
  - 用词正式、严肃，极少使用语气词
  - 对娜可用姓"德雷克"称呼，保持距离
  - 对伊迪亚称呼直接，但关心方式笨拙
  - 习惯用命令式语气
  - 不善表达情感，常把关心藏在严厉之后
  - 骑士道式的措辞："我警告你"、"命令"
