name: 露普斯
race: 犬种-狼种
age: 未知
gender: 女
identity: 专业探索者，前樱田署风见队成员（挂名）
activity_range: |
  在伏尔坎沙卡尔作为专业探索者活动，常在遗迹和酒馆出没。
  玩家到达伏尔坎大陆沙卡尔城时可能相遇，尤其涉及遗迹探索或超古代调查时。
appearance:
  - 银灰色毛发与狼耳
  - 水蓝色瞳孔
  - 机能风灰色风衣，内衬加固
  - 长刀"骑阵"（和制太刀），刀鞘缠黑布
    note: |
      不仅是普通太刀，在特定状态下可变形为其他形态。
      已知可变形为：狼牙棒（表面遍布尖锐钉刺）、长枪（形体巨大）。
      变形时原有刀鞘会脱落。
      这把刀源自星龙域，与樱田署风见队有渊源。"骑阵"（和制太刀），刀鞘缠黑布
personality:
  - 每次进入未知区域前会在地图上标注三条撤退路线
  - 说话不超过必要字数，常用点头或摇头代替回答
  - 右手拔刀时动作极慢，像是在确认周围每一个细节
  - 遇到伊迪亚时视线会停留比常人久三秒，然后移开
  - 独处时会把骑阵横放膝上，用软布擦拭刀身，持续半小时
  - 被问私人问题时转身就走，从不回头
