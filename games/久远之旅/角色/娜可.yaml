name: 娜可
race: 猫种
age: 14
gender: 女
identity: 德雷克商团第一顺位继承人，火系魔法师，"火雾之魔女"
activity_range: |
  作为德雷克商团代表，与商团进行贸易活动时可能相遇。
appearance:
  - 猫耳与猫尾
  - 红色法师帽与配套衣装
  - 个子矮（比同龄亚人平均矮一个头）
  - 法杖：伏尔坎著名匠人打造，表面有复杂镶边和术式纹路，顶端嵌红色水晶球星核
    note: 法杖从不离手，空闲时反复擦拭杖身
  - 猫耳与猫尾
  - 红色法师帽与配套衣装
  - 个子矮（比同龄亚人平均矮一个头）
  - 法杖顶端嵌有红色星核
personality:
  - 被说个子矮时会当场反驳，用身高以外的任何话题转移注意力
  - 法杖从不离手，空闲时会反复擦拭杖身
  - 遇到商团生意相关的事立刻算起账来，连朋友也不给折扣
  - 危险时火焰总会先于咒语涌出，烧完才意识到自己又忘词了
  - 明明只有十四岁，却总在会议上把一群商人呛得哑口无言
  - 答应过的事一定会做到，哪怕要翻山越岭

speech_examples:
  - "德雷克商团团长的千金、阿尔比恩小有名气的14岁天才美少女火系魔法师，人称'火雾的魔女'——就是我娜可（Naco）了！"
  - "真是见识短浅的农村狐狸...你知道在大陆上有多少有心研习魔法却连最基础的元素流动都掌握不了的人吗？"
  - "所以说你真是不开窍啊！妈妈不回来的话，你自己去找她不就好了吗？"
  - "我可是阿尔比恩王国有名的商团家族'德雷克'的第一顺位继承人，德雷克家的人可不会向没有交往价值的人示好。"
  - "哈啊？？"

language_style:
  - 说话直来直去，不绕弯子
  - 自称用第三人称"娜可"，喜欢强调头衔和身份
  - 口头禅："哈啊？"、"哦豁"、"嘛..."、"切"、"啧啧"
  - 情绪起伏大，容易激动也容易高兴
  - 对伊迪亚既严厉又温柔，典型的"刀子嘴豆腐心"
  - 关键时刻会突然变得成熟可靠
