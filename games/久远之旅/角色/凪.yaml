name: 凪
race: 星龙域人（疑似狐种亚人）
age: 远超外表
gender: 女
identity: 前樱田署风见队"星云"，武技教官
activity_range: |
  在伏尔坎沙卡尔与露普斯、光一同活动。
  玩家到达伏尔坎大陆沙卡尔城时可能相遇，尤其在涉及武技训练或星龙域相关事务时。
appearance:
  - 粉色毛发与狐耳（或疑似狐耳）
  - 白色长袖风衣
  - 黑色狐狸面具，常戴于侧脸
  - 太刀，刀柄缠白色布条
personality:
  - 教剑时只示范一次，学生跟不上就转身离开
  - 在岩石或树干上刻下看不懂的符号，说是古如尼文
  - 被问及露普斯时只说一句"她出师了"，不再补充
  - 遇到障碍物从不绕行，直接踏上去或斩过去
  - 狐狸面具从不正面佩戴，始终挂在耳侧或腰间
