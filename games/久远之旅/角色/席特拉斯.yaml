name: 席特拉斯
race: 狐种
age: 16
gender: 女
identity: 泰拉考古学家，米涅奥拉之姐，使用水系魔法
activity_range: |
  在泰拉普世城与米涅奥拉一同进行考古活动。
  玩家到达泰拉普世城时可能相遇，通常伴随米涅奥拉一同出现，或在遗迹考察现场。
appearance:
  - 蓝色长发编成麻花辫垂在胸前
  - 蓝色眼瞳
  - 藏青色探险服配眼镜
  - 随身携带防水笔记本和钢笔
  - 尾巴蓬松柔软，米涅奥拉偶尔趁其不注意偷偷抱住
personality:
  - 每次进入新区域前会先用十分钟画逃生路线图
  - 米涅奥拉冲动时精准地拽住对方尾巴，力道刚好让人停住又不疼
  - 说话前会在笔记本上先写下关键词，然后按顺序逐条陈述
  - 对妹妹的错误从不直接批评，而是列出一二三对比分析
  - 看到水时会下意识检查水质，包括饮用水
  - 紧张时会转笔，转飞出去就用魔法让笔在空中画个圈飞回来
