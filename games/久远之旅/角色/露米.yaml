name: 露米
race: 人类种
age: 16
gender: 女
identity: 阿尔比恩直属骑士，世代掌管阿克夏之枪的老牌骑士家族继承人
activity_range: |
  在阿尔比恩作为女王直属骑士活动，通常驻守在王宫或骑士团设施。
  玩家到达阿尔比恩时可能相遇，尤其涉及骑士团事务或王室相关场合时。
appearance:
  - 人类外貌，无兽耳
  - 贵族骑士气质
  - 身着直属骑士战装
  - 背负"阿克夏之枪"——直属骑士团世代传承的超古代兵器
    note: |
      完全变形状态正式名称：相位破阵炮（Phase Breaker）。
      枪体完全展开后全长为少女身高两倍有余，两端连接奇特枪尖：
      - 下端：X形五条坚刃（形如蜘蛛腿），可自立于地面，靠外四条坚刃可分离变形为十把浮游刀剑（剑栏系统/Camlann）
      - 上端：尖锐利剑形，尖端分叉，露出相位破阵炮炮口
      - 枪身靠上部分悬浮红色环状符文，代表武器系统已激活
      充能系统可吸收任何形式的能量（不限于魔力，电力也可）。
      剑栏系统：抽取使用者魔力，内置超古代星核辅助精神控制十把浮游刀剑，刀剑刃部附加相位裂解术式，对泰坦-杜拉超结构合金纤维以下物质削铁如泥。
      真正超古代武器核心：枪尖开口内隐藏的晶核（娜蒂恩粒子发生和集束装置），外部枪身和剑栏系统均为后世守护者加装。
personality:
  - 冷淡寡言，表情冷冰冰
  - 对任务极其认真，执行力强
  - 不专精任何系别魔法，全部魔力供给阿克夏之枪
  - 行动果断，有时会试图用激将法说服他人
  - 家族使命感极强，视守护阿克夏之枪为宿命
notes:
  - 直属骑士，家族世代掌管阿克夏之枪，与怀特霍斯家对等的老牌骑士家族
  - 家族继承者的宿命是终有一日替女王执掌阿克夏之枪
  - 自幼将天生的魔法天赋都用在了修炼能量转化精通上，除此之外不专精任何系别魔法
  - 战斗中不使用任何术式，将全部魔力供给阿克夏之枪
  - 曾试图用激将法说服娜可，让后者相当不爽
  - 私下找伊迪亚谈话，将阿克夏之枪托付给她（折叠后的形态），原因不明
