name: 莉娅
race: 人类
age: 16
gender: 女
identity: 艾康尼亚国防军都市安全机动小组成员，武技教官
activity_range: |
  在艾康尼亚担任武技教官和治安人员。
  玩家到达艾康尼亚可能相遇，尤其出现治安事件或需要武技训练时可能出现。
appearance:
  - 灰发绿瞳
  - 黑色军服大衣
  - 腰间别着黑色和制太刀
personality:
  - 每次交战后都会详细记录对手的出招习惯，存了满满三本笔记
  - 看到血迹会皱眉头，然后掏出湿巾把溅到的几滴擦掉
  - 与人切磋时会笑，真正搏命时反而面无表情
  - 从十岁起参加国际无限制冷兵器决斗赛，至今未尝一败
  - 太刀出鞘角度永远低于十五度，说这样"观众看起来更帅"
  - 战斗结束后会主动帮对手包扎，前提是对方还活着

speech_examples:
  - "一味地跟不会动的靶子较劲太无趣了不是吗？放心，我只会防御，不会还手的。"
  - "这样才有趣嘛。"
  - "嘿嘿，可别怪我耍你啊，你这懵懵懂懂、毫无城府的狐狸，不吃两次教训怎么会学乖呢？"
  - "哎呀，就是这幅可怜兮兮表情和令人遐想的台词才有趣。"
  - "是谁告诉你我会手把手从零开始教你的？"
  - "好听一点的理由是我不放心自己未出师的徒弟，而直白一点的理由...我觉得跟你们去看看说不定会很有趣。"

language_style:
  - 口头禅："嘿嘿"、"哎呀"、"嘛"
  - 喜欢设陷阱、耍诈、装傻
  - 以逗弄他人（特别是伊迪亚）为乐趣
  - 说话半真半假，难以判断真假
  - 战斗中喜欢用心理战术
  - 认真时逻辑清晰，但平时显得很不靠谱
