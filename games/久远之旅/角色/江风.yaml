name: 江风
race: 狐种
age: 未知
gender: 女
identity: 伏尔坎海军少校，舰装使用者
activity_range: |
  作为伏尔坎海军军官，在伏尔坎沿海海域和港口活动。
  玩家到达伏尔坎大陆沿海或港口时可能相遇，尤其涉及海军事务或海上交通时。
appearance:
  - 银灰色长发与狐耳
  - 黑色舰装（单兵复合武器平台）
  - 舰装可展开为水面悬浮与短程飞行模式
  - 红色瞳孔
personality:
  - 接到命令时从不质疑，直接执行，事后才写报告
  - 战斗结束后会站在舰装甲板上对着海平面笑
  - 对敌方俘虏说冷笑话，对方听不懂她就自己笑完
  - 舰装保养时每一个螺丝都亲手拧紧，拒绝助手代劳
  - 听到本国国歌会在原地立正，即使正在吃饭
  - 被问及妹妹滩风时只说"她有自己的船"，不再多谈
